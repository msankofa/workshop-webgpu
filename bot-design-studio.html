// typo here costs a duplicate tile rather than an error — check against __studio.viewDirs.
const CRITIQUE_VIEWS = ['front', 'three', 'side', 'back', 'left', 'top'];
const CRITIQUE_NOTE = 'notes-helmet-critique.html';
const CRITIQUE_KEY = 'pcw:helmetCritique';   // same pcw: prefix as the panel's save/load slot

// The slot to judge: whichever one carries a helmet, else the edit slot. Judging the bare head by
// accident is a whole wasted round trip.
function critiqueSlot() {
  const i = slots.findIndex((s) => /helmet/.test(s.spec?.label || ''));
  return i >= 0 ? i : editSlotIndex;
}

// Let the REAL animation loop draw each frame and just wait for it. Driving drawFrame() directly
// instead was tried and is worse in both directions: called alongside the loop, two async renders
// interleave on one renderer and the read-back returns a stale present (every tile came out as the
// same wide shot); with the loop suspended, the frames render blown out and empty.
//
// The cost of depending on the loop is that rAF is suspended in a backgrounded tab, so this throws
// there rather than waiting forever on a frame that is never coming.
const nextFrame = () => new Promise((resolve, reject) => {
  if (document.hidden) {
    reject(new Error('studio tab is in the background — rAF is suspended there, so no new frame renders. Bring the window to the front and capture again.'));
    return;
  }
  requestAnimationFrame(() => resolve());
});

async function captureViews(part, { slot = 0, dirs = CRITIQUE_VIEWS, margin = 1.5, side = 'right' } = {}) {
  const wasPaused = window.__studio.paused;
  window.__studio.setPaused(true);          // hold the pose identical across every angle
  window.__studio.showLabels(false);
  const shots = [];
  try {
    for (const dir of dirs) {
      window.__studio.focusPart(part, { slot, dir, margin, side });
      await nextFrame(); await nextFrame();   // one to draw the moved camera, one to present it
      shots.push({ dir, url: renderer.domElement.toDataURL('image/png') });
    }
  } finally {
    window.__studio.setPaused(wasPaused);
    window.__studio.showLabels(true);
  }
  return shots;
}

// Centre-square CROP, not a fit. The viewport is wide and focusPart already filled it with the
// part, so letterboxing the whole frame into a square cell would shrink the subject to a third of
// the tile and defeat the point of looking closely.
async function contactSheet(shots, cell = 460) {
  const imgs = await Promise.all(shots.map((s) => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = s.url;
  })));
  const cols = Math.min(shots.length, 3);
  const rows = Math.ceil(shots.length / cols);
  const c = document.createElement('canvas');
  c.width = cols * cell; c.height = rows * cell;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0f14'; g.fillRect(0, 0, c.width, c.height);
  imgs.forEach((im, i) => {
    const x = (i % cols) * cell, y = Math.floor(i / cols) * cell;
    const src = Math.min(im.width, im.height);
    g.drawImage(im, (im.width - src) / 2, (im.height - src) / 2, src, src, x, y, cell, cell);
    g.strokeStyle = '#1d2a36'; g.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
    g.fillStyle = '#8fd6ff'; g.font = 'bold 18px monospace';
    g.fillText(shots[i].dir, x + 12, y + 28);
  });
  return c.toDataURL('image/png');
}

function openCritique(sheetUrl, caption) {
  document.getElementById('critiqueModal')?.remove();
  const wrap = el('div', '', document.body);
  wrap.id = 'critiqueModal';
  Object.assign(wrap.style, {
    position: 'fixed', inset: '0', zIndex: '9999', background: 'rgba(4,7,10,0.93)',
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px',
    padding: '14px', overflow: 'auto', font: '13px system-ui, sans-serif', color: '#cfe3f2',
  });
  const head = el('div', '', wrap);
  head.textContent = caption;
  Object.assign(head.style, { opacity: '0.75', letterSpacing: '0.02em' });

  const img = el('img', '', wrap);
  img.src = sheetUrl;
  Object.assign(img.style, {
    maxWidth: 'min(1180px, 97vw)', maxHeight: '58vh', objectFit: 'contain',
    border: '1px solid #24333f', borderRadius: '6px', background: '#0b0f14',
  });

  const ta = el('textarea', '', wrap);
  ta.id = 'critiqueText';
  ta.placeholder = 'What is wrong with it? Be blunt — this is the only input that changes anything.';
  Object.assign(ta.style, {
    width: 'min(1180px, 97vw)', height: '18vh', minHeight: '90px', resize: 'vertical',
    background: '#0e151c', color: '#e6f1fa', border: '1px solid #24333f', borderRadius: '6px',
    padding: '10px', font: '13px ui-monospace, monospace',
  });

  const row = el('div', '', wrap);
  Object.assign(row.style, { display: 'flex', gap: '8px', alignItems: 'center' });
  const status = el('span', '', row);
  Object.assign(status.style, { opacity: '0.7', marginLeft: '8px' });

  function mkBtn(label, fn) {
    const btn = el('button', '', row);
    btn.textContent = label;
    Object.assign(btn.style, {
      background: '#16222c', color: '#cfe3f2', border: '1px solid #2c3d4b',
      borderRadius: '5px', padding: '7px 14px', cursor: 'pointer', font: '13px system-ui, sans-serif',
    });
    btn.addEventListener('click', fn);
    return btn;
  }

  mkBtn('send comment', async () => {
    const text = ta.value.trim();
    if (!text) { status.textContent = 'nothing typed'; return; }
    // localStorage FIRST and unconditionally, because it cannot fail. The POST is best-effort:
    // serve.py only grew /api/save-notes on 2026-08-02, so any server process started before that
    // 404s it and returns an HTML error page, and a typed critique must not be lost to a stale
    // process the page has no way to detect.
    localStorage.setItem(CRITIQUE_KEY, JSON.stringify({ text, caption, at: new Date().toISOString() }));
    status.textContent = 'saved — ';
    // Wrapped in minimal HTML because save-notes' filename guard requires .html; the comment stays
    // plain text inside <pre> so it reads the same in a browser and in a file read.
    const body = `<!doctype html><meta charset="utf-8"><title>${caption}</title>\n`
      + `<h3>${caption}</h3>\n<pre>${text.replace(/[<&]/g, (ch) => (ch === '<' ? '&lt;' : '&amp;'))}</pre>\n`;
    try {
      const res = await fetch(`/api/save-notes?filename=${CRITIQUE_NOTE}`, { method: 'POST', body });
      const json = res.headers.get('content-type')?.includes('json') ? await res.json() : { ok: false, error: `server has no /api/save-notes (HTTP ${res.status}) — restart serve.py to enable the file copy` };
      status.textContent += json.ok ? `also written to ${json.path}` : `browser only (${json.error})`;
    } catch (err) {
      status.textContent += 'browser only (' + err.message + ')';
    }
    flash('critique received');
  });
  mkBtn('save sheet', () => {
    const a = document.createElement('a');
    a.href = sheetUrl; a.download = 'critique-sheet.png'; a.click();
  });
  mkBtn('close', () => wrap.remove());
  ta.focus();
}

async function runCritique(part, opts = {}) {
  flash('capturing…');
  try {
    const shots = await captureViews(part, opts);
    const sheet = await contactSheet(shots);
    openCritique(sheet, `${part} — slot ${opts.slot ?? 0} — ${shots.map((s) => s.dir).join(' / ')}`);
    flash(`captured ${shots.length} views`);
  } catch (err) {
    flash('capture failed: ' + err.message);
    console.error(err);
  }
}
window.__studio.critique = runCritique;
</script>
