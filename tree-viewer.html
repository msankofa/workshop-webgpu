<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d23; }
  #dbg { position: fixed; bottom: 10px; left: 12px; color: #c4ccd6; background: rgba(20,24,30,.86);
    border: 1px solid #333a45; border-radius: 8px; padding: 6px 10px; font: 11px/1.5 monospace;
    white-space: pre; user-select: none; z-index: 5; }
  #info { position: fixed; top: 10px; left: 12px; color: #8a93a3;
    font: 12px/1.5 system-ui, sans-serif; user-select: none; pointer-events: none;
    max-width: calc(100vw - 280px); z-index: 5; }
</style>
</head>
<body>
<div id="dbg"></div>
<div id="info">drag&nbsp;orbit &middot; scroll&nbsp;zoom &mdash; standalone procedural tree tuning tool</div>

<!-- three@0.184.0: same CDN pins as environment-viewer.html -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexHull } from 'three/addons/math/ConvexHull.js';
import { createLightingRig } from './lights.js';
import { createTree } from './trees.js';
import { createTextureSource } from './tree-textures.js';
import { applyAge } from './tree-age.js';
import { EZ_TREE_FAMILIES } from './tree-presets.js';
import { createLodPreview, HOST_PRESETS } from './tree-lod-preview.js';

const infoEl = document.getElementById('info');
function showError(msg) { if (infoEl) { infoEl.innerHTML = '⚠ ' + msg; infoEl.style.color = '#ffb3b3'; } }
addEventListener('error', e => showError(e.message || 'script error'));
addEventListener('unhandledrejection', e => showError((e.reason && e.reason.message) || String(e.reason)));

// ===================== renderer / scene / camera =====================
const renderer = new WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d23);

// Far enough for the environment-viewer LOD rings (billboards at 1.25 x 583 m).
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(18, 12, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ===================== lighting =====================
const rig = createLightingRig({ scene, ui: false, elevation: 45, azimuth: 100, sunIntensity: 4, ambientIntensity: 1.05 });
rig.dirLight.castShadow = true;
scene.add(rig.dirLight.target);
rig.dirLight.shadow.mapSize.set(2048, 2048);
rig.dirLight.shadow.camera.near = 1; rig.dirLight.shadow.camera.far = 120;
rig.dirLight.shadow.camera.left = -30; rig.dirLight.shadow.camera.right = 30;
rig.dirLight.shadow.camera.top = 30; rig.dirLight.shadow.camera.bottom = -30;
const SHADOW_DEFAULT = { half: 30, far: 120 };
// Solo/grid keep the tight 60 m box; LOD mode widens it to cover every cluster (blurrier, but present).
let shadowBox = null;
function fitShadowTo(box) {
  shadowBox = box;
  const sc = rig.dirLight.shadow.camera;
  const half = box ? Math.max(SHADOW_DEFAULT.half, box.getBoundingSphere(new THREE.Sphere()).radius * 1.1) : SHADOW_DEFAULT.half;
  sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
  sc.far = box ? half * 4 : SHADOW_DEFAULT.far;
  if (box) { box.getCenter(rig.dirLight.target.position); rig.dirLight.position.copy(rig.dirLight.target.position).addScaledVector(rig.dirLight.position.clone().normalize(), half * 2); }
  sc.updateProjectionMatrix();
}

// ===================== ground =====================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(3000, 3000),
  new THREE.MeshStandardMaterial({ color: 0x3a4a32, roughness: 1 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== tree data model =====================
// trees.js's Tree constructor deep-merges user options over its internal DEFAULTS and stores
// the merged result as `.options` — using that (rather than re-declaring DEFAULTS here) keeps
// `opts`'s shape guaranteed identical to what createTree()/regenerate() expect.
// Cloned, not aliased: merge() shares nested objects with trees.js's DEFAULTS, so writing to
// opts.bark/opts.leaves in place would edit that module-level default for every later tree.
const _genTree = createTree({});
const opts = structuredClone(_genTree.options);
_genTree.dispose();
// Captured once, immediately, before any user interaction — the Restart button resets to this
// regardless of how far the live `opts` has drifted since.
const DEFAULT_OPTS = structuredClone(opts);

let mode = 'solo';        // 'solo' | 'grid' | 'lod'
let gridSize = 3;
let baseSeed = opts.seed;
let texMode = 'authored';
let texSet = createTextureSource('authored', { onReady: () => scheduleRegenerate() });
let previewAge = 1;       // 0=sapling..1=mature; only Solo mode renders through applyAge(opts, previewAge)

let soloTree = null;
let gridTrees = [];
// LOD mode: clusters of n trees at every tier the game draws, baked by forest-palette.js itself.
const lodPreview = createLodPreview({ renderer, scene, createTree });
const lodSettings = {
  n: 3, layout: 'rings', distance: 100, density: 120, preset: 'base game',
  rings: [...HOST_PRESETS['base game'].rings], billboards: HOST_PRESETS['base game'].billboards,
  branchLods: structuredClone(HOST_PRESETS['base game'].branchLods),
  coarseLeafRatio: 0.25, coarseLeafSizeMult: 2.5, midLeafRatio: 1, midLeafSizeMult: 1, leafShadowPct: 0.3,
};
function applyHostPreset(name) {
  const h = HOST_PRESETS[name];
  lodSettings.preset = name;
  lodSettings.rings = [...h.rings]; lodSettings.billboards = h.billboards;
  lodSettings.branchLods = structuredClone(h.branchLods);
  lodSettings.coarseLeafRatio = h.coarseLeafRatio; lodSettings.coarseLeafSizeMult = h.coarseLeafSizeMult;
  lodSettings.midLeafRatio = h.midLeafRatio; lodSettings.midLeafSizeMult = h.midLeafSizeMult;
}
let lodBuildPending = false;
function buildLod(refit) {
  const t0 = performance.now();
  lodBuildPending = true;
  lodPreview.build({ opts: applyAge(opts, previewAge), texSet, n: lodSettings.n, layout: lodSettings.layout,
    distance: lodSettings.distance, density: lodSettings.density, leafShadowPct: lodSettings.leafShadowPct,
    params: { branchLods: lodSettings.branchLods, coarseLeafRatio: lodSettings.coarseLeafRatio,
      coarseLeafSizeMult: lodSettings.coarseLeafSizeMult, midLeafRatio: lodSettings.midLeafRatio, midLeafSizeMult: lodSettings.midLeafSizeMult,
      rings: lodSettings.rings, billboards: lodSettings.billboards } })
    .then(() => { lodBuildPending = false; lastBuildMs = performance.now() - t0; fitShadowTo(lodPreview.bounds()); if (refit) fitCameraToLod(); });
}
// Eye at the origin, 1.7 m up, looking down +Z at the LOD1 cluster (or the compare distance).
function fitCameraToLod() {
  const z = lodSettings.layout === 'side' ? lodSettings.distance : lodSettings.rings[1];
  const h = lodPreview.bounds().getSize(new THREE.Vector3()).y || 10;
  camera.position.set(0, 1.7, 0);
  controls.target.set(0, h * 0.4, z);
  controls.update();
}
let refreshExport = () => {};   // reassigned once the Export section builds its textarea (Task 7)

function disposeTree(t) { scene.remove(t); t.dispose(); }

// Debug panel state: build time of the last createTree, plus a frame-time EMA from the render loop.
const dbgEl = document.getElementById('dbg');
let lastBuildMs = 0, frameMs = 16.7, lastFrameAt = performance.now(), dbgFrames = 0;
function liveTrees() { return mode === 'solo' ? (soloTree ? [soloTree] : []) : mode === 'grid' ? gridTrees : []; }
function refreshDebugPanel() {
  const trees = liveTrees();
  let branches = 0, leaves = 0;
  for (const t of trees) { branches += t.stats?.branches ?? 0; leaves += t.stats?.leaves ?? 0; }
  const info = renderer.info.render;
  dbgEl.textContent =
    `fps ${(1000 / frameMs).toFixed(0)}  frame ${frameMs.toFixed(1)} ms  build ${lastBuildMs.toFixed(1)} ms
` +
    `trees ${trees.length}  branches ${branches}  leaves ${leaves}
` +
    `tris ${info.triangles}  draws ${info.drawCalls}  rejected ${rejectedMutations}
` +
    `height ${treeMetrics.height.toFixed(1)} m  width ${treeMetrics.width.toFixed(1)} m  ` +
    `footprint ${treeMetrics.area.toFixed(1)} m²  hull volume ${treeMetrics.volume.toFixed(0)} m³`;
  if (mode === 'lod') {
    const camZ = camera.position.z;
    for (const st of lodPreview.stats) {
      dbgEl.textContent += `\n${st.name} at ${(st.distance - camZ).toFixed(0)} m  ` + (st.count != null ? `trees ${st.count}  ` : '') + `tris ${st.tris}  leaves ${st.leaves}` +
        (st.name === 'LOD0' ? '' : `  (${(100 * st.tris / Math.max(1, lodPreview.stats[0].tris)).toFixed(0)}% of LOD0)`);
    }
    if (lodBuildPending) dbgEl.textContent += '\nbaking…';
  }
}

// Safeguards: a mutation whose result exceeds an enabled limit is rejected and the tree restored.
const safeguards = {
  tris: { on: false, max: 200000 }, leaves: { on: false, max: 5000 }, branches: { on: false, max: 2000 },
};
let rejectedMutations = 0;
let lastAborted = null;   // set by rebuildTree when trees.js stopped the walk at a limit
// Limits are per tree; in grid mode each tree walks separately and any one of them can abort.
function activeLimits() {
  const l = {};
  for (const k of ['tris', 'leaves', 'branches']) if (safeguards[k].on) l[k] = safeguards[k].max;
  return Object.keys(l).length ? l : null;
}
// Shape metrics, computed once per rebuild (not per frame): height and width from the bounds,
// footprint area from a 2D hull of the XZ projection, volume from the 3D convex hull. Vertices are
// subsampled to about 3000 points so the hull stays cheap at auto-mutate rates.
let treeMetrics = { height: 0, width: 0, area: 0, volume: 0 };
const _hull = new ConvexHull();
function computeTreeMetrics(trees) {
  const pts = [];
  let total = 0;
  for (const t of trees) t.traverse(o => { if (o.isMesh) total += o.geometry.getAttribute('position')?.count ?? 0; });
  const stride = Math.max(1, Math.floor(total / 3000));
  const box = new THREE.Box3();
  for (const t of trees) {
    t.updateWorldMatrix(true, false);
    t.traverse(o => {
      if (!o.isMesh) return;
      const a = o.geometry.getAttribute('position'); if (!a) return;
      for (let i = 0; i < a.count; i += stride) {
        const v = new THREE.Vector3().fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld);
        pts.push(v); box.expandByPoint(v);
      }
    });
  }
  if (pts.length < 4) { treeMetrics = { height: 0, width: 0, area: 0, volume: 0 }; return; }
  const size = box.getSize(new THREE.Vector3());
  // 2D hull (monotone chain) of the XZ footprint, then the shoelace area
  const flat = pts.map(p => [p.x, p.z]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of flat) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = flat.length - 1; i >= 0; i--) { const p = flat[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  const ring = lower.slice(0, -1).concat(upper.slice(0, -1));
  let area = 0;
  for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; area += a[0] * b[1] - b[0] * a[1]; }
  area = Math.abs(area) / 2;
  // 3D hull volume: sum of tetrahedra from the origin over each face
  let volume = 0;
  try {
    _hull.setFromPoints(pts);
    for (const face of _hull.faces) {
      const a = face.edge.head().point, b = face.edge.next.head().point, c = face.edge.next.next.head().point;
      volume += a.dot(new THREE.Vector3().crossVectors(b, c)) / 6;
    }
  } catch { volume = 0; }
  treeMetrics = { height: size.y, width: Math.max(size.x, size.z), area, volume: Math.abs(volume) };
}
function overLimit() { return lastAborted; }

function makeTree(treeOpts) {
  const t0 = performance.now();
  const t = createTree(treeOpts);
  lastBuildMs = performance.now() - t0;
  t.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return t;
}

function fitCameraToBox(box, radiusMult, minDist) {
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const dist = Math.max(sphere.radius * radiusMult, minDist);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (!isFinite(dir.x) || dir.lengthSq() === 0) dir.set(0.6, 0.5, 0.6).normalize();
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(dir, dist);
  controls.update();
}
function fitCameraTo(object3d) { fitCameraToBox(new THREE.Box3().setFromObject(object3d), 2.4, 6); }
function fitCameraToGrid() {
  const box = new THREE.Box3();
  for (const t of gridTrees) box.expandByObject(t);
  fitCameraToBox(box, 1.8, 10);
}

// Every change rebuilds the geometry in place through Tree.rebuild(), which also syncs the
// materials (colour, roughness, maps) and only recompiles them when a shader-shaping property
// changed. Trees are created once and disposed only when the count changes (mode, grid size).
// Rendered through applyAge (Species tab's age-preview slider) rather than raw `opts` — a
// no-op when `previewAge` is left at its default of 1, so this doesn't change anything until
// the Species tab's age-preview control is actually used. Grid mode intentionally ignores
// age preview (only Solo is a "look at one species closely" view).
// Rebuilds in place when a tree already exists: geometry only, no new materials or pipelines.
// An aborted walk leaves the mesh holding its previous good geometry, so nothing is uploaded.
function rebuildTree(t, treeOpts) {
  const t0 = performance.now();
  const st = t.rebuild(treeOpts, activeLimits());
  lastBuildMs = performance.now() - t0;
  if (st.aborted) lastAborted = st.aborted;
  return t;
}
function regenerateSolo(refit) {
  lastAborted = null;
  if (soloTree) rebuildTree(soloTree, applyAge(opts, previewAge));
  else { soloTree = makeTree(applyAge(opts, previewAge)); scene.add(soloTree); }
  if (refit) fitCameraTo(soloTree);
}
function buildGrid(refit = true) {
  lastAborted = null;
  const n = gridSize * gridSize;
  if (gridTrees.length !== n) { for (const t of gridTrees) disposeTree(t); gridTrees = []; }
  const spacing = Math.max(6, opts.length[0] * 2.5);
  const half = (gridSize - 1) / 2;
  for (let i = 0; i < n; i++) {
    const treeOpts = { ...opts, seed: baseSeed + i };
    let t = gridTrees[i];
    if (t) rebuildTree(t, treeOpts);
    else { t = makeTree(treeOpts); scene.add(t); gridTrees.push(t); }
    t.position.set(((i % gridSize) - half) * spacing, 0, (Math.floor(i / gridSize) - half) * spacing);
  }
  if (refit) fitCameraToGrid();
}
// Used for mode switches, grid-size changes, and seed rerolls — anything that should rebuild
// and refit the camera immediately, bypassing the debounce used for slider drags.
function rebuildView(refit = true) {
  clearTimeout(regenTimer);
  needsRefit = false;
  // Only the trees the current mode does not use are disposed; the rest rebuild in place.
  if (mode !== 'grid') { for (const t of gridTrees) disposeTree(t); gridTrees = []; }
  if (mode !== 'solo' && soloTree) { disposeTree(soloTree); soloTree = null; }
  if (mode === 'solo') regenerateSolo(refit);
  else if (mode === 'grid') buildGrid(refit);
  else buildLod(refit);
  if (mode !== 'lod') { lodPreview.dispose(); fitShadowTo(null); }
  computeTreeMetrics(liveTrees());
  refreshExport();
}

let regenTimer = null;
let needsRefit = false;
function scheduleRegenerate(refit = false) {
  if (refit) needsRefit = true;
  clearTimeout(regenTimer);
  regenTimer = setTimeout(regenerateAll, 130);
}
function regenerateAll() {
  if (mode === 'solo') regenerateSolo(needsRefit);
  else if (mode === 'grid') buildGrid(needsRefit);
  else buildLod(needsRefit);
  computeTreeMetrics(liveTrees());
  needsRefit = false;
  refreshExport();
}

// The leaf map is a sprite sheet of four species, so a leaf card MUST address one cell of it.
// With leaves.atlas null the card stretches the whole sheet instead, and every single leaf shows
// all four species at once — which is what "the atlas is wrong" looks like on screen. The grid
// therefore comes from the texture set, not from the pin toggle; the toggle only chooses between
// one cell for the whole tree and a random cell per leaf.
// Declared here rather than beside their controls because applyTexSetToOpts runs first.
let atlasPinned = true;
let atlasCell = 0;
function applyAtlas() {
  // Both texture sets carry a grid; nulling it in procedural mode used to strip a species' pinned cell on save.
  const grid = texSet.leafAtlas;
  opts.leaves.atlas = grid
    ? { cols: grid.cols, rows: grid.rows, ...(atlasPinned ? { cell: atlasCell } : {}) }
    : null;
}
// The reverse: a loaded species carries its own pinned cell (the ez-tree presets pin one per leaf
// type), so the controls have to follow opts rather than fight it.
function resyncAtlasControls() {
  const a = opts.leaves.atlas;
  atlasPinned = !!(a && Number.isFinite(a.cell));
  if (atlasPinned) atlasCell = a.cell;
}
function applyTexSetToOpts() {
  opts.bark.map = texSet.barkMap || null;
  opts.bark.normalMap = texSet.barkNormalMap || null;
  opts.bark.vScale = texSet.barkVScale ?? opts.bark.vScale;
  opts.leaves.map = texSet.leafMap || null;
  opts.leaves.alphaTest = texSet.leafAlphaTest ?? 0;
  applyAtlas();
}
function applyTextureMode(nextMode) {
  texSet.dispose?.();
  texMode = nextMode;
  texSet = createTextureSource(texMode, { onReady: () => scheduleRegenerate() });
  applyTexSetToOpts();
  scheduleRegenerate();
}

applyTexSetToOpts();
rebuildView();

// ===================== controls panel =====================
const panelStyle = document.createElement('style');
panelStyle.textContent = '#ctrl{position:fixed;top:10px;right:10px;width:250px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:20}#ctrl-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45}#ctrl-bar .ttl{font-size:12px;color:#8a93a3;font-weight:600}#ctrl-min{background:none;border:none;color:#8a93a3;font:16px/1 system-ui,sans-serif;cursor:pointer;padding:0 2px}#ctrl-min:hover{color:#c4ccd6}#ctrl-body{padding:2px 12px 10px;max-height:min(82vh,760px);overflow-y:auto}#ctrl.min #ctrl-body{display:none}#ctrl.min #ctrl-bar{border-bottom:none}#ctrl .sec-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin:10px 0 4px;color:#8a93a3}#ctrl .sec-head .caret{font-size:10px;transition:transform .15s}#ctrl .sec.collapsed .caret{transform:rotate(-90deg)}#ctrl .sec.collapsed .sec-body{display:none}#ctrl-tabs{display:flex;gap:2px;padding:8px 12px 0}#ctrl-tabs button{width:auto;flex:1;margin:0;font-weight:600;background:#1c2027;color:#7f8a99}#ctrl-tabs button.active{background:#2a313c;color:#c4ccd6}#ctrl .row,.float-panel .row,#mut .row{margin:7px 0 1px;display:flex;justify-content:space-between}#ctrl .row span,.float-panel .row span,#mut .row span{color:#7f8a99}#ctrl input[type=range],.float-panel input[type=range],#mut input[type=range]{width:100%;margin:0}#ctrl input[type=color],.float-panel input[type=color],#mut input[type=color]{width:100%;height:20px;border:none;background:none;padding:0;cursor:pointer}#ctrl select,.float-panel select,#mut select{width:100%;background:#222831;color:#c4ccd6;border:1px solid #3a434f;border-radius:4px;padding:3px}#ctrl button,.float-panel button,#mut button{width:100%;background:#2a313c;color:#c4ccd6;border:1px solid #3a434f;border-radius:4px;padding:5px;cursor:pointer;margin:4px 0}#ctrl button:hover,.float-panel button:hover,#mut button:hover{background:#333c49}#ctrl button:disabled,.float-panel button:disabled,#mut button:disabled{opacity:.4;cursor:default}#ctrl button.mini-btn,.float-panel button.mini-btn{width:auto;display:inline-block;font-size:11px;padding:2px 8px;margin:4px 0 2px}#ctrl textarea,.float-panel textarea,#mut textarea{width:100%;height:90px;background:#15181d;color:#9fe39f;border:1px solid #3a434f;border-radius:4px;font:11px/1.4 monospace;resize:vertical}.sec-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0}.sec-row .sec-label{color:#c4ccd6;cursor:pointer;flex:1}.sec-row .sec-label:hover{color:#fff}.float-panel{position:fixed;width:230px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:25}.float-panel .fp-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45;font-size:12px;color:#8a93a3;font-weight:600}.float-panel .fp-close{background:none;border:none;color:#8a93a3;font:16px/1 system-ui,sans-serif;cursor:pointer;padding:0 2px}.float-panel .fp-close:hover{color:#c4ccd6}.float-panel .fp-body{padding:8px 12px 10px;max-height:70vh;overflow-y:auto}#mut{position:fixed;width:250px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:20}#mut-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45;font-size:12px;color:#8a93a3;font-weight:600}#mut-body{padding:8px 12px 10px}';
document.head.appendChild(panelStyle);

const ctrlBox = document.createElement('div'); ctrlBox.id = 'ctrl'; document.body.appendChild(ctrlBox);
const ctrlBar = document.createElement('div'); ctrlBar.id = 'ctrl-bar';
ctrlBar.innerHTML = '<span class="ttl">Tree controls</span>';
const ctrlMin = document.createElement('button'); ctrlMin.id = 'ctrl-min'; ctrlMin.textContent = '–';
ctrlBar.appendChild(ctrlMin);
const ctrlBody = document.createElement('div'); ctrlBody.id = 'ctrl-body';
ctrlBox.appendChild(ctrlBar); ctrlBox.appendChild(ctrlBody);

// ===================== floating panel manager =====================
// Every Tuning-tab section (and, nested, every Structure trait) opens as an independent
// floating panel instead of expanding inline — inline accordion sections take up a lot of
// vertical space once there are this many sliders. Multiple panels can be open at once; a
// newly-opened panel (one with no remembered position yet) is placed to avoid overlapping
// already-open panels near the same horizontal position ("repelled" downward); once a panel
// has a position — whether auto-placed or user-dragged — reopening it reuses that position.
const FP_WIDTH = 230, FP_GAP = 10;
const floatingPanels = new Map();   // id -> { id, el, body, x, y, opened, parentId }

function createFloatingPanel(id, title, parentId) {
  const el = document.createElement('div'); el.className = 'float-panel'; el.style.display = 'none';
  const bar = document.createElement('div'); bar.className = 'fp-bar';
  bar.innerHTML = '<span>' + title + '</span>';
  const closeBtn = document.createElement('button'); closeBtn.className = 'fp-close'; closeBtn.textContent = '×';
  closeBtn.addEventListener('click', () => closeFloatingPanel(id));
  bar.appendChild(closeBtn);
  const body = document.createElement('div'); body.className = 'fp-body';
  el.appendChild(bar); el.appendChild(body);
  document.body.appendChild(el);

  let drag = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target === closeBtn) return;
    const r = el.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    const fp = floatingPanels.get(id);
    fp.x = e.clientX - drag.dx; fp.y = e.clientY - drag.dy;
    el.style.left = fp.x + 'px'; el.style.top = fp.y + 'px';
  });
  bar.addEventListener('pointerup', e => { drag = null; bar.releasePointerCapture(e.pointerId); });

  const fp = { id, el, body, x: null, y: null, opened: false, parentId };
  floatingPanels.set(id, fp);
  return fp;
}

// Places a panel that has never been positioned before: prefers one panel-width to the left of
// whatever contained the row that opened it, near that row's vertical position; pushed down past
// any already-open panel it would otherwise overlap in roughly the same horizontal position;
// clamped to stay fully on-screen rather than wrapping into a new column.
function positionNewPanel(fp, anchorEl) {
  const anchorRect = anchorEl.getBoundingClientRect();
  let x = anchorRect.left - FP_WIDTH - FP_GAP;
  let y = anchorRect.top;

  fp.el.style.visibility = 'hidden';
  fp.el.style.left = x + 'px'; fp.el.style.top = y + 'px';
  const height = fp.el.offsetHeight || 150;

  const colliders = [...floatingPanels.values()]
    .filter(o => o !== fp && o.opened && o.x != null && Math.abs(o.x - x) < FP_WIDTH)
    .sort((a, b) => a.y - b.y);
  for (const o of colliders) {
    const oBottom = o.y + (o.el.offsetHeight || 150);
    if (y < oBottom && y + height > o.y) y = oBottom + FP_GAP;
  }

  const maxY = window.innerHeight - height - FP_GAP;
  y = Math.max(FP_GAP, Math.min(maxY, y));
  x = Math.max(FP_GAP, x);
  fp.x = x; fp.y = y;
  fp.el.style.visibility = 'visible';
}

function openFloatingPanel(id, anchorEl) {
  const fp = floatingPanels.get(id);
  if (fp.opened) return;
  fp.opened = true;
  fp.el.style.display = 'block';
  if (fp.x == null) positionNewPanel(fp, anchorEl);
  fp.el.style.left = fp.x + 'px'; fp.el.style.top = fp.y + 'px';
}
function closeFloatingPanel(id) {
  const fp = floatingPanels.get(id);
  if (!fp || !fp.opened) return;
  fp.opened = false;
  fp.el.style.display = 'none';
  for (const child of floatingPanels.values()) if (child.parentId === id) closeFloatingPanel(child.id);
}
function toggleFloatingPanel(id, anchorEl) {
  const fp = floatingPanels.get(id);
  if (fp.opened) closeFloatingPanel(id); else openFloatingPanel(id, anchorEl);
}

// Drop-in replacement for header() for Tuning-tab sections: creates a row (label + optional
// Mutate button) in `parentContainer` (top-level sections all default to `tuningPage`), creates
// the matching floating panel, and redirects `current` into the new panel's body so the caller's
// subsequent slider-building calls populate it — same calling convention header() used, so
// existing per-section code below each call didn't need to change. `parentContainer`/`parentId`
// are passed explicitly (not inferred from `current`) because `current` is left pointing at
// whatever the *previous* section's body was — inferring parentage from it would silently nest
// every section under whichever one happened to run right before it.
function panelSection(id, label, mutateFn, parentContainer = tuningPage, parentId = null) {
  const anchorEl = parentId ? floatingPanels.get(parentId).el : ctrlBox;
  const fp = createFloatingPanel(id, label, parentId);

  const rowEl = document.createElement('div'); rowEl.className = 'sec-row';
  const labelSpan = document.createElement('span'); labelSpan.className = 'sec-label'; labelSpan.textContent = label;
  labelSpan.addEventListener('click', () => toggleFloatingPanel(id, anchorEl));
  rowEl.appendChild(labelSpan);
  if (mutateFn) {
    const mutateBtn = document.createElement('button'); mutateBtn.className = 'mini-btn'; mutateBtn.textContent = 'Mutate';
    mutateBtn.addEventListener('click', () => mutateFn());
    rowEl.appendChild(mutateBtn);
  }
  parentContainer.appendChild(rowEl);

  current = fp.body;
  return fp.body;
}

// Controls only read their displayed value once, at creation. When `opts` (or other bound
// state) changes from somewhere other than that control's own input event — a loaded saved
// tree, a mutation — the displayed slider position/toggle/color goes stale. Every control
// primitive below registers a `refresh()` closure here; refreshAllControls() re-syncs every
// control's displayed value from live state in one pass. Entries whose DOM node was removed by
// a section rebuild (e.g. Structure's per-level rows) are pruned automatically.
let allControls = [];
function refreshAllControls() {
  allControls = allControls.filter(c => c.el.isConnected);
  for (const c of allControls) c.refresh();
}

function row(labelHtml) {
  const r = document.createElement('div'); r.className = 'row'; r.innerHTML = labelHtml;
  current.appendChild(r);
  return r;
}
function rangeControl(label, min, max, step, get, set, fmt, onChange) {
  const r = row('<span style="color:#c4ccd6">' + label + '</span>');
  const val = document.createElement('span'); val.textContent = fmt(get()); r.appendChild(val);
  const inp = document.createElement('input'); inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); val.textContent = fmt(get()); onChange(); });
  current.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.value = get(); val.textContent = fmt(get()); } });
  return inp;
}
function selectControl(label, choices, get, set, onChange) {
  row('<span style="color:#c4ccd6">' + label + '</span>');
  const sel = document.createElement('select');
  for (const c of choices) {
    const op = document.createElement('option'); op.value = c; op.textContent = c;
    if (c === get()) op.selected = true;
    sel.appendChild(op);
  }
  sel.addEventListener('change', () => { set(sel.value); onChange(); });
  current.appendChild(sel);
  allControls.push({ el: sel, refresh: () => { sel.value = get(); } });
  return sel;
}
function toggleControl(label, get, set, onChange) {
  const r = row('<span style="color:#c4ccd6">' + label + '</span>');
  const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!get(); inp.style.width = 'auto';
  inp.addEventListener('change', () => { set(inp.checked); onChange(); });
  r.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.checked = !!get(); } });
  return inp;
}
function colorControl(label, get, set, onChange) {
  row('<span style="color:#c4ccd6">' + label + '</span>');
  const inp = document.createElement('input'); inp.type = 'color';
  inp.value = '#' + get().toString(16).padStart(6, '0');
  inp.addEventListener('input', () => { set(parseInt(inp.value.slice(1), 16)); onChange(); });
  current.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.value = '#' + get().toString(16).padStart(6, '0'); } });
  return inp;
}
function numberControl(label, min, step, get, set, onChange) {
  const r = row('<span style="color:#c4ccd6">' + label + '</span>');
  const inp = document.createElement('input'); inp.type = 'number'; inp.min = min; inp.step = step; inp.value = get();
  inp.style.cssText = 'width:80px;background:#222831;color:#c4ccd6;border:1px solid #3a434f;border-radius:4px;padding:2px 4px';
  inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (Number.isFinite(v)) { set(v); onChange(); } inp.value = get(); });
  r.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.value = get(); } });
  return inp;
}

}

    const delta = (Math.random() * 2 - 1) * mutationDegree * range;
    let v = p.get() + delta;
    v = p.wrap ? ((v - p.min) % range + range) % range + p.min : Math.max(p.min, Math.min(p.max, v));
    if (p.step === 1) v = Math.round(v);

// Named so "Mutate all" (below) can reuse them without duplicating each section's list.

// Auto mutate: one undo snapshot at session start, then a mutation every `autoIntervalS` seconds
// with no undo push. Step back walks the session's own history one mutation at a time, so Undo
// returns to the tree as it was before the session began.
let autoTimer = null, autoIntervalS = 1;
let autoHistory = [];
function autoTick() {
  const before = snapshotState();
  for (let attempt = 0; attempt < 5; attempt++) {
    mutateParams(allMutateList());
    refreshAllControls();
    rebuildView(false);
    if (!overLimit()) { autoHistory.push(before); stepBackBtn.disabled = false; return; }
    rejectedMutations++;
    restoreState(before, { keepAutoHistory: true, refit: false, rebuild: false });
  }
}

}

}

// ---- undo / redo / restart ----
// Snapshots cover the tree (opts) plus the View-section state that describes it (mode,
// gridSize, baseSeed) — deliberately NOT Lighting or texture mode, since those aren't touched
// by Mutate/Reroll/Load and aren't part of "the tree getting too crazy". Only "big jump"
// actions push a snapshot (via mutateSection/loadOpts, or explicitly in Reroll's handler below)
// — individual slider drags don't, since they fire many events per drag and would fill the
// 15-slot history almost instantly.
const UNDO_LIMIT = 15;

let redoStack = [];

  redoStack = [];
  updateUndoRedoButtons();
}
// Shared by loadOpts() and restoreState(): re-apply the current texture mode's maps (snapshots
// never include live Texture objects), resync forceAz/forceEl (derived from the new
// opts.force.direction — see resyncForceAngles() in the Force section below), rebuild each
// trait's sliders, refresh every control's displayed value, refresh the seed label, and rebuild
// the 3D view + Export text.

  resyncAtlasControls();   // before applyTexSetToOpts: it rebuilds opts.leaves.atlas from these
  applyTexSetToOpts();

}
function restoreState(state, { keepAutoHistory = false, refit = true, rebuild = true } = {}) {
  if (!keepAutoHistory) { if (autoTimer) stopAuto(); autoHistory = []; stepBackBtn.disabled = true; }
  for (const k of Object.keys(opts)) delete opts[k];
  Object.assign(opts, structuredClone(state.opts));
  mode = state.mode; gridSize = state.gridSize; baseSeed = state.baseSeed;
  gridSizeWrap.style.display = mode === 'grid' ? '' : 'none';
  applyOptsAndRefresh(refit, rebuild);
}
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapshotState());
  if (redoStack.length > UNDO_LIMIT) redoStack.shift();
  restoreState(undoStack.pop());
  updateUndoRedoButtons();
}
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshotState());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  restoreState(redoStack.pop());
  updateUndoRedoButtons();
}

const BIOME_NAMES = [

// reusable createTree() options object, not tied to whatever texture mode was active when saved.
function snapshotOpts() {

{

// Fully replaces `opts`'s contents in place (never reassigns the `opts` binding itself) so every

// whatever was previously loaded.

    // Auto: batch-mutate the currently-loaded tree N times from the SAME baseline (not
    // cumulative drift) and save every result as a new species, without rendering each
    // intermediate mutation — only the final restore-to-baseline is rendered.
    let mutationCount = 5;
    rangeControl('Auto-add count', 1, 20, 1, () => mutationCount, v => { mutationCount = Math.round(v); }, fi, () => {});
    buttonControl('Auto-add mutations', () => {
      const baseline = snapshotOpts();

      for (let i = 0; i < mutationCount; i++) {
        resetOptsQuiet(baseline);
        mutateParams([...structureMutateList(), ...forceMutateList(), ...barkMutateList(), ...leavesMutateList()]);
        added.push({
          id: newId(), name: `${fam.name} ${fam.species.length + added.length + 1}`,
          opts: snapshotOpts(), parentSpeciesId: currentSpeciesId,
          biomes: [], density: 1, sizeRange: [0.8, 1.2], ageRange: [1, 1],
        });
      }
      fam.species.push(...added);
      persistFamilies();
      resetOptsQuiet(baseline);
      refreshAllControls();
      rebuildView();
      renderSpeciesList();
    });

    // Manual: no new mutate mechanism — use the tool exactly as it already works (any Mutate
    // button, sliders, whatever), then keep the result. Never hitting this is how a bad
    // mutation gets discarded.
    let keepNameValue = '';
    {
      row('<span style="color:#c4ccd6">New species name</span>');

        biomes: [], density: 1, sizeRange: [0.8, 1.2], ageRange: [1, 1],

    if (!fam || fam.species.length === 0) { row('<span style="color:#7f8a99">No species yet.</span>'); return; }
    fam.species.forEach(sp => {
      const label = sp.name + (sp.biomes.length ? ' · ' + sp.biomes.join(',') : '');
      const r = row('<span style="color:#c4ccd6;cursor:pointer">' + label + '</span>');
      const delBtn = document.createElement('span');
      delBtn.textContent = '×'; delBtn.style.cssText = 'cursor:pointer;color:#c47;padding:0 4px';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        fam.species = fam.species.filter(s => s.id !== sp.id);
        if (currentSpeciesId === sp.id) currentSpeciesId = null;
        persistFamilies();
        renderSpeciesList();
        renderSpeciesEdit();
      });
      r.appendChild(delBtn);
      // Clicking a row both loads it into the live Solo tree AND selects it for editing —
      // unified into one click so the age-preview slider below always previews whichever
      // species you're actually looking at.
      r.addEventListener('click', () => {
        currentSpeciesId = sp.id;
        loadOpts(sp.opts);
        renderSpeciesEdit();
      });
    });
  });
}

function renderSpeciesEdit() {
  speciesEditHost.innerHTML = '';
  withHost(speciesEditHost, () => {
    const fam = currentFamilyId ? familyById(currentFamilyId) : null;
    const sp = fam && currentSpeciesId ? fam.species.find(s => s.id === currentSpeciesId) : null;
    if (!sp) { row('<span style="color:#7f8a99">Select a species from the list to edit it.</span>'); return; }

    {
      row('<span style="color:#c4ccd6">Name</span>');
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = sp.name; inp.style.width = '100%';
      inp.addEventListener('input', () => { sp.name = inp.value; persistFamilies(); });
      current.appendChild(inp);
    }

    row('<span style="color:#8a93a3">Biomes</span>');
    for (const b of BIOME_NAMES) {
      const r = row('<span style="color:#c4ccd6">' + b + '</span>');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = sp.biomes.includes(b); cb.style.width = 'auto';
      cb.addEventListener('change', () => {
        if (cb.checked) { if (!sp.biomes.includes(b)) sp.biomes.push(b); }
        else sp.biomes = sp.biomes.filter(x => x !== b);
        persistFamilies();
      });
      r.appendChild(cb);
    }

    rangeControl('Density', 0, 5, 0.1, () => sp.density, v => { sp.density = v; persistFamilies(); }, f2, () => {});
    rangeControl('Size min', 0.1, 3, 0.05, () => sp.sizeRange[0], v => { sp.sizeRange[0] = Math.min(v, sp.sizeRange[1]); persistFamilies(); }, f2, () => {});
    rangeControl('Size max', 0.1, 3, 0.05, () => sp.sizeRange[1], v => { sp.sizeRange[1] = Math.max(v, sp.sizeRange[0]); persistFamilies(); }, f2, () => {});
    rangeControl('Age min', 0, 1, 0.01, () => sp.ageRange[0], v => { sp.ageRange[0] = Math.min(v, sp.ageRange[1]); persistFamilies(); }, pct, () => {});
    rangeControl('Age max', 0, 1, 0.01, () => sp.ageRange[1], v => { sp.ageRange[1] = Math.max(v, sp.ageRange[0]); persistFamilies(); }, pct, () => {});
    rangeControl('Age preview', 0, 1, 0.01, () => previewAge, v => { previewAge = v; }, pct, () => scheduleRegenerate());
  });
}

renderFamilyPanel();

positionMutBoxInitial();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  frameMs += (now - lastFrameAt - frameMs) * 0.1;
  lastFrameAt = now;
  controls.update();
  if (mode === 'lod') lodPreview.update(camera);
  renderer.render(scene, camera);
  if (++dbgFrames % 10 === 0) refreshDebugPanel();
});
</script>
</body>
</html>
