<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d23; }
  #info { position: fixed; top: 10px; left: 12px; color: #8a93a3;
    font: 12px/1.5 system-ui, sans-serif; user-select: none; pointer-events: none;
    max-width: calc(100vw - 280px); z-index: 5; }
</style>
</head>
<body>
<div id="info">drag&nbsp;orbit &middot; scroll&nbsp;zoom &mdash; standalone procedural tree tuning tool</div>

<!-- three@0.184.0: same CDN pins as environment-viewer.html -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createLightingRig } from './lights.js';
import { createTree } from './trees.js';
import { createTextureSource } from './tree-textures.js';
import { applyAge } from './tree-age.js';

const infoEl = document.getElementById('info');
function showError(msg) { if (infoEl) { infoEl.innerHTML = '⚠ ' + msg; infoEl.style.color = '#ffb3b3'; } }
addEventListener('error', e => showError(e.message || 'script error'));
addEventListener('unhandledrejection', e => showError((e.reason && e.reason.message) || String(e.reason)));

// ===================== renderer / scene / camera =====================
const renderer = new WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d23);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(18, 12, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ===================== lighting =====================
const rig = createLightingRig({ scene, ui: false, elevation: 66, azimuth: 9 });
rig.dirLight.castShadow = true;
scene.add(rig.dirLight.target);
rig.dirLight.shadow.mapSize.set(2048, 2048);
rig.dirLight.shadow.camera.near = 1; rig.dirLight.shadow.camera.far = 120;
rig.dirLight.shadow.camera.left = -30; rig.dirLight.shadow.camera.right = 30;
rig.dirLight.shadow.camera.top = 30; rig.dirLight.shadow.camera.bottom = -30;

// ===================== ground =====================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x3a4a32, roughness: 1 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== tree data model =====================
// trees.js's Tree constructor deep-merges user options over its internal DEFAULTS and stores
// the merged result as `.options` — using that (rather than re-declaring DEFAULTS here) keeps
// `opts`'s shape guaranteed identical to what createTree()/regenerate() expect.
const _genTree = createTree({});
const opts = _genTree.options;
_genTree.dispose();
// Captured once, immediately, before any user interaction — the Restart button resets to this
// regardless of how far the live `opts` has drifted since.
const DEFAULT_OPTS = structuredClone(opts);

let mode = 'solo';        // 'solo' | 'grid'
let gridSize = 3;
let baseSeed = opts.seed;
let texMode = 'procedural';
let texSet = createTextureSource('procedural');
let previewAge = 1;       // 0=sapling..1=mature; only Solo mode renders through applyAge(opts, previewAge)

let soloTree = null;
let gridTrees = [];
let refreshExport = () => {};   // reassigned once the Export section builds its textarea (Task 7)

function disposeTree(t) { scene.remove(t); t.dispose(); }

function makeTree(treeOpts) {
  const t = createTree(treeOpts);
  t.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return t;
}

function fitCameraToBox(box, radiusMult, minDist) {
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const dist = Math.max(sphere.radius * radiusMult, minDist);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (!isFinite(dir.x) || dir.lengthSq() === 0) dir.set(0.6, 0.5, 0.6).normalize();
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(dir, dist);
  controls.update();
}
function fitCameraTo(object3d) { fitCameraToBox(new THREE.Box3().setFromObject(object3d), 2.4, 6); }
function fitCameraToGrid() {
  const box = new THREE.Box3();
  for (const t of gridTrees) box.expandByObject(t);
  fitCameraToBox(box, 1.8, 10);
}

// Materials are built once in the Tree constructor (trees.js never updates them in
// regenerate()), so any change — including bark/leaf color, roughness, or texture maps —
// requires a full dispose+recreate, not just regenerate(). Solo and Grid both always fully
// rebuild on every change; the 130ms debounce (below) keeps that cheap enough for live tuning.
// Rendered through applyAge (Species tab's age-preview slider) rather than raw `opts` — a
// no-op when `previewAge` is left at its default of 1, so this doesn't change anything until
// the Species tab's age-preview control is actually used. Grid mode intentionally ignores
// age preview (only Solo is a "look at one species closely" view).
function buildSolo() {
  soloTree = makeTree(applyAge(opts, previewAge));
  scene.add(soloTree);
  fitCameraTo(soloTree);
}
function regenerateSolo(refit) {
  if (soloTree) disposeTree(soloTree);
  soloTree = makeTree(applyAge(opts, previewAge));
  scene.add(soloTree);
  if (refit) fitCameraTo(soloTree);
}
function buildGrid() {
  for (const t of gridTrees) disposeTree(t);
  gridTrees = [];
  const spacing = Math.max(6, opts.length[0] * 2.5);
  const half = (gridSize - 1) / 2;
  for (let i = 0; i < gridSize * gridSize; i++) {
    const t = makeTree({ ...opts, seed: baseSeed + i });
    t.position.set(((i % gridSize) - half) * spacing, 0, (Math.floor(i / gridSize) - half) * spacing);
    scene.add(t);
    gridTrees.push(t);
  }
  fitCameraToGrid();
}
function disposeCurrent() {
  if (soloTree) { disposeTree(soloTree); soloTree = null; }
  for (const t of gridTrees) disposeTree(t);
  gridTrees = [];
}
// Used for mode switches, grid-size changes, and seed rerolls — anything that should rebuild
// and refit the camera immediately, bypassing the debounce used for slider drags.
function rebuildView() {
  clearTimeout(regenTimer);
  needsRefit = false;
  disposeCurrent();
  if (mode === 'solo') buildSolo(); else buildGrid();
  refreshExport();
}

let regenTimer = null;
let needsRefit = false;
function scheduleRegenerate(refit = false) {
  if (refit) needsRefit = true;
  clearTimeout(regenTimer);
  regenTimer = setTimeout(regenerateAll, 130);
}
function regenerateAll() {
  if (mode === 'solo') regenerateSolo(needsRefit);
  else buildGrid();
  needsRefit = false;
  refreshExport();
}

function applyTexSetToOpts() {
  opts.bark.map = texSet.barkMap || null;
  opts.bark.normalMap = texSet.barkNormalMap || null;
  opts.bark.vScale = texSet.barkVScale ?? opts.bark.vScale;
  opts.leaves.map = texSet.leafMap || null;
  opts.leaves.alphaTest = texSet.leafAlphaTest ?? 0;
}
function applyTextureMode(nextMode) {
  texSet.dispose?.();
  texMode = nextMode;
  texSet = createTextureSource(texMode, { onReady: () => scheduleRegenerate() });
  applyTexSetToOpts();
  scheduleRegenerate();
}

rebuildView();

// ===================== controls panel =====================
const panelStyle = document.createElement('style');
panelStyle.textContent = '#ctrl{position:fixed;top:10px;right:10px;width:250px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:20}#ctrl-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45}#ctrl-bar .ttl{font-size:12px;color:#8a93a3;font-weight:600}#ctrl-min{background:none;border:none;color:#8a93a3;font:16px/1 system-ui,sans-serif;cursor:pointer;padding:0 2px}#ctrl-min:hover{color:#c4ccd6}#ctrl-body{padding:2px 12px 10px;max-height:min(82vh,760px);overflow-y:auto}#ctrl.min #ctrl-body{display:none}#ctrl.min #ctrl-bar{border-bottom:none}#ctrl .sec-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin:10px 0 4px;color:#8a93a3}#ctrl .sec-head .caret{font-size:10px;transition:transform .15s}#ctrl .sec.collapsed .caret{transform:rotate(-90deg)}#ctrl .sec.collapsed .sec-body{display:none}#ctrl-tabs{display:flex;gap:2px;padding:8px 12px 0}#ctrl-tabs button{width:auto;flex:1;margin:0;font-weight:600;background:#1c2027;color:#7f8a99}#ctrl-tabs button.active{background:#2a313c;color:#c4ccd6}#ctrl .row,.float-panel .row,#mut .row{margin:7px 0 1px;display:flex;justify-content:space-between}#ctrl .row span,.float-panel .row span,#mut .row span{color:#7f8a99}#ctrl input[type=range],.float-panel input[type=range],#mut input[type=range]{width:100%;margin:0}#ctrl input[type=color],.float-panel input[type=color],#mut input[type=color]{width:100%;height:20px;border:none;background:none;padding:0;cursor:pointer}#ctrl select,.float-panel select,#mut select{width:100%;background:#222831;color:#c4ccd6;border:1px solid #3a434f;border-radius:4px;padding:3px}#ctrl button,.float-panel button,#mut button{width:100%;background:#2a313c;color:#c4ccd6;border:1px solid #3a434f;border-radius:4px;padding:5px;cursor:pointer;margin:4px 0}#ctrl button:hover,.float-panel button:hover,#mut button:hover{background:#333c49}#ctrl button:disabled,.float-panel button:disabled,#mut button:disabled{opacity:.4;cursor:default}#ctrl button.mini-btn,.float-panel button.mini-btn{width:auto;display:inline-block;font-size:11px;padding:2px 8px;margin:4px 0 2px}#ctrl textarea,.float-panel textarea,#mut textarea{width:100%;height:90px;background:#15181d;color:#9fe39f;border:1px solid #3a434f;border-radius:4px;font:11px/1.4 monospace;resize:vertical}.sec-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0}.sec-row .sec-label{color:#c4ccd6;cursor:pointer;flex:1}.sec-row .sec-label:hover{color:#fff}.float-panel{position:fixed;width:230px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:25}.float-panel .fp-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45;font-size:12px;color:#8a93a3;font-weight:600}.float-panel .fp-close{background:none;border:none;color:#8a93a3;font:16px/1 system-ui,sans-serif;cursor:pointer;padding:0 2px}.float-panel .fp-close:hover{color:#c4ccd6}.float-panel .fp-body{padding:8px 12px 10px;max-height:70vh;overflow-y:auto}#mut{position:fixed;width:250px;background:rgba(20,24,30,.86);border:1px solid #333a45;border-radius:8px;color:#c4ccd6;font:12px/1.45 system-ui,sans-serif;user-select:none;z-index:20}#mut-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:move;border-bottom:1px solid #333a45;font-size:12px;color:#8a93a3;font-weight:600}#mut-body{padding:8px 12px 10px}';
document.head.appendChild(panelStyle);

const ctrlBox = document.createElement('div'); ctrlBox.id = 'ctrl'; document.body.appendChild(ctrlBox);
const ctrlBar = document.createElement('div'); ctrlBar.id = 'ctrl-bar';
ctrlBar.innerHTML = '<span class="ttl">Tree controls</span>';
const ctrlMin = document.createElement('button'); ctrlMin.id = 'ctrl-min'; ctrlMin.textContent = '–';
ctrlBar.appendChild(ctrlMin);
const ctrlBody = document.createElement('div'); ctrlBody.id = 'ctrl-body';
ctrlBox.appendChild(ctrlBar); ctrlBox.appendChild(ctrlBody);

// Two tabs: Tuning (all the tree-trait sections + Lighting/Mutation) and Species (save/load
// saved trees). header() appends into whichever page `sectionHost` currently points at.
const ctrlTabs = document.createElement('div'); ctrlTabs.id = 'ctrl-tabs'; ctrlBox.insertBefore(ctrlTabs, ctrlBody);
const tuningTabBtn = document.createElement('button'); tuningTabBtn.textContent = 'Tuning'; tuningTabBtn.className = 'active';
const speciesTabBtn = document.createElement('button'); speciesTabBtn.textContent = 'Species';
ctrlTabs.appendChild(tuningTabBtn); ctrlTabs.appendChild(speciesTabBtn);

const tuningPage = document.createElement('div');
const speciesPage = document.createElement('div'); speciesPage.style.display = 'none';
ctrlBody.appendChild(tuningPage); ctrlBody.appendChild(speciesPage);

function activateTab(name) {
  const tuning = name === 'tuning';
  tuningPage.style.display = tuning ? '' : 'none';
  speciesPage.style.display = tuning ? 'none' : '';
  tuningTabBtn.classList.toggle('active', tuning);
  speciesTabBtn.classList.toggle('active', !tuning);
}
tuningTabBtn.addEventListener('click', () => activateTab('tuning'));
speciesTabBtn.addEventListener('click', () => activateTab('species'));

let sectionHost = tuningPage;
let current = tuningPage;

ctrlMin.addEventListener('click', () => { ctrlMin.textContent = ctrlBox.classList.toggle('min') ? '+' : '–'; });

let ctrlDrag = null;
ctrlBar.addEventListener('pointerdown', e => {
  if (e.target === ctrlMin) return;
  const r = ctrlBox.getBoundingClientRect();
  ctrlDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  ctrlBar.setPointerCapture(e.pointerId);
});
ctrlBar.addEventListener('pointermove', e => {
  if (!ctrlDrag) return;
  ctrlBox.style.right = 'auto';
  const maxX = Math.max(10, window.innerWidth - ctrlBox.offsetWidth - 10);
  const maxY = Math.max(10, window.innerHeight - ctrlBox.offsetHeight - 10);
  ctrlBox.style.left = Math.max(10, Math.min(maxX, e.clientX - ctrlDrag.dx)) + 'px';
  ctrlBox.style.top = Math.max(10, Math.min(maxY, e.clientY - ctrlDrag.dy)) + 'px';
});
ctrlBar.addEventListener('pointerup', e => { ctrlDrag = null; ctrlBar.releasePointerCapture(e.pointerId); });

// Each header() opens a collapsible section; subsequent controls land in it via `current`.
function header(text) {
  const sec = document.createElement('div'); sec.className = 'sec';
  const head = document.createElement('div'); head.className = 'sec-head';
  head.innerHTML = '<span>' + text + '</span><span class="caret">▾</span>';
  const secBody = document.createElement('div'); secBody.className = 'sec-body';
  head.addEventListener('click', () => sec.classList.toggle('collapsed'));
  sec.appendChild(head); sec.appendChild(secBody); sectionHost.appendChild(sec);
  current = secBody;
  return secBody;
}
// Temporarily redirects `current` to `hostEl` for the duration of `fn` — used to build a
// sub-group of rows (e.g. per-level structure rows) inside a container that can be cleared
// and rebuilt independently of the rest of its section.
function withHost(hostEl, fn) { const prev = current; current = hostEl; fn(); current = prev; }

// ===================== floating panel manager =====================
// Every Tuning-tab section (and, nested, every Structure trait) opens as an independent
// floating panel instead of expanding inline — inline accordion sections take up a lot of
// vertical space once there are this many sliders. Multiple panels can be open at once; a
// newly-opened panel (one with no remembered position yet) is placed to avoid overlapping
// already-open panels near the same horizontal position ("repelled" downward); once a panel
// has a position — whether auto-placed or user-dragged — reopening it reuses that position.
const FP_WIDTH = 230, FP_GAP = 10;
const floatingPanels = new Map();   // id -> { id, el, body, x, y, opened, parentId }

function createFloatingPanel(id, title, parentId) {
  const el = document.createElement('div'); el.className = 'float-panel'; el.style.display = 'none';
  const bar = document.createElement('div'); bar.className = 'fp-bar';
  bar.innerHTML = '<span>' + title + '</span>';
  const closeBtn = document.createElement('button'); closeBtn.className = 'fp-close'; closeBtn.textContent = '×';
  closeBtn.addEventListener('click', () => closeFloatingPanel(id));
  bar.appendChild(closeBtn);
  const body = document.createElement('div'); body.className = 'fp-body';
  el.appendChild(bar); el.appendChild(body);
  document.body.appendChild(el);

  let drag = null;
  bar.addEventListener('pointerdown', e => {
    if (e.target === closeBtn) return;
    const r = el.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    const fp = floatingPanels.get(id);
    fp.x = e.clientX - drag.dx; fp.y = e.clientY - drag.dy;
    el.style.left = fp.x + 'px'; el.style.top = fp.y + 'px';
  });
  bar.addEventListener('pointerup', e => { drag = null; bar.releasePointerCapture(e.pointerId); });

  const fp = { id, el, body, x: null, y: null, opened: false, parentId };
  floatingPanels.set(id, fp);
  return fp;
}

// Places a panel that has never been positioned before: prefers one panel-width to the left of
// whatever contained the row that opened it, near that row's vertical position; pushed down past
// any already-open panel it would otherwise overlap in roughly the same horizontal position;
// clamped to stay fully on-screen rather than wrapping into a new column.
function positionNewPanel(fp, anchorEl) {
  const anchorRect = anchorEl.getBoundingClientRect();
  let x = anchorRect.left - FP_WIDTH - FP_GAP;
  let y = anchorRect.top;

  fp.el.style.visibility = 'hidden';
  fp.el.style.left = x + 'px'; fp.el.style.top = y + 'px';
  const height = fp.el.offsetHeight || 150;

  const colliders = [...floatingPanels.values()]
    .filter(o => o !== fp && o.opened && o.x != null && Math.abs(o.x - x) < FP_WIDTH)
    .sort((a, b) => a.y - b.y);
  for (const o of colliders) {
    const oBottom = o.y + (o.el.offsetHeight || 150);
    if (y < oBottom && y + height > o.y) y = oBottom + FP_GAP;
  }

  const maxY = window.innerHeight - height - FP_GAP;
  y = Math.max(FP_GAP, Math.min(maxY, y));
  x = Math.max(FP_GAP, x);
  fp.x = x; fp.y = y;
  fp.el.style.visibility = 'visible';
}

function openFloatingPanel(id, anchorEl) {
  const fp = floatingPanels.get(id);
  if (fp.opened) return;
  fp.opened = true;
  fp.el.style.display = 'block';
  if (fp.x == null) positionNewPanel(fp, anchorEl);
  fp.el.style.left = fp.x + 'px'; fp.el.style.top = fp.y + 'px';
}
function closeFloatingPanel(id) {
  const fp = floatingPanels.get(id);
  if (!fp || !fp.opened) return;
  fp.opened = false;
  fp.el.style.display = 'none';
  for (const child of floatingPanels.values()) if (child.parentId === id) closeFloatingPanel(child.id);
}
function toggleFloatingPanel(id, anchorEl) {
  const fp = floatingPanels.get(id);
  if (fp.opened) closeFloatingPanel(id); else openFloatingPanel(id, anchorEl);
}

// Drop-in replacement for header() for Tuning-tab sections: creates a row (label + optional
// Mutate button) in `parentContainer` (top-level sections all default to `tuningPage`), creates
// the matching floating panel, and redirects `current` into the new panel's body so the caller's
// subsequent slider-building calls populate it — same calling convention header() used, so
// existing per-section code below each call didn't need to change. `parentContainer`/`parentId`
// are passed explicitly (not inferred from `current`) because `current` is left pointing at
// whatever the *previous* section's body was — inferring parentage from it would silently nest
// every section under whichever one happened to run right before it.
function panelSection(id, label, mutateFn, parentContainer = tuningPage, parentId = null) {
  const anchorEl = parentId ? floatingPanels.get(parentId).el : ctrlBox;
  const fp = createFloatingPanel(id, label, parentId);

  const rowEl = document.createElement('div'); rowEl.className = 'sec-row';
  const labelSpan = document.createElement('span'); labelSpan.className = 'sec-label'; labelSpan.textContent = label;
  labelSpan.addEventListener('click', () => toggleFloatingPanel(id, anchorEl));
  rowEl.appendChild(labelSpan);
  if (mutateFn) {
    const mutateBtn = document.createElement('button'); mutateBtn.className = 'mini-btn'; mutateBtn.textContent = 'Mutate';
    mutateBtn.addEventListener('click', () => mutateFn());
    rowEl.appendChild(mutateBtn);
  }
  parentContainer.appendChild(rowEl);

  current = fp.body;
  return fp.body;
}

// Controls only read their displayed value once, at creation. When `opts` (or other bound
// state) changes from somewhere other than that control's own input event — a loaded saved
// tree, a mutation — the displayed slider position/toggle/color goes stale. Every control
// primitive below registers a `refresh()` closure here; refreshAllControls() re-syncs every
// control's displayed value from live state in one pass. Entries whose DOM node was removed by
// a section rebuild (e.g. Structure's per-level rows) are pruned automatically.
let allControls = [];
function refreshAllControls() {
  allControls = allControls.filter(c => c.el.isConnected);
  for (const c of allControls) c.refresh();
}

function row(labelHtml) {
  const r = document.createElement('div'); r.className = 'row'; r.innerHTML = labelHtml;
  current.appendChild(r);
  return r;
}
function rangeControl(label, min, max, step, get, set, fmt, onChange) {
  const r = row('<span style="color:#c4ccd6">' + label + '</span>');
  const val = document.createElement('span'); val.textContent = fmt(get()); r.appendChild(val);
  const inp = document.createElement('input'); inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); val.textContent = fmt(get()); onChange(); });
  current.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.value = get(); val.textContent = fmt(get()); } });
  return inp;
}
function selectControl(label, choices, get, set, onChange) {
  row('<span style="color:#c4ccd6">' + label + '</span>');
  const sel = document.createElement('select');
  for (const c of choices) {
    const op = document.createElement('option'); op.value = c; op.textContent = c;
    if (c === get()) op.selected = true;
    sel.appendChild(op);
  }
  sel.addEventListener('change', () => { set(sel.value); onChange(); });
  current.appendChild(sel);
  allControls.push({ el: sel, refresh: () => { sel.value = get(); } });
  return sel;
}
function toggleControl(label, get, set, onChange) {
  const r = row('<span style="color:#c4ccd6">' + label + '</span>');
  const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!get(); inp.style.width = 'auto';
  inp.addEventListener('change', () => { set(inp.checked); onChange(); });
  r.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.checked = !!get(); } });
  return inp;
}
function colorControl(label, get, set, onChange) {
  row('<span style="color:#c4ccd6">' + label + '</span>');
  const inp = document.createElement('input'); inp.type = 'color';
  inp.value = '#' + get().toString(16).padStart(6, '0');
  inp.addEventListener('input', () => { set(parseInt(inp.value.slice(1), 16)); onChange(); });
  current.appendChild(inp);
  allControls.push({ el: inp, refresh: () => { inp.value = '#' + get().toString(16).padStart(6, '0'); } });
  return inp;
}
function buttonControl(label, onClick) {
  const btn = document.createElement('button'); btn.textContent = label;
  btn.addEventListener('click', onClick);
  current.appendChild(btn);
  return btn;
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => o[k], obj); }
function setPath(obj, path, val) {
  const parts = path.split('.'); const last = parts.pop();
  parts.reduce((o, k) => o[k], obj)[last] = val;
}

const f2 = v => v.toFixed(2);
const fi = v => String(Math.round(v));
const pct = v => Math.round(v * 100) + '%';

// Thin wrappers over the primitives above for the common case of a control bound directly
// to a path inside `opts` (as opposed to View/Texture-section controls, which bind to
// page-local state like `mode`/`gridSize`/`texMode`).
function optsSlider(path, label, min, max, step, fmt, refit = false) {
  return rangeControl(label, min, max, step, () => getPath(opts, path), v => setPath(opts, path, v), fmt, () => scheduleRegenerate(refit));
}
function optsSelect(path, label, choices) {
  return selectControl(label, choices, () => getPath(opts, path), v => setPath(opts, path, v), () => scheduleRegenerate());
}
function optsToggle(path, label) {
  return toggleControl(label, () => getPath(opts, path), v => setPath(opts, path, v), () => scheduleRegenerate());
}
function optsColor(path, label) {
  return colorControl(label, () => getPath(opts, path), v => setPath(opts, path, v), () => scheduleRegenerate());
}

// ===================== View / Texture sections =====================
panelSection('view', 'View', null);
let seedLabel;
{
  const r = row('<span style="color:#c4ccd6">Seed</span>');
  seedLabel = document.createElement('span');
  r.appendChild(seedLabel);
}
function refreshSeedLabel() { seedLabel.textContent = String(mode === 'solo' ? opts.seed : baseSeed); }
refreshSeedLabel();

selectControl('Mode', ['solo', 'grid'], () => mode, v => { mode = v; }, () => {
  gridSizeWrap.style.display = mode === 'grid' ? '' : 'none';
  refreshSeedLabel();
  rebuildView();
});

const gridSizeWrap = document.createElement('div');
current.appendChild(gridSizeWrap);
withHost(gridSizeWrap, () => {
  rangeControl('Grid size', 2, 5, 1, () => gridSize, v => { gridSize = Math.round(v); }, fi, () => { if (mode === 'grid') rebuildView(); });
});
gridSizeWrap.style.display = mode === 'grid' ? '' : 'none';

buttonControl('Reroll seed', () => {
  pushUndo();
  if (mode === 'solo') opts.seed = (Math.random() * 1e9) | 0;
  else baseSeed = (Math.random() * 1e9) | 0;
  refreshSeedLabel();
  rebuildView();
});

panelSection('texture', 'Texture', null);
selectControl('Texture mode', ['procedural', 'authored'], () => texMode, applyTextureMode, () => {});

// ===================== Lighting section =====================
// `rig` (createLightingRig) only exposes getters for azimuth/elevation — sun/ambient color and
// intensity have no getter, so those four are tracked here as local state instead — seeded to
// this tool's own tuned defaults (not lights.js's own DEFAULTS), and pushed to the rig via its
// rig.set*() calls on change.
panelSection('lighting', 'Lighting', null);
let sunColor = '#fff4e0', sunIntensity = 4, ambientColor = '#8ab4e8', ambientIntensity = 1.05;
rangeControl('Elevation', 2, 88, 1, () => rig.elevation, v => rig.setElevation(v), fi, () => {});
rangeControl('Azimuth', 0, 360, 1, () => rig.azimuth, v => rig.setAzimuth(v), fi, () => {});
rangeControl('Sun intensity', 0, 4, 0.05, () => sunIntensity, v => { sunIntensity = v; rig.setSunIntensity(v); }, f2, () => {});
rangeControl('Ambient intensity', 0, 2, 0.05, () => ambientIntensity, v => { ambientIntensity = v; rig.setAmbientIntensity(v); }, f2, () => {});
colorControl('Sun color', () => parseInt(sunColor.slice(1), 16), v => { sunColor = '#' + v.toString(16).padStart(6, '0'); rig.setSunColor(sunColor); }, () => {});
colorControl('Ambient color', () => parseInt(ambientColor.slice(1), 16), v => { ambientColor = '#' + v.toString(16).padStart(6, '0'); rig.setAmbientColor(ambientColor); }, () => {});

// ===================== Mutation panel (docked, separate from the tabbed panel) =====================
// A second small always-visible panel — not part of the Tuning/Species tabs, and not a floating
// panel either (the user explicitly wants this one NOT click-to-open, since it's used
// constantly). Positioned directly below the main panel by default; draggable via the same
// title-bar pattern as the main panel.
const mutBox = document.createElement('div'); mutBox.id = 'mut'; document.body.appendChild(mutBox);
const mutBar = document.createElement('div'); mutBar.id = 'mut-bar';
mutBar.innerHTML = '<span class="ttl">Mutation</span>';
const mutBody = document.createElement('div'); mutBody.id = 'mut-body';
mutBox.appendChild(mutBar); mutBox.appendChild(mutBody);
// Positioned once, at the very end of the script (see the bottom of this file) rather than here
// — `ctrlBox`'s remaining Structure/Force/Bark/Leaves/Export rows haven't been added yet at this
// point, so its rendered height (and therefore where "directly below it" actually is) isn't
// final until the whole panel is built.
function positionMutBoxInitial() {
  const r = ctrlBox.getBoundingClientRect();
  mutBox.style.left = r.left + 'px';
  mutBox.style.top = (r.bottom + 10) + 'px';
}
let mutDrag = null;
mutBar.addEventListener('pointerdown', e => {
  const r = mutBox.getBoundingClientRect();
  mutDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  mutBar.setPointerCapture(e.pointerId);
});
mutBar.addEventListener('pointermove', e => {
  if (!mutDrag) return;
  mutBox.style.left = Math.max(10, e.clientX - mutDrag.dx) + 'px';
  mutBox.style.top = Math.max(10, e.clientY - mutDrag.dy) + 'px';
});
mutBar.addEventListener('pointerup', e => { mutDrag = null; mutBar.releasePointerCapture(e.pointerId); });

// Mutate is a targeted reroll: degree is a fraction of each slider's own min-max range, applied
// as an independent random perturbation per numeric slider, clamped to that slider's range.
// Only numeric range sliders mutate — colors/toggles/selects are left untouched. Behaves like
// Reroll seed: immediate (bypasses the debounce) and refits the camera.
current = mutBody;
let mutationDegree = 0.2;
rangeControl('Mutation degree', 0, 1, 0.01, () => mutationDegree, v => { mutationDegree = v; }, pct, () => {});

function optsMutateEntry(path, min, max) {
  return { min, max, get: () => getPath(opts, path), set: v => setPath(opts, path, v) };
}
function mutateParams(list) {
  for (const p of list) {
    const range = p.max - p.min;
    const delta = (Math.random() * 2 - 1) * mutationDegree * range;
    p.set(Math.max(p.min, Math.min(p.max, p.get() + delta)));
  }
}
function mutateSection(list) {
  pushUndo();
  mutateParams(list);
  refreshAllControls();
  rebuildView();
}

// Named so "Mutate all" (below) can reuse them without duplicating each section's list.
function traitMutateList(p) {
  const list = [];
  for (let level = 0; level <= opts.levels; level++) list.push(optsMutateEntry(`${p.key}.${level}`, p.min, p.max));
  return list;
}
function structureMutateList() { return LEVEL_PARAMS.flatMap(traitMutateList); }
function forceMutateList() {
  return [
    { min: 0, max: 360, get: () => forceAz, set: v => { forceAz = v; applyForceDirection(); } },
    { min: -90, max: 90, get: () => forceEl, set: v => { forceEl = v; applyForceDirection(); } },
    optsMutateEntry('force.strength', 0, 0.2),
  ];
}
function barkMutateList() {
  return [optsMutateEntry('bark.roughness', 0, 1), optsMutateEntry('bark.vScale', 0.05, 2)];
}
function leavesMutateList() {
  return [
    optsMutateEntry('leaves.count', 0, 40),
    optsMutateEntry('leaves.size', 0.2, 3),
    optsMutateEntry('leaves.sizeVariance', 0, 1),
    optsMutateEntry('leaves.start', 0, 0.9),
    optsMutateEntry('leaves.spread', 0, 1),
    optsMutateEntry('leaves.angle', 0, 90),
    optsMutateEntry('leaves.shadowFraction', 0, 1),
    optsMutateEntry('leaves.roughness', 0, 1),
    optsMutateEntry('leaves.alphaTest', 0, 1),
  ];
}

buttonControl('Mutate all', () => mutateSection([
  ...structureMutateList(), ...forceMutateList(), ...barkMutateList(), ...leavesMutateList(),
]));

// ---- undo / redo / restart ----
// Snapshots cover the tree (opts) plus the View-section state that describes it (mode,
// gridSize, baseSeed) — deliberately NOT Lighting or texture mode, since those aren't touched
// by Mutate/Reroll/Load and aren't part of "the tree getting too crazy". Only "big jump"
// actions push a snapshot (via mutateSection/loadOpts, or explicitly in Reroll's handler below)
// — individual slider drags don't, since they fire many events per drag and would fill the
// 15-slot history almost instantly.
const UNDO_LIMIT = 15;
let undoStack = [];
let redoStack = [];
function snapshotState() { return { opts: snapshotOpts(), mode, gridSize, baseSeed }; }
function pushUndo() {
  undoStack.push(snapshotState());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
// Shared by loadOpts() and restoreState(): re-apply the current texture mode's maps (snapshots
// never include live Texture objects), rebuild each trait's sliders, refresh every control's
// displayed value, refresh the seed label, and rebuild the 3D view + Export text.
function applyOptsAndRefresh() {
  applyTexSetToOpts();
  rebuildTraitSliders();
  refreshAllControls();
  refreshSeedLabel();
  rebuildView();
}
function restoreState(state) {
  for (const k of Object.keys(opts)) delete opts[k];
  Object.assign(opts, structuredClone(state.opts));
  mode = state.mode; gridSize = state.gridSize; baseSeed = state.baseSeed;
  gridSizeWrap.style.display = mode === 'grid' ? '' : 'none';
  applyOptsAndRefresh();
}
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapshotState());
  if (redoStack.length > UNDO_LIMIT) redoStack.shift();
  restoreState(undoStack.pop());
  updateUndoRedoButtons();
}
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshotState());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  restoreState(redoStack.pop());
  updateUndoRedoButtons();
}
let undoBtn, redoBtn;
const undoRedoRow = document.createElement('div'); undoRedoRow.style.cssText = 'display:flex;gap:6px';
current.appendChild(undoRedoRow);
withHost(undoRedoRow, () => { undoBtn = buttonControl('Undo', undo); redoBtn = buttonControl('Redo', redo); });
undoBtn.style.width = redoBtn.style.width = 'auto'; undoBtn.style.flex = redoBtn.style.flex = '1';
function updateUndoRedoButtons() {
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
}
updateUndoRedoButtons();

// Restart reuses loadOpts() (defined in the Species tab section below), which already pushes
// an undo snapshot, so Restart is itself undoable.
buttonControl('Restart', () => loadOpts(DEFAULT_OPTS));

current = tuningPage; // restore before the remaining Tuning-tab sections continue building below

// ===================== Structure section =====================
const LEVEL_PARAMS = [
  { key: 'length', label: 'Length', min: 1, max: 30, step: 0.5, fmt: f2 },
  { key: 'radius', label: 'Radius', min: 0.05, max: 2, step: 0.01, fmt: f2 },
  { key: 'taper', label: 'Taper', min: 0, max: 1, step: 0.01, fmt: f2 },
  { key: 'children', label: 'Children', min: 0, max: 10, step: 1, fmt: fi },
  { key: 'branchStart', label: 'Branch start', min: 0, max: 1, step: 0.01, fmt: f2 },
  { key: 'angle', label: 'Angle', min: 0, max: 90, step: 1, fmt: fi },
  { key: 'gnarliness', label: 'Gnarliness', min: 0, max: 1, step: 0.01, fmt: f2 },
  { key: 'twist', label: 'Twist', min: -1, max: 1, step: 0.01, fmt: f2 },
  { key: 'sections', label: 'Sections', min: 3, max: 16, step: 1, fmt: fi },
  { key: 'segments', label: 'Segments', min: 3, max: 16, step: 1, fmt: fi },
];

// Structure is two levels deep (section -> trait -> per-level sliders). Each trait is its own
// persistent floating panel, created once here; only the sliders INSIDE each trait's panel get
// torn down and rebuilt when opts.levels changes (rebuildTraitSliders) — recreating the trait
// panels themselves on every change would orphan/duplicate floating panels.
const traitPanelBodies = {};
function buildStructureUI() {
  const structureBody = panelSection('structure', 'Structure', () => mutateSection(structureMutateList()));
  rangeControl('Levels', 0, 3, 1, () => opts.levels, v => { opts.levels = Math.round(v); }, fi, () => {
    rebuildTraitSliders();
    scheduleRegenerate(true);
  });

  for (const p of LEVEL_PARAMS) {
    const traitBody = panelSection(`trait-${p.key}`, p.label, () => mutateSection(traitMutateList(p)), structureBody, 'structure');
    traitPanelBodies[p.key] = traitBody;
  }
}
function rebuildTraitSliders() {
  for (const p of LEVEL_PARAMS) {
    const body = traitPanelBodies[p.key];
    body.innerHTML = '';
    withHost(body, () => {
      for (let level = 0; level <= opts.levels; level++) {
        optsSlider(`${p.key}.${level}`, `${p.label} L${level}`, p.min, p.max, p.step, p.fmt);
      }
    });
  }
}
buildStructureUI();
rebuildTraitSliders();

// ===================== Force section =====================
panelSection('force', 'Force', () => mutateSection(forceMutateList()));
let forceAz = Math.atan2(opts.force.direction[0], opts.force.direction[2]) * 180 / Math.PI;
let forceEl = Math.asin(Math.max(-1, Math.min(1, opts.force.direction[1]))) * 180 / Math.PI;
function applyForceDirection() {
  const a = forceAz * Math.PI / 180, e = forceEl * Math.PI / 180;
  opts.force.direction = [Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)];
}
rangeControl('Direction azimuth', 0, 360, 1, () => forceAz, v => { forceAz = v; applyForceDirection(); }, fi, () => scheduleRegenerate());
rangeControl('Direction elevation', -90, 90, 1, () => forceEl, v => { forceEl = v; applyForceDirection(); }, fi, () => scheduleRegenerate());
optsSlider('force.strength', 'Strength', 0, 0.2, 0.001, v => v.toFixed(3));

// ===================== Bark section =====================
panelSection('bark', 'Bark', () => mutateSection(barkMutateList()));
optsColor('bark.color', 'Color');
optsSlider('bark.roughness', 'Roughness', 0, 1, 0.01, f2);
optsToggle('bark.flatShading', 'Flat shading');
optsSlider('bark.vScale', 'Texture V scale', 0.05, 2, 0.01, f2);

// ===================== Leaves section =====================
panelSection('leaves', 'Leaves', () => mutateSection(leavesMutateList()));
optsToggle('leaves.enabled', 'Enabled');
optsSlider('leaves.count', 'Count', 0, 40, 1, fi);
optsSlider('leaves.size', 'Size', 0.2, 3, 0.01, f2);
optsSlider('leaves.sizeVariance', 'Size variance', 0, 1, 0.01, f2);
optsSlider('leaves.start', 'Start', 0, 0.9, 0.01, f2);
optsSlider('leaves.spread', 'Spread', 0, 1, 0.01, f2);
optsSlider('leaves.angle', 'Angle', 0, 90, 1, fi);
optsToggle('leaves.doubleBillboard', 'Double billboard');
optsToggle('leaves.roundedNormals', 'Rounded normals');
optsSelect('leaves.shape', 'Shape', ['quad', 'simple']);

// The leaf atlas cell pin only has a visible effect once 'authored' texture mode has loaded a
// leaf atlas (procedural mode has no leafMap to sample a cell from), but the controls are
// always shown — toggling them is harmless either way.
let atlasPinned = false;
let atlasCell = 0;
function applyAtlas() { opts.leaves.atlas = atlasPinned ? { cols: 2, rows: 2, cell: atlasCell } : null; }
toggleControl('Pin leaf atlas cell (authored mode only)', () => atlasPinned, v => { atlasPinned = v; applyAtlas(); }, () => scheduleRegenerate());
rangeControl('Atlas cell', 0, 3, 1, () => atlasCell, v => { atlasCell = Math.round(v); applyAtlas(); }, fi, () => scheduleRegenerate());

optsSlider('leaves.shadowFraction', 'Shadow fraction', 0, 1, 0.01, pct);
optsColor('leaves.tint', 'Tint');
optsSlider('leaves.roughness', 'Roughness', 0, 1, 0.01, f2);
optsSlider('leaves.alphaTest', 'Alpha test', 0, 1, 0.01, f2);

// ===================== Export section =====================
panelSection('export', 'Export', null);
const exportArea = document.createElement('textarea');
exportArea.readOnly = true;
current.appendChild(exportArea);
// `map`/`normalMap` hold live THREE.Texture objects in authored texture mode — not
// meaningfully JSON-serializable (and not useful as a reusable createTree() preset anyway),
// so the replacer omits them from the export rather than letting JSON.stringify choke on them.
refreshExport = () => {
  exportArea.value = JSON.stringify(opts, (key, val) => (key === 'map' || key === 'normalMap' ? undefined : val), 2);
};
buttonControl('Copy tree JSON', () => {
  refreshExport();
  navigator.clipboard?.writeText(exportArea.value).catch(() => {});
});
refreshExport();

// ===================== Species tab: save / load / delete =====================
const SAVED_TREES_KEY = 'tree-viewer:saved-trees';
let savedTrees = [];
try { savedTrees = JSON.parse(localStorage.getItem(SAVED_TREES_KEY) || '[]'); } catch { savedTrees = []; }
function persistSavedTrees() { localStorage.setItem(SAVED_TREES_KEY, JSON.stringify(savedTrees)); }
// Same map/normalMap-stripping replacer Export uses — saved snapshots never hold live Texture
// objects, both because they aren't meaningfully serializable and because a saved preset should
// be a reusable createTree() options object, not tied to whatever texture mode was active when
// it was saved.
function snapshotOpts() {
  return JSON.parse(JSON.stringify(opts, (key, val) => (key === 'map' || key === 'normalMap' ? undefined : val)));
}
// Fully replaces `opts`'s contents in place (never reassigns the `opts` binding itself) so every
// closure holding a reference to `opts` keeps working. Deep-clones the saved snapshot so editing
// the loaded tree can never mutate the stored save. Re-applies the current texture mode's maps
// afterward, since saved snapshots never include them (see snapshotOpts above).
function loadOpts(savedOpts) {
  pushUndo();
  for (const k of Object.keys(opts)) delete opts[k];
  Object.assign(opts, structuredClone(savedOpts));
  baseSeed = opts.seed;
  mode = 'solo';
  gridSizeWrap.style.display = 'none';
  applyOptsAndRefresh();
  activateTab('tuning');
}

sectionHost = speciesPage;

header('Save');
let saveNameValue = '';
{
  const r = row('<span style="color:#c4ccd6">Name</span>');
  const nameInp = document.createElement('input'); nameInp.type = 'text'; nameInp.style.width = '100%';
  nameInp.addEventListener('input', () => { saveNameValue = nameInp.value; });
  current.appendChild(nameInp);
}
buttonControl('Save current tree', () => {
  const name = saveNameValue.trim() || `Tree ${savedTrees.length + 1}`;
  savedTrees.push({ name, savedAt: Date.now(), opts: snapshotOpts() });
  persistSavedTrees();
  renderSavedList();
});

header('Saved trees');
const savedListHost = document.createElement('div');
current.appendChild(savedListHost);
function renderSavedList() {
  savedListHost.innerHTML = '';
  withHost(savedListHost, () => {
    if (savedTrees.length === 0) { row('<span style="color:#7f8a99">No saved trees yet.</span>'); return; }
    savedTrees.forEach((entry, i) => {
      const r = row('<span style="color:#c4ccd6;cursor:pointer">' + entry.name + '</span>');
      const delBtn = document.createElement('span');
      delBtn.textContent = '×'; delBtn.style.cssText = 'cursor:pointer;color:#c47;padding:0 4px';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        savedTrees.splice(i, 1);
        persistSavedTrees();
        renderSavedList();
      });
      r.appendChild(delBtn);
      r.addEventListener('click', () => loadOpts(entry.opts));
    });
  });
}
renderSavedList();

positionMutBoxInitial();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
