services:
  - type: web
    name: creature-relay
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        fromGroup: render
      - key: EXPORT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: msankofa/workshop-webgpu
      - key: GITHUB_BRANCH
        value: sp1-webgpu-renderer-migration
