<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Park</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; }
  canvas { display: block; }
  #info { position: fixed; top: 10px; left: 12px; color: #98a3b4;
    font: 12px/1.55 system-ui, sans-serif; user-select: none; pointer-events: none; z-index: 5;
    max-width: 40ch; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #info b { color: #d7dee8; font-weight: 600; }
  #err { position: fixed; top: 22%; left: 12px; right: 12px; display: none; z-index: 40;
    background: #3a1518; color: #ffd7d7; border: 1px solid #7c2a2f; border-radius: 8px;
    padding: 12px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
    max-height: 50vh; overflow: auto; }
  #boot { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: #0e1116;
    color: #c4ccd6; font: 14px/1.6 system-ui, sans-serif; transition: opacity .5s; }
  #boot h1 { margin: 0; font: 600 26px/1.2 system-ui, sans-serif; color: #e6edf6; letter-spacing: .01em; }
  #boot .sub { color: #7f8a99; }
  #boot .bar { width: min(420px, 70vw); height: 3px; background: #232a34; border-radius: 2px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: #6fb98f; transition: width .3s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #hud { position: fixed; left: 12px; bottom: 12px; z-index: 6; color: #c4ccd6;
    font: 12px/1.5 system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }
  #hud .big { font-size: 15px; color: #e6edf6; font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 7;
    color: #e6edf6; font: 13px/1.5 system-ui, sans-serif; background: rgba(16,20,26,.82);
    border: 1px solid #333a45; border-radius: 8px; padding: 7px 13px; opacity: 0; transition: opacity .35s;
    pointer-events: none; }
  #toast.on { opacity: 1; }
  #minimap { position: fixed; right: 12px; bottom: 12px; z-index: 6; width: 190px; height: 190px;
    border: 1px solid #333a45; border-radius: 8px; background: rgba(16,20,26,.7); image-rendering: pixelated; }
  #guide { position: fixed; right: 12px; bottom: 214px; z-index: 8; width: 236px; max-height: 40vh;
    overflow-y: auto; background: rgba(16,20,26,.88); border: 1px solid #333a45; border-radius: 8px;
    color: #c4ccd6; font: 12px/1.5 system-ui, sans-serif; padding: 9px 11px; display: none; }
  #guide h4 { margin: 0 0 6px; font-size: 12px; color: #8a93a3; font-weight: 600; }
  #guide .row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
  #guide .row span:last-child { color: #7f8a99; }
  body.gui-hidden #info, body.gui-hidden #hud, body.gui-hidden #minimap,
  body.gui-hidden #ctrl, body.gui-hidden #guide { display: none !important; }
</style>
</head>
<body>
<div id="info">
  <b>Pokemon Park</b> &mdash; a 2.4 km national park with 151 species living in it.<br>
  <b>WASD</b> walk &middot; <b>Shift</b> run &middot; <b>Space</b> jump &middot; <b>C</b> crouch &middot; <b>V</b> first/third person<br>
  <b>F</b> field guide &middot; <b>M</b> map &middot; <b>P</b> pause the park &middot; <b>H</b> hide the interface
</div>

<div id="hud"></div>

  <h1>Pokemon Park</h1>
  <div class="sub" id="boot-msg">waking the park&hellip;</div>
  <div class="bar"><i id="boot-bar"></i></div>
</div>

<!-- three@0.184.0: three.webgpu.js and three.tsl.js both verified at jsDelivr (2026-06-19) -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>

<script>
// Errors before the module even parses have to land somewhere visible
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += (e.error?.stack || e.message || e) + '\n';
});
window.addEventListener('unhandledrejection', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += 'promise: ' + (e.reason?.stack || e.reason) + '\n';
});
</script>

<script type="module">
import * as THREE from 'three';
import {
  WebGPURenderer, MeshStandardNodeMaterial, MeshBasicNodeMaterial,
  MeshPhysicalNodeMaterial, SpriteNodeMaterial, PointsNodeMaterial,
} from 'three/webgpu';
import * as TSL from 'three/tsl';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';
import { Capsule } from 'three/addons/math/Capsule.js';

import { buildPark, PARK_TERRAIN, PARK_BIOMES, PARK_BIOME_COLORS, makeRng } from '../park-biomes.js';
import { buildParkGround, bakeBiomeImage } from '../park-ground.js';
import { createParkFlora } from '../park-flora.js';
import { SPECIES, BIOMES, MOVEMENT } from '../park-species.js';
import { planPopulation, createResidency, censusOf, speciesLoadOrder } from '../park-spawn.js';
import { createParkCreatures } from '../park-creature.js';
import { createLightingRig } from '../lights.js';
import { groundContact, slideVelocity } from '../collision.js';
import { createProceduralPlayerBody } from '../player-procedural-body.js';
import { botDesignForRole } from '../bot-body-design.js';
import { clampLookPitch, easeToward, momentumLeanTarget } from '../view-feel.js';
import { dampAlpha } from '../bot-camera-control.js';
import { buildTrailGrid, buildTrails, parkTrailLegs } from '../park-trails.js';
import { createRoadSystem } from '../roads.js';
import { makeLine, hashSeed } from '../moves/move-core.js';
import { MOVES_BY_NAME } from '../moves/move-registry.js';
import { setMoveComponentRuntime } from '../moves/move-parts.js';
import { createDiskStore, describeStatus } from '../disk-store.js';
import { installPanelTheme } from '../workshop-panel-theme.js';

// ===================== boot chrome =====================

const bootEl = document.getElementById('boot');
const bootMsg = document.getElementById('boot-msg');
const bootBar = document.getElementById('boot-bar');
let bootStep = 0;
const BOOT_STEPS = 15;
function setStatus(text) {
  bootMsg.textContent = text;
  bootBar.style.width = `${Math.min(100, (++bootStep / BOOT_STEPS) * 100)}%`;
  return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
}
const failedMessages = new Set();
const fail = (msg) => {
  msg = String(msg);
  if (failedMessages.has(msg)) return;
  failedMessages.add(msg);
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += msg + '\n';
};

const Q = new URLSearchParams(location.search);
const SEED = Number(Q.get('seed') ?? 4) || 4;
const CREATURES_MODE = Q.get('creatures') ?? 'on';
const populationQuery = Number(Q.get('pop') ?? 420);
const POPULATION = CREATURES_MODE === 'off'
  ? 0
  : Math.max(0, Number.isFinite(populationQuery) ? Math.floor(populationQuery) : 420);
const MOVES_MODE = Q.get('moves') ?? 'on';
const WATER_MODE = Q.get('water') ?? 'on';
const SKY_MODE = Q.get('sky') ?? 'on';
const FLORA_MODE = Q.get('flora') ?? 'on';
const TRAILS_MODE = Q.get('trails') ?? 'on';
const TERRAIN_MODE = Q.get('terrain') ?? 'on';
const SHADOWS_MODE = Q.get('shadows') ?? 'on';
// Parsing a GLB and compiling its pipelines are main-thread/GPU setup work. Preload by default so
// those unavoidable stalls happen behind the boot screen, never while the player is moving.
// `stream` preserves the old behavior for controlled A/B captures.
const SPECIES_LOAD_MODE = Q.get('speciesLoad') === 'stream' ? 'stream' : 'preload';
// Two baked shapes per species is 30 variants and 240 draw meshes; drop to 1 if that is too many.
const TREE_VARIANTS = Math.max(1, Math.min(4, Number(Q.get('treeVariants') ?? 2) || 2));
// Follow the display's own VSync cadence by default. Fixed caps are opt-in because a requested
// rate that is not a divisor of the display refresh (60 on 75/90/144/165 Hz, for example) has
// to skip presentation slots and reads as judder even when the individual frames are on time.
const FPS_CAP_VALUES = new Set(['30', '40', '60']);
const fpsCapQuery = Q.get('fpsCap');
const FPS_CAP_URL = FPS_CAP_VALUES.has(fpsCapQuery) ? fpsCapQuery : 'off';

// ===================== the session file =====================

const SESSION_FILE = 'park-session.json';
const store = createDiskStore({
  read: `/park-saves/${SESSION_FILE}`,
  write: `/api/save-park?filename=${SESSION_FILE}`,
  storage: localStorage, key: 'pcw:parkSession', debounceMs: 800,
});
await store.load();
const session = store.json(null) || { seed: SEED, tuning: {}, seen: {}, prefs: {} };
session.tuning ||= {};
session.seen ||= {};
session.prefs ||= {};
const saveSession = () => store.setJSON(session);

// ===================== renderer =====================

await setStatus('starting the renderer');
if (!navigator.gpu) {
  fail('This page needs WebGPU. Chrome or Edge 113+, or Safari 18+, with hardware acceleration on.');
  throw new Error('no WebGPU');
}
let gpuRequiredLimits = {};
{
  const adapter = await navigator.gpu.requestAdapter();
  if (adapter) gpuRequiredLimits = {
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
    maxBufferSize: adapter.limits.maxBufferSize,
  };
}
const renderer = new WebGPURenderer({ antialias: true, requiredLimits: gpuRequiredLimits });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = SHADOWS_MODE !== 'off';
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
const SKY_TINT = new THREE.Color(0x9dbcd8);
scene.background = SKY_TINT.clone();
scene.fog = new THREE.Fog(SKY_TINT.clone(), 260, 1500);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 2600);
// YXZ from the start: yaw is read straight off the camera and with the
camera.rotation.order = 'YXZ';

// ===================== the move light pool, BEFORE any world material =====================

const lightPool = [];
for (let i = 0; i < 6; i++) {
  const l = new THREE.PointLight(0xffffff, 0, 26, 2);
  l.userData.busy = false;
  scene.add(l);
  lightPool.push(l);
}
let moveLightsEnabled = true;
const moveLights = {
  acquire() {
    if (!moveLightsEnabled) return null;
    const l = lightPool.find((x) => !x.userData.busy);
    if (l) { l.userData.busy = true; l.intensity = 0; }
    return l || null;
  },
  release(l) { if (l) { l.intensity = 0; l.userData.busy = false; } },
};

// ===================== sun =====================

const rig = createLightingRig({ scene, ui: false, azimuth: 128, elevation: 46, sunIntensity: 2.1, ambientIntensity: 0.55 });
rig.dirLight.castShadow = SHADOWS_MODE !== 'off';
scene.add(rig.dirLight.target);
rig.dirLight.shadow.mapSize.set(2048, 2048);
rig.dirLight.shadow.camera.near = 1;
rig.dirLight.shadow.camera.far = 420;
rig.dirLight.shadow.camera.left = -110;
rig.dirLight.shadow.camera.right = 110;
rig.dirLight.shadow.camera.top = 110;
rig.dirLight.shadow.camera.bottom = -110;
rig.dirLight.shadow.camera.updateProjectionMatrix();
rig.dirLight.shadow.bias = -0.0006;
rig.dirLight.shadow.normalBias = 0.05;

// The shadow box follows the player and grows as the sun drops: at 46 degrees a 110 m box holds
// the shadows that reach the player, at 15 it does not, and the edge of the box reads as a straight
// line across the park with lit ground on one side and shadowed ground on the other.
const SHADOW_SPAN = 110;
const _shadowAt = new THREE.Vector3();
let shadowSpan = 0;
function shadowSpanFor(elevationDeg) {
  const s = Math.sin(THREE.MathUtils.degToRad(Math.max(1, elevationDeg)));
  return THREE.MathUtils.clamp(SHADOW_SPAN / Math.max(0.28, s), SHADOW_SPAN, 340);
}
function resizeShadow(span) {
  if (Math.abs(span - shadowSpan) < 4) return;
  shadowSpan = span;
  const cam = rig.dirLight.shadow.camera;
  cam.left = -span; cam.right = span; cam.top = span; cam.bottom = -span;
  cam.far = 260 + span * 2;
  cam.updateProjectionMatrix();
  // A wider box is fewer texels per metre, so the depth bias has to widen with it.
  rig.dirLight.shadow.bias = -0.0006 * (span / SHADOW_SPAN);
}
function focusShadow(x, z) {
  const y = terrainHeight(x, z);
  _shadowAt.set(x, y, z);
  resizeShadow(shadowSpanFor(rig.elevation));
  rig.dirLight.target.position.copy(_shadowAt);
  rig.dirLight.position.copy(_shadowAt).addScaledVector(skyLightDir(_sunScratch), 260);
  rig.dirLight.target.updateMatrixWorld();
  rig.dirLight.updateMatrixWorld();
}
const _sunScratch = new THREE.Vector3();

function skyLightDir(out = new THREE.Vector3()) {
  const az = THREE.MathUtils.degToRad(rig.azimuth), el = THREE.MathUtils.degToRad(rig.elevation);
  return out.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize();
}

// ===================== the park =====================

await setStatus('growing the terrain');
const park = buildPark({ seed: SEED });
const HALF = PARK_TERRAIN.worldX / 2;
const WORLD_RADIUS = Math.hypot(HALF, HALF);
const terrainHeight = (x, z) => park.map.heightAt(x, z);
const waterLevel = PARK_TERRAIN.waterLevel;
const waterHeight = () => waterLevel;

await setStatus('laying the ground');
const ground = buildParkGround({ THREE, MeshStandardNodeMaterial, TSL, park, stride: PARK_TERRAIN.meshStride });
ground.mesh.visible = TERRAIN_MODE !== 'off';
scene.add(ground.mesh);

// The terrain NORMAL for the player's slope handling, from the field rather than the drawn sheet.
const _n = [0, 1, 0];
function terrainNormal(x, z) {
  const e = 1.6;
  const hL = terrainHeight(x - e, z), hR = terrainHeight(x + e, z);
  const hD = terrainHeight(x, z - e), hU = terrainHeight(x, z + e);
  let nx = hL - hR, ny = 2 * e, nz = hD - hU;
  const inv = 1 / Math.hypot(nx, ny, nz);
  _n[0] = nx * inv; _n[1] = ny * inv; _n[2] = nz * inv;
  return _n;
}

// Where the park gate is: the middle of the developed area
const GATE = {
  x: PARK_TERRAIN.townPad.x * HALF,
  z: PARK_TERRAIN.townPad.z * HALF,
};

// ===================== trails =====================

// Roads sample the DRAWN sheet, not the field: the two disagree by up to a cell and a road that
// reads the field floats or sinks.
const roadGround = {
  heightAt: (x, z) => ground.surfaceHeightAt(x, z),
  maxNear: (x, z, r) => ground.surfaceMaxNear(x, z, r),
};
let roads = null;
let trailPaths = [];
let trailStats = { paths: 0, metres: 0, skipped: [] };
if (TRAILS_MODE !== 'off') {
  await setStatus('cutting the trails');
  try {
    roads = createRoadSystem({
      parent: scene, ground: roadGround,
      options: {
        color: 0x7a6a52, roughness: 0.97,
        surfaceCell: (PARK_TERRAIN.worldX / (PARK_TERRAIN.resolution - 1)) * PARK_TERRAIN.meshStride * 0.5,
        clearMargin: 2.6, snapDistance: 14, mergeRadius: 8, simplifyDistance: 6,
        crossingGuard: 18, crossingSpacing: 24, minEdgeLength: 8, minRouteLength: 20,
      },
    });
    const trailGrid = buildTrailGrid({
      heightAt: terrainHeight,
      worldX: PARK_TERRAIN.worldX, worldZ: PARK_TERRAIN.worldZ, waterLevel,
    });
    const built = buildTrails({ grid: trailGrid, legs: parkTrailLegs(PARK_TERRAIN) });
    let metres = 0;
    for (const path of built.paths) {
      for (let i = 1; i < path.points.length; i++) {
        metres += Math.hypot(path.points[i].x - path.points[i - 1].x, path.points[i].z - path.points[i - 1].z);
      }
      roads.network.addRoadPath(path.points.map((pt) => ({ x: pt.x, y: roadGround.heightAt(pt.x, pt.z), z: pt.z })), path.width);
    }
    roads.rebuild();
    trailPaths = built.paths;
    trailStats = { paths: built.paths.length, metres: Math.round(metres), skipped: built.skipped };
    if (built.skipped.length) console.warn('[park] trails that would not route:', built.skipped.join(', '));
  } catch (e) { fail('trails: ' + e.message); }
}
const roadClearsFlora = roads
  ? (x, z) => roads.group.visible && roads.isNearRoad(x, z)
  : null;

// ===================== water =====================

let waterRef = null;
if (WATER_MODE !== 'off') {
  await setStatus('filling the lake');
  try {
    const { createWaterSystem } = await import('../water.js');
    waterRef = createWaterSystem({
      renderer, scene, camera,
      ground: ground.mesh,
      size: PARK_TERRAIN.worldX,
      waterLevel,
      heightFn: terrainHeight,
      extentX: PARK_TERRAIN.worldX, extentZ: PARK_TERRAIN.worldZ,
      lodR0: 60, lodR1: 190,
      // A park lake is scenery, not a mirror to shave in
      reflectResolutionScale: 0.5, reflectRate: 3,
      reflectMix: 0.85, reflectBrightness: 1.0,
      depthScale: 3.4,
      causticRate: 4, causticRes: 384,
    });
    scene.add(waterRef.surface);
    rig.connect(waterRef, null);
  } catch (e) { fail('water: ' + e.message); }
}

// ===================== sky and cloud =====================

let skyRef = null, cloudsRef = null, clouds2Ref = null;
if (SKY_MODE !== 'off') {
  await setStatus('hanging the sky');
  try {
    const { createSky } = await import('../sky.js?v=sp7-hdplanets');
    skyRef = createSky({
      scene, camera, size: PARK_TERRAIN.worldX, sunDir: skyLightDir(),
      parts: { stars: false, milkyWay: false, bodies: true },
    });
    scene.add(skyRef.group);
  } catch (e) { fail('sky: ' + e.message); }
  try {
    const { Clouds } = await import('../clouds.js');
    for (const [ref, y, extent, puff, opacity] of [[0, 340, 9000, 1.0, 0.85], [1, 620, 20000, 3.0, 0.45]]) {
      const c = new Clouds();
      c.rotation.x = -Math.PI / 2;
      c.position.y = y;
      c.setExtent(extent); c.setCoverage(0.42); c.setOpacity(opacity);
      c.setSpeed(0.85); c.setPuff(puff); c.setSoftness(0.35); c.setFade(0.55);
      scene.add(c);
      if (ref === 0) cloudsRef = c; else clouds2Ref = c;
    }
  } catch (e) { fail('clouds: ' + e.message); }
}

// ===================== grass, trees and rock =====================

let flora = null;
if (FLORA_MODE !== 'off') {
  try {
    flora = await createParkFlora({
      THREE, renderer, camera, scene, park,
      onStatus: setStatus,
      clearFn: roadClearsFlora,
      options: {
        grass: FLORA_MODE !== 'nograss',
        forest: FLORA_MODE !== 'notrees',
        boulders: FLORA_MODE !== 'norocks',
        treeVariantsPerSpecies: TREE_VARIANTS,
        // Resolved against the document, and the document is in demos/.
        texDir: '../textures',
        treeTextures: Q.get('treeTex') === 'off' ? 'off' : 'authored',
        grassLook: session.tuning.grassLook || undefined,
      },
    });
  } catch (e) { fail('flora: ' + e.message); }
}

// ===================== the residents =====================

await setStatus('taking the census');
const plan = planPopulation(park.map, { seed: SEED, count: POPULATION, entry: GATE });
const census = censusOf(plan);
const residency = createResidency(plan.residents, {
  activeRadius: 130, farRadius: 210, dropRadius: 250,
  maxActivations: 1, maxDeactivations: 5, hardMax: 52,
});

const creatures = createParkCreatures({
  THREE, scene, GLTFLoader, skeletonClone,
  terrainHeight, waterHeight, waterLevel,
  worldRadius: WORLD_RADIUS,
  rng: makeRng(SEED ^ 0x5bd1),
  // A species' render pipeline compiles once, at load, off the frame it first becomes visible.
  warmMaterials: (obj) => renderer.compileAsync(obj, camera, scene),
  options: { modelPath: '../models/stadium/' },
});

// Species load in nearest-first order so the park fills in around you rather than from the far shore.
const loadOrder = speciesLoadOrder(plan.residents, GATE.x, GATE.z);
const loadQueue = loadOrder.slice();
let loading = 0;
async function loadSpecies(key) {
  try {
    await creatures.ensureSpecies(SPECIES[key]);
    return true;
  } catch (e) {
    fail(`${SPECIES[key].name}: ${e.message}`);
    return false;
  }
}
function pumpSpeciesLoads() {
  // One at a time: a GLB parse is synchronous once the bytes land, and two landing together hitch.
  while (loading < 1 && loadQueue.length) {
    const key = loadQueue.shift();
    loading++;
    loadSpecies(key).finally(() => { loading--; });
  }
}

const bootSpeciesCount = SPECIES_LOAD_MODE === 'preload' ? loadQueue.length : Math.min(6, loadQueue.length);
await setStatus(SPECIES_LOAD_MODE === 'preload'
  ? `loading all residents before play (${bootSpeciesCount} species)`
  : `loading the first residents (${census.distinct} species)`);
for (let i = 0; i < bootSpeciesCount; i++) {
  const key = loadQueue.shift();
  if (SPECIES_LOAD_MODE === 'preload') {
    bootMsg.textContent = `loading residents ${i + 1}/${bootSpeciesCount}: ${SPECIES[key].name}`;
  }
  await loadSpecies(key);
  // Let the boot message paint even when models are cached and their fetch promises resolve quickly.
  if (SPECIES_LOAD_MODE === 'preload') await new Promise((resolve) => requestAnimationFrame(resolve));
}

// ===================== moves =====================

const FX_MODULES = {
  bolt: ['../moves/fx-bolt.js', 'createBoltFx'],
  stream: ['../moves/fx-stream.js', 'createStreamFx'],
  crystals: ['../moves/fx-crystals.js', 'createCrystalsFx'],
  fissure: ['../moves/fx-fissure.js', 'createFissureFx'],
  aurora: ['../moves/fx-aurora.js', 'createAuroraFx'],
  cloud: ['../moves/fx-cloud.js', 'createCloudFx'],
  orb: ['../moves/fx-orb.js', 'createOrbFx'],
  blade: ['../moves/fx-blade.js', 'createBladeFx'],
  shock: ['../moves/fx-shock.js', 'createShockFx'],
  ring: ['../moves/fx-ring.js', 'createRingFx'],
  vortex: ['../moves/fx-vortex.js', 'createVortexFx'],

async function warmMoveEffects() {
  const selected = [];

  for (const move of Object.values(MOVES_BY_NAME)) {
    if (move.hold || FX_BANNED.has(move.fx) || !fx[move.fx]) continue;
    const key = POOLED_MOVE_FX.has(move.fx) ? `${move.fx}:${move.palette || 'default'}` : move.fx;
    if (seen.has(key)) continue;
    seen.add(key);
    selected.push(move);
  }
  if (!selected.length) return;

  await setStatus(`warming ${selected.length} move effects`);
  const from = { x: -4, z: -4 };
  const to = { x: 4, z: -3 };
  const line = makeLine({ from, to, terrainHeight, step: 0.45 });
  const BATCH_SIZE = 6; // matches the shared move-light budget
  for (let start = 0; start < selected.length; start += BATCH_SIZE) {
    const instances = [];
    try {
      for (const move of selected.slice(start, start + BATCH_SIZE)) {
        try {
          const inst = fx[move.fx].cast({
            ...(move.options || {}),
            line,
            seed: hashSeed(`prewarm:${move.name}`),
            palette: move.palette,
            power: move.power,
            sourceY: 0.8,
            targetY: 0.7,
          });
          if (!inst?.group) continue;
          configureMoveMachine(inst, move);
          // Effects build hidden impact/fade layers up front. Make every layer compilable before play.
          inst.group.traverse((part) => { part.visible = true; });
          instances.push(inst);
        } catch (e) {

    } finally {

  camera.position.copy(botCamFocus).addScaledVector(botCamForward, -botCamDistance);
}

// Original Pokemon Park camera, retained only behind the legacy comparison profile.
function placePokemonLegacyCamera(dt) {
  const eye = playerCollider.end;
  if (!camEyeSet || camEye.distanceToSquared(eye) > CAM.snapDist * CAM.snapDist) {
    camEye.copy(eye);
    camEyeSet = true;
  } else {
    camEye.x = easeToward(camEye.x, eye.x, dt, CAM.followRate);
    camEye.z = easeToward(camEye.z, eye.z, dt, CAM.followRate);
    camEye.y = easeToward(camEye.y, eye.y, dt, playerOnFloor ? CAM.riseRate : CAM.followRate);
  }
  if (!thirdPerson) { camera.position.copy(camEye); camDistNow = 0; return; }

  const p = clampLookPitch(look.pitch);
  const cp = Math.cos(p);
  const dx = -Math.sin(look.yaw) * cp, dy = Math.sin(p), dz = -Math.cos(look.yaw) * cp;
  const ox = camEye.x + Math.cos(look.yaw) * camShoulder;
  const oz = camEye.z - Math.sin(look.yaw) * camShoulder;
  const oy = camEye.y + 0.2;

  // Fine steps: the old halving quantised the boom to five lengths, so every trunk it grazed popped it.
  let want = CAM.boomMin;
  for (let d = camDist; d >= CAM.boomMin; d -= CAM.boomStep) {
    const x = ox - dx * d, y = oy - dy * d, z = oz - dz * d;
    if (y > terrainHeight(x, z) + 0.7
      && !(subsystemEnabled.flora && floraRuntime.collisions && flora && flora.resolveCollision(x, z, 0.55).pushed)) { want = d; break; }
  }
  // Snap in so nothing swallows the camera, ease out so leaving cover does not whip.
  camDistNow = want < camDistNow ? want : easeToward(camDistNow, want, dt, CAM.boomOutRate);

  const x = ox - dx * camDistNow, z = oz - dz * camDistNow;
  camera.position.set(x, Math.max(oy - dy * camDistNow, terrainHeight(x, z) + 0.7), z);
}

function placeCamera(dt) {
  if (cameraProfile === CAMERA_PROFILE_ENV) placeEnvironmentCamera();
  else if (cameraProfile === CAMERA_PROFILE_PARK) placePokemonLegacyCamera(dt);
  else placeBotViewerCamera(dt);
}

const _px = { x: 0, y: 0 };
function drawMinimap() {
  const n = mapCanvas.width;
  const sx = n / PARK_TERRAIN.worldX, sz = n / PARK_TERRAIN.worldZ;
  // Written into a scratch rather than returned as a pair
  const toPx = (x, z) => { _px.x = (x + HALF) * sx; _px.y = (z + HALF) * sz; };
  mapCtx.imageSmoothingEnabled = false;
  mapCtx.drawImage(biomeImage, 0, 0, n, n);

  // Only residents that currently exist
  mapCtx.fillStyle = 'rgba(255,255,255,.72)';
  for (const c of creatures.live.values()) {
    const p = c.walker ? c.walker.body.pos : c.mover.body;
    toPx(p.x, p.z);
    mapCtx.fillRect(_px.x - 1, _px.y - 1, 2, 2);
  }
  toPx(GATE.x, GATE.z);
  mapCtx.strokeStyle = '#ffd166';
  mapCtx.strokeRect(_px.x - 3, _px.y - 3, 6, 6);

  toPx(playerCollider.start.x, playerCollider.start.z);
  const px = _px.x, pz = _px.y;
  mapCtx.save();
  mapCtx.translate(px, pz);
  mapCtx.rotate(-look.yaw);
  mapCtx.fillStyle = '#6fb98f';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -6); mapCtx.lineTo(4, 5); mapCtx.lineTo(-4, 5);
  mapCtx.closePath(); mapCtx.fill();
  mapCtx.restore();
}

// A leaf-size edit replaces the GPU forest exactly as environment-viewer does. Keep the panel's
// persistent arrays/sets pointed at the replacement meshes rather than the disposed first bake.
function refreshForestBindings() {
  const next = flora?.forest?.meshes || [];
  floraCollections.trees.splice(0, floraCollections.trees.length, ...next);
  forestMeshSet.clear();
  for (const mesh of next) {
    forestMeshSet.add(mesh);
    if (!floraShadowDefaults.has(mesh)) floraShadowDefaults.set(mesh, mesh.castShadow);
  }
  applyTreeLods();
  applyTreeRecull();
  flora?.forest?.setMaxDrawRadius?.(params.treeDrawDistance);
  flora?.forest?.setConeMargin?.(params.treeConeMargin);
  flora?.forest?.setConeEnabled?.(treeRuntime.coneCulling);
  flora?.forest?.setFarLeavesDoubleSided?.(treeRuntime.farLeavesDoubleSided);
  applyTreeRenderParts();
  syncFloraVisibility();
}

function applyTreeRenderParts() {
  flora?.forest?.setRenderParts?.({
    bark: treeRuntime.bark,
    leaves: treeRuntime.leaves,
    billboards: treeRuntime.billboards,
    barkShadows: floraRuntime.shadows && treeRuntime.barkShadows,
    leafShadows: floraRuntime.shadows && treeRuntime.leafShadows,
  });
}

function syncFloraCollection(meshes, shown) {
  let restored = false;
  for (const mesh of meshes) {
    if (!shown) {
      if (!floraVisibility.has(mesh)) floraVisibility.set(mesh, mesh.visible);
      mesh.visible = false;
    } else if (floraVisibility.has(mesh)) {
      mesh.visible = floraVisibility.get(mesh);
      floraVisibility.delete(mesh);
      restored = true;
    }
  }
  return restored;
}

function syncFloraVisibility() {
  const master = subsystemEnabled.flora;
  syncFloraCollection(floraCollections.grass, master && floraRuntime.grassRender);
  const treesRestored = syncFloraCollection(floraCollections.trees, master && floraRuntime.treesRender);
  syncFloraCollection(floraCollections.rocks, master && floraRuntime.rocksRender);
  if (master && floraRuntime.treesRender && treesRestored) flora?.forest?.refreshVisibility?.();
}

function setFloraShadows(on) {
  floraRuntime.shadows = !!on;
  for (const [mesh, original] of floraShadowDefaults) {
    if (!forestMeshSet.has(mesh)) mesh.castShadow = floraRuntime.shadows ? original : false;

}

function slider(key, label, min, max, step, fmt, onChange, commitOnly = false) {
  const row = document.createElement('div');

    params[key] = parseFloat(inp.value);

    saveSession();
  };
  if (commitOnly) {
    inp.addEventListener('input', () => { val.textContent = fmt(parseFloat(inp.value)); });
    inp.addEventListener('change', apply);
  } else {
    inp.addEventListener('input', apply);

if (flora && flora.grass) {

  slider('grassDensity', 'Blades per m2', 1, 24, 0.5, f1, () => flora.setGrass({ density: params.grassDensity }));
  note('Blade look. Each is a live uniform, so none of these recompiles a shader.');
  session.tuning.grassLook ||= {};
  const look = { ...flora.getGrassLook(), ...session.tuning.grassLook };
  for (const [key, label, why] of [
    ['windDir', 'Wind direction', 'A coherent gust travelling along a heading, instead of one shared wave'],
    ['curl', 'Blade curl', 'A resting arc per blade'],
    ['rootShade', 'Root shading', 'Darkens each blade toward its root'],
    ['translucency', 'Backlight', 'Blades glow where you look into the sun'],
    ['coverage', 'Patchiness', 'An FBM mask that collapses the blades outside it'],
  ]) {
    toggle(label, () => look[key], (on) => {
      look[key] = on;
      session.tuning.grassLook[key] = on;
      flora.setGrassLook({ [key]: on });
      saveSession();
    }, why);
  }
  // Curl alone bends the blade; the arc normal is what changes how it is lit.
  toggle('Curl affects lighting', () => look.curlNormal > 0, (on) => {
    look.curlNormal = on ? 0.65 : 0;
    session.tuning.grassLook.curlNormal = look.curlNormal;
    flora.setGrassLook({ curlNormal: look.curlNormal });
    saveSession();
  }, 'Feeds the curl arc normal to the lighting. Off, blades light as if upright.');
  flora.setGrassLook(look);
} else {
  note('No grass on this run.');

header('View', true);
const cameraProfileBoxes = new Map();
function syncCameraProfileBoxes() {
  for (const [profile, box] of cameraProfileBoxes) box.checked = cameraProfile === profile;
}
function setCameraProfile(profile, { applyDefaults = true, announce = true, persist = true } = {}) {
  if (!CAMERA_PROFILES[profile]) profile = CAMERA_PROFILE_BOT;
  cameraProfile = profile;
  const settings = CAMERA_PROFILES[profile];
  if (applyDefaults) {
    params.camDist = settings.distance;
    params.camShoulder = settings.shoulder;
    params.sensitivity = settings.sensitivity;
    camDist = params.camDist;
    camShoulder = params.camShoulder;
    fp.sensitivity = params.sensitivity;
    for (const control of controlRegistry) control.sync();
  }
  camera.fov = settings.fov;
  camera.updateProjectionMatrix();
  look.tilt = 0;
  look.lean = 0;
  look.prevSpeed = Math.hypot(playerVelocity.x, playerVelocity.z);
  resetCameraPlacementState();
  syncCameraProfileBoxes();
  if (persist) {
    session.tuning.cameraProfile = profile;
    session.tuning.camDist = params.camDist;
    session.tuning.camShoulder = params.camShoulder;
    session.tuning.sensitivity = params.sensitivity;
    saveSession();
  }
  if (announce) toast(`${settings.label} camera`);
}
function cameraProfileToggle(profile) {
  const settings = CAMERA_PROFILES[profile];
  let box = null;
  box = toggle(settings.label, () => cameraProfile === profile, (on) => {
    if (on) setCameraProfile(profile);
    else box.checked = true; // exactly one profile must remain active
  });
  cameraProfileBoxes.set(profile, box);
}
cameraProfileToggle(CAMERA_PROFILE_BOT);
cameraProfileToggle(CAMERA_PROFILE_ENV);
cameraProfileToggle(CAMERA_PROFILE_PARK);
note('Bot Viewer v3 is the default. Environment is direct-coupled. Pokemon legacy is the previous smoothed-eye and stepped-boom stack for A/B comparison only.');
slider('sensitivity', 'Mouse sensitivity', 100, 1600, 10, f0, () => { fp.sensitivity = params.sensitivity; });

{

function snapshot() {
  const p = (n) => String(n).padStart(2, '0');
  const d = new Date();
  const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  fetch(`/api/save-park?filename=park-session-${stamp}.json`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(session),
  }).then((r) => r.json()).then((i) => toast(i.ok ? `snapshot written to ${i.path}` : `snapshot failed: ${i.error}`))
    .catch((e) => toast('snapshot failed: ' + e.message));
}

// A debounced autosave loses the last edit to a closing tab
addEventListener('pagehide', () => {
  if (!store.dirty) return;
  navigator.sendBeacon(`/api/save-park?filename=${SESSION_FILE}`, new Blob([store.text], { type: 'application/json' }));
});

for (const c of controlRegistry) c.sync();
// The grass backlight needs the direction TOWARD the sun; it is a uniform, so this is not per-frame.

rig.setElevation(params.timeOfDay);
rig.setAzimuth(params.sunAzimuth);
pushSunDir();

camShoulder = params.camShoulder;

camDist = params.camDist;

creatures.options.drawDistance = params.creatureRange;
scene.fog.near = params.fogNear;
scene.fog.far = params.fogFar;
scene.fog.near = params.fogNear;
scene.fog.far = params.fogFar;

camDist = params.camDist;

// ===================== streaming =====================

const lastSeenNear = new Set();
function streamResidents() {
  const px = playerCollider.start.x, pz = playerCollider.start.z;
  const work = residency.update(px, pz);
  for (const r of work.deactivate) {
    creatures.despawn(r.id);
    residency.active.delete(r.id);
  }
  for (const r of work.activate) {
    if (!creatures.isLoaded(r.key)) {
      // A failed species stays terminal until an explicit retry or reload. Requeueing its cached
      // rejection every 200 ms used to grow the error DOM and turn one bad asset into a hitch loop.
      if (creatures.hasFailed(r.key)) continue;
      // Not loaded yet: put it at the head of the queue rather than dropping it
      if (!loadQueue.includes(r.key)) loadQueue.unshift(r.key);
      continue;
    }
    const c = creatures.spawn(r);
    if (c) residency.active.set(r.id, c);
  }
  pumpSpeciesLoads();
}

/** Anything close and in front counts as seen, which is what makes the field guide worth filling. */
function noteSightings() {
  const px = camera.position.x, pz = camera.position.z;
  camera.getWorldDirection(_camFwd);
  lastSeenNear.clear();
  for (const c of creatures.live.values()) {
    if (!c.group.visible) continue;
    const p = c.walker ? c.walker.body.pos : c.mover.body;
    const dx = p.x - px, dz = p.z - pz;
    const d = Math.hypot(dx, dz);
    if (d > 45) continue;
    if ((dx * _camFwd.x + dz * _camFwd.z) / (d || 1) < 0.4) continue;
    lastSeenNear.add(c.id);
    noteSighting(c);
  }
}

// ===================== HUD =====================

const hudEl = document.getElementById('hud');
let hudTimer = 0;
function updateHud(now, fps) {
  if (now - hudTimer < 250) return;
  hudTimer = now;
  const x = playerCollider.start.x, z = playerCollider.start.z;
  const biome = park.map.biomeAt(x, z);
  const s = creatures.stats;
  const drawCalls = renderer.info.render.drawCalls;
  const triangleK = renderer.info.render.triangles / 1000;
  subsystemPerf.textContent = drawCalls + ' draws · ' + triangleK.toFixed(0) + 'k tris · '
    + fps.toFixed(0) + ' fps · worst ' + hitchMs.toFixed(0) + ' ms';
  const treeSummary = flora?.forest?.summary;
  treePerfEl.textContent = treeSummary
    ? treeSummary.instances + ' trees · ' + treeSummary.draws + ' forest draws · '
      + treeSummary.visibleVariants + ' variants · reculls ' + treeSummary.reculls
      + ' / skipped ' + treeSummary.skippedReculls + ' · density ' + params.treeDensityPct.toFixed(0)
      + '% · LOD ' + params.treeLod0.toFixed(0) + '/' + params.treeLod1.toFixed(0) + '/'
      + params.treeLod2.toFixed(0) + ' → ' + params.treeDrawDistance.toFixed(0) + ' m'
    : 'Forest unavailable in this run.';
  creaturePerfEl.textContent = 'Simulation ' + creaturePerf.simulationLast.toFixed(2) + ' ms (peak '
    + creaturePerf.simulationPeak.toFixed(2) + ') · stream ' + creaturePerf.streamLast.toFixed(2)
    + ' ms (peak ' + creaturePerf.streamPeak.toFixed(2) + ') · spawn '
    + (s.spawnLastMs || 0).toFixed(2) + ' ms (peak ' + (s.spawnPeakMs || 0).toFixed(2) + ') · cast '
    + movePerf.castLast.toFixed(2) + ' ms (peak ' + movePerf.castPeak.toFixed(2) + ', '
    + movePerf.lastMove + ') · queue ' + pendingCasts.length
    + (movePerf.dropped ? ' · dropped ' + movePerf.dropped : '')
    + ' · FX update ' + movePerf.updateLast.toFixed(2) + ' ms (peak ' + movePerf.updatePeak.toFixed(2)
    + ') · lights ' + lightPool.filter((light) => light.userData.busy).length + '/' + lightPool.length
    + ' · particles ' + Math.round(moveRuntime.particleScale * 100) + '%';
  hudEl.innerHTML =
    `<div class="big">${BIOMES[biome].label}</div>` +
    `${s.posed} creatures moving &middot; ${s.live} loaded &middot; ${s.loaded} species &middot; ` +
    (flora ? `${flora.stats.trees} trees of ${flora.stats.treeSpecies} species &middot; ` : '') +
    `${liveMoves.length} moves &middot; ${fps.toFixed(0)} fps &middot; worst ${hitchMs.toFixed(0)} ms &middot; ` +
    `${renderer.info.render.drawCalls} draws, ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris` +
    (s.offscreen ? ` &middot; ${s.offscreen} culled` : '') +
    (loadQueue.length ? ` &middot; loading ${loadQueue.length} more` : '');
}

// ===================== the frame =====================

let paused = false;
let fpsCapMs = FPS_CAP_URL === 'off' ? Infinity : 1000 / Number(FPS_CAP_URL);
let lastRendered = -Infinity;
let _frameBusy = false;
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fps = 0;
let lastStream = -1e9, lastSighting = -1e9, lastMap = -1e9;
let hitchMs = 0, hitchPeak = 0;
const _sun = new THREE.Vector3();

async function animate() {
  // `setAnimationLoop` does NOT await an async callback.
  if (_frameBusy) return;
  if (fpsCapMs !== Infinity) {
    const t = performance.now();
    // Explicit caps are best-effort profiling/thermal controls. The uncapped default avoids
    // refresh-divisor judder; this tolerance only prevents a 60 Hz display from falling to 30.
    if (t - lastRendered < fpsCapMs - 0.5) return;
    lastRendered = t;
  }
  _frameBusy = true;
  try {
    const rawDt = Math.min(clock.getDelta(), 0.1);
    const now = performance.now();

    if (subsystemEnabled.sky && skyRef) {
      skyRef.group.position.copy(camera.position);
      skyLightDir(_sun);
      skyRef.setSunDir(_sun);
      skyRef.updateDome(rig.elevation);
      skyRef.update(now / 1000);
    }
    if (subsystemEnabled.sky) for (const c of [cloudsRef, clouds2Ref]) {
      if (!c) continue;
      c.position.x = camera.position.x;
      c.position.z = camera.position.z;
      c.update(now / 1000, camera.position);
    }

    const dt = Math.min(rawDt, 0.05) / STEPS_PER_FRAME;
    for (let i = 0; i < STEPS_PER_FRAME; i++) { applyControls(dt); stepPlayer(dt); }
    updateViewFeel(rawDt);
    poseBody(rawDt);
    placeCamera(rawDt);
    // Culling and the sighting cone read the camera matrix, so it has to be current, not last frame's.
    camera.updateMatrixWorld();
    if (subsystemEnabled.shadows) focusShadow(playerCollider.start.x, playerCollider.start.z);

    // Streaming, sightings and the map are swept on their own cadences.
    // Spawning clones a rig, so it waits for a frame that has room rather than piling onto a slow one.
    if (subsystemEnabled.creatures && creatureRuntime.streaming
      && now - lastStream > 200 && (rawDt < 0.028 || now - lastStream > 1200)) {
      lastStream = now;
      const streamStartedAt = performance.now();
      streamResidents();
      creaturePerf.streamLast = performance.now() - streamStartedAt;
      creaturePerf.streamPeak = Math.max(creaturePerf.streamPeak, creaturePerf.streamLast);
      creaturePerf.streamEvents++;
    }
    if (subsystemEnabled.creatures && creatureRuntime.simulation) {
      const simulationStartedAt = performance.now();
      creatures.update(rawDt, camera, {
        paused,
        castingEnabled: creatureRuntime.moves && params.moveFrequency > 0,
        cast: (c) => { if (Math.random() < params.moveFrequency) enqueueCast(c); },
      });
      creaturePerf.simulationLast = performance.now() - simulationStartedAt;
      creaturePerf.simulationPeak = Math.max(creaturePerf.simulationPeak, creaturePerf.simulationLast);
    }
    if (subsystemEnabled.creatures && creatureRuntime.simulation && creatureRuntime.moves) {
      processOnePendingCast();
    } else if (pendingCasts.length) {
      clearPendingCasts();
    }
    if (creatureVisibilitySuppressed) syncCreatureVisibility();
    if (subsystemEnabled.creatures && now - lastSighting > 100) { lastSighting = now; noteSightings(); }

    restoreMoveComponentOverrides();
    if (moveRuntime.updates) {
      const moveUpdateStartedAt = performance.now();
      for (let i = liveMoves.length - 1; i >= 0; i--) {
        let alive = false;
        try { alive = liveMoves[i].update(rawDt, now / 1000); }
        catch (e) { fail(`${liveMoves[i].moveName}: ${e.message}`); }
        if (!alive) { try { liveMoves[i].dispose(); } catch (_) {} liveMoves.splice(i, 1); }
      }
      movePerf.updateLast = performance.now() - moveUpdateStartedAt;
      movePerf.updatePeak = Math.max(movePerf.updatePeak, movePerf.updateLast);
    } else {
      movePerf.updateLast = 0;
    }
    suppressMoveComponents();
    if (!moveRuntime.lights) for (const light of lightPool) light.intensity = 0;

    if (subsystemEnabled.water && waterRef) waterRef.update(now / 1000);

    // Awaited, and after the camera has its final position for the frame.
    if (subsystemEnabled.flora && flora) {
      await flora.update(camera.position, now / 1000, {
        grass: floraRuntime.grassUpdate,
        trees: floraRuntime.treesUpdate,
        rocks: floraRuntime.rocksUpdate,
      });
      syncFloraVisibility();
    }

    renderer.render(scene, camera);
    if (skyRef) skyRef.flushDisposals();

    if (now - lastMap > 50) { lastMap = now; drawMinimap(); }
    fpsAcc += rawDt; fpsN++;
    hitchPeak = Math.max(hitchPeak, rawDt * 1000);
    if (fpsAcc >= 0.4) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; hitchMs = hitchPeak; hitchPeak = 0; }
    updateHud(now, fps);
  } finally { _frameBusy = false; }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  waterRef?.resize();
  sizeMinimap();
});

await setStatus('opening the gate');
if (fxMissing.length) fail('these effects did not load: ' + fxMissing.join(', '));
if (creatures.warnings.length) console.warn('[park]', creatures.warnings.join('\n'));
renderer.setAnimationLoop(animate);
bootEl.classList.add('gone');
setTimeout(() => bootEl.remove(), 600);
toast(`Welcome to the park — ${plan.residents.length} residents, ${census.distinct} species`);
</script>
