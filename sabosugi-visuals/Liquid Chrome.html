<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Chrome</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import GUI from 'lil-gui';

        // --- Configuration ---
        const CONFIG = {
            animSpeed: 0.15,
            sharpness: 2.9,
            octavesA: 3,
            octavesB: 6,
            colorDark: '#000000',
            colorMid: '#ffffff',
            colorBg: '#000000',
            randomize: () => {
                uniforms.u_seed.value = Math.random() * 1000.0;
            }
        };

        // --- Scene Setup ---
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // Set strictly to 1 as requested
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        
        // Orthographic camera for fullscreen shader
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        // --- Shader Setup ---
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0.0 },
            u_seed: { value: Math.random() * 1000.0 },
            
            u_animSpeed: { value: CONFIG.animSpeed },
            u_sharpness: { value: CONFIG.sharpness },
            u_octavesA: { value: CONFIG.octavesA },
            u_octavesB: { value: CONFIG.octavesB },
            
            u_colorDark: { value: new THREE.Color(CONFIG.colorDark) },
            u_colorMid: { value: new THREE.Color(CONFIG.colorMid) },
            u_colorBg: { value: new THREE.Color(CONFIG.colorBg) }
        };

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_seed;
            
            uniform float u_animSpeed;
            uniform float u_sharpness;
            uniform int u_octavesA;
            uniform int u_octavesB;
            
            uniform vec3 u_colorDark;
            uniform vec3 u_colorMid;
            uniform vec3 u_colorBg;

            // --- MATH & UTILITIES ---
            mat2 getRotation(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Pseudo-random generators
            float prng1(float n) {
                return fract(sin(n * 1026.12967 + u_seed) * 43759.3053);
            }

            float prng2(vec2 p) {
                return fract(sin(dot(p, vec2(1.5898, 65.453)) + u_seed) * 43758.1253);
            }

            // --- PROCEDURAL NOISE ---
            float texNoise3D(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                
                vec3 u = f * f * (3.0 - 2.0 * f);
                float n = i.x + i.y * 57.0 + 113.0 * i.z;

                float r1 = mix(prng1(n), prng1(n + 1.0), u.x);
                float r2 = mix(prng1(n + 57.0), prng1(n + 58.0), u.x);
                float r3 = mix(prng1(n + 113.0), prng1(n + 114.0), u.x);
                float r4 = mix(prng1(n + 170.0), prng1(n + 171.0), u.x);

                return mix(mix(r1, r2, u.y), mix(r3, r4, u.y), u.z);
            }

            vec3 evalNoise2D(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);

                vec2 du = vec2(53.6, 13.2) * f * f * (f * (f - 2.0) + 1.0);
                vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);

                float a = prng2(i);
                float b = prng2(i + vec2(1.0, 0.0));
                float c = prng2(i + vec2(0.0, 1.0));
                float d = prng2(i + vec2(1.0, 1.0));

                float k0 = a;
                float k1 = b - a;
                float k2 = c - a;
                float k3 = a - b - c + d;

                float val = k0 + k1 * u.x + k2 * u.y + k3 * u.x * u.y;
                vec2 grad = du * vec2(k1 + k3 * u.y, k2 + k3 * u.x);

                return vec3(val, grad);
            }

            // --- FLUID DYNAMICS ---
            float buildBaseStructure(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                vec2 sumGrad = vec2(0.0);

                // Max 10 octaves, dynamically break
                for (int i = 0; i < 10; i++) {
                    if (i >= u_octavesB) break; 
                    vec3 n = evalNoise2D(p);
                    sumGrad += n.yz;
                    v += a * n.x / (1.0 + dot(sumGrad, sumGrad));
                    
                    a *= 0.75;
                    p *= 1.5;
                }
                return v;
            }

            float buildFluidFBM(vec2 p, float flowTime) {
                vec3 p1 = vec3(p * 0.1, 0.0);
                vec3 p2 = vec3(p * 0.1, 10.0);
                float warpAngle = 2.79 * texNoise3D(p1) + 0.75 * texNoise3D(p2);
                
                mat2 rotMap = getRotation(warpAngle);
                
                float v = 0.0;
                float a = 0.3;
                vec2 sumGrad = vec2(0.0);

                // Max 10 octaves, dynamically break
                for (int i = 0; i < 10; i++) {
                    if (i >= u_octavesA) break;
                    vec3 n = evalNoise2D(p);
                    sumGrad += n.yz;
                    v += a * n.x / (1.0 + dot(sumGrad, sumGrad));
                    
                    a *= 0.89;
                    p *= 1.16;
                    p *= rotMap;
                    
                    p += flowTime * 0.2; 
                }
                return v;
            }

            // --- MAIN RENDER PASS ---
            void main() {
                vec2 fragCoord = gl_FragCoord.xy;
                vec2 uv = (fragCoord - 0.5 * u_resolution.xy) / u_resolution.x;
                uv *= -2.0;

                float timeVal = u_time * u_animSpeed;
                float r = max(length(uv), 0.0001);
                
                vec2 field = vec2(r) + (1.0 / (r * 75.0)) - timeVal;
                
                float baseDisp = buildBaseStructure(field);
                float turb1 = 0.5 * buildFluidFBM(uv * 2.0 * baseDisp, timeVal);
                
                float ink = 0.5 * buildFluidFBM(uv * turb1 * 8.0, timeVal);
                float grain = 0.02 * prng2(uv);
                
                float signal = ink + grain;

                float grade = 1.0 - 1.2 * signal;
                grade *= u_sharpness;
                grade = grade / (1.0 + grade);
                grade = smoothstep(0.21, 0.88, grade);

                vec3 finalCol = mix(
                    mix(u_colorDark, u_colorMid, smoothstep(0.0, 0.5, grade)),
                    u_colorBg,
                    smoothstep(0.4, 0.95, grade)
                );

                gl_FragColor = vec4(finalCol, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            depthWrite: false,
            depthTest: false
        });

        // Fullscreen quad
        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- GUI Setup ---
        const gui = new GUI({ title: 'Shader Settings' });
        gui.close(); // Closed by default

        gui.add(CONFIG, 'randomize').name('Randomize Pattern');

        const folderAnimation = gui.addFolder('Animation & Shape');
        folderAnimation.add(CONFIG, 'animSpeed', 0, 1, 0.01).name('Anim Speed').onChange(v => uniforms.u_animSpeed.value = v);
        folderAnimation.add(CONFIG, 'sharpness', 0.5, 10.0, 0.1).name('Sharpness').onChange(v => uniforms.u_sharpness.value = v);
        
        const folderGeometry = gui.addFolder('Noise Detail (Octaves)');
        folderGeometry.add(CONFIG, 'octavesA', 1, 10, 1).name('Octaves A (Fluid)').onChange(v => uniforms.u_octavesA.value = v);
        folderGeometry.add(CONFIG, 'octavesB', 1, 10, 1).name('Octaves B (Base)').onChange(v => uniforms.u_octavesB.value = v);

        const folderColors = gui.addFolder('Colors');
        folderColors.addColor(CONFIG, 'colorDark').name('Dark Color').onChange(v => uniforms.u_colorDark.value.set(v));
        folderColors.addColor(CONFIG, 'colorMid').name('Mid Color').onChange(v => uniforms.u_colorMid.value.set(v));
        folderColors.addColor(CONFIG, 'colorBg').name('Background').onChange(v => uniforms.u_colorBg.value.set(v));

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.u_resolution.value.set(width, height);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            uniforms.u_time.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
