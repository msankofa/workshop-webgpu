<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Unknown Galaxy</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lil-gui.root {
      --background-color: rgba(12, 12, 12, 0.92);
      --widget-color: #3f3f3f;
      --hover-color: #505050;
      --focus-color: #5a5a5a;
      --text-color: #f2f2f2;
      --number-color: #7fd2ff;
      --string-color: #ffffff;
      top: 12px;
      right: 12px;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm";

    const params = {
      cameraFov: 51,
      cameraZ: 7.1,
      cameraY: 4.0,

      flowSpeed: 0.002,
      twist: 2.3,

      particleCount: 129000,
      particleSize: 1.5,

      neckRadius: 0.46,
      upperWidth: 7.0,
      lowerWidth: 1.0,
      height: 2.91,

      lineCount: 4,
      lineOpacity: 0.0,
      lineFade: 0.45,

      brightness: 3.02,
      coreBrightness: 2.7,

      particleColor: "#8af1ff",
      lineColor: "#c7f8ff",
      background: "#000000",

      starCount: 1800,
      starOpacity: 0.5,
      starFieldRadius: 65,

      bloomStrength: 0.55,
      bloomRadius: 0.4,
      bloomThreshold: 0.18,

      dpr: 1.5
    };

    const RESPONSIVE_REFERENCE_ASPECT = 16 / 9;
    const RESPONSIVE_DISTANCE_STRENGTH = 0.72;
    const MAX_RESPONSIVE_DISTANCE_SCALE = 2.4;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(params.background);

    const camera = new THREE.PerspectiveCamera(
      params.cameraFov,
      window.innerWidth / window.innerHeight,
      0.1,
      150
    );

    const cameraTarget = new THREE.Vector3(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: "high-performance"
    });

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(1, 1),
      params.bloomStrength,
      params.bloomRadius,
      params.bloomThreshold
    );

    composer.addPass(bloomPass);

    const sharedFlowGLSL = `
      const float TAU = 6.28318530718;

      float easeInOut(float value) {
        return value * value * (3.0 - 2.0 * value);
      }

      vec3 getFlowPosition(
        float phase,
        float lane,
        float seed,
        float region,
        vec2 randomOffset,
        float time,
        float twist,
        float neckRadius,
        float upperWidth,
        float lowerWidth,
        float height
      ) {
        float progress = phase;
        float y = 0.0;
        float radius = 0.0;
        float angle = 0.0;

        if (region < 1.5) {
          y = mix(
            -0.48 * height,
            0.48 * height,
            progress
          );

          float centerDistance =
            abs(progress - 0.5) * 2.0;

          float bodyShape =
            pow(centerDistance, 1.7);

          float asymmetry =
            mix(0.86, 1.18, progress);

          radius =
            neckRadius +
            bodyShape *
            mix(
              1.45,
              upperWidth,
              lane
            ) *
            asymmetry;

          angle =
            TAU *
            (
              seed +
              progress * twist +
              0.04 *
              sin(
                progress * 12.0 +
                seed * 17.0
              )
            );

          radius *=
            0.97 +
            0.05 *
            sin(
              seed * 43.0 +
              progress * 15.0
            );
        } else {
          y =
            0.5 * height -
            0.65 *
            pow(
              1.0 - progress,
              1.65
            );

          radius = mix(
            neckRadius * 1.8,
            upperWidth,
            easeInOut(progress)
          );

          radius *= mix(
            0.4,
            1.0,
            lane
          );

          angle =
            TAU *
            (
              seed +
              progress * twist +
              0.025 *
              sin(
                progress * 10.0 +
                seed * 17.0
              )
            );
        }

        float wave =
          0.045 *
          sin(
            seed * 37.0 +
            time * 2.0 +
            y * 1.6
          );

        float x =
          cos(angle) * radius +
          wave * randomOffset.x;

        float z =
          sin(angle) *
          radius *
          0.72 +
          wave * randomOffset.y;

        if (region < 1.5) {
          float shear =
            smoothstep(
              0.15,
              0.95,
              y / height + 0.5
            );

          x +=
            (shear - 0.5) *
            0.22;

          z +=
            sin(
              y * 0.9 +
              seed * 5.0
            ) *
            0.045;
        }

        return vec3(x, y, z);
      }
    `;

    const particleVertexShader = `
      uniform float uTime;
      uniform float uPointSize;
      uniform float uFlowSpeed;
      uniform float uTwist;
      uniform float uNeckRadius;
      uniform float uUpperWidth;
      uniform float uLowerWidth;
      uniform float uHeight;

      attribute vec4 aData;
      attribute vec3 aRandom;

      varying float vAlpha;
      varying float vGlow;

      ${sharedFlowGLSL}

      void main() {
        float lane = aData.x;
        float seed = aData.y;
        float region = aData.z;
        float offset = aData.w;

        float flowTime =
          uTime * uFlowSpeed;

        float phase =
          fract(offset + flowTime);

        vec3 flowPosition =
          getFlowPosition(
            phase,
            lane,
            seed,
            region,
            aRandom.xy,
            flowTime,
            uTwist,
            uNeckRadius,
            uUpperWidth,
            uLowerWidth,
            uHeight
          );

        vec4 viewPosition =
          modelViewMatrix *
          vec4(flowPosition, 1.0);

        gl_Position =
          projectionMatrix *
          viewPosition;

        float depthScale =
          1.0 /
          max(
            1.0,
            -viewPosition.z * 0.18
          );

        gl_PointSize = max(
          1.0,
          uPointSize *
          depthScale *
          (
            0.72 +
            0.72 * aRandom.z
          )
        );

        float phaseFade =
          smoothstep(
            0.0,
            0.06,
            phase
          ) *
          (
            1.0 -
            smoothstep(
              0.92,
              1.0,
              phase
            )
          );

        vAlpha =
          phaseFade *
          (
            0.22 +
            0.78 * aRandom.z
          );

        if (region < 1.5) {
          float radialDistance =
            length(flowPosition.xz);

          vGlow =
            1.0 -
            smoothstep(
              uNeckRadius,
              uNeckRadius + 0.9,
              radialDistance
            );
        } else {
          vGlow =
            0.35 *
            (1.0 - lane);
        }
      }
    `;

    const particleFragmentShader = `
      uniform vec3 uColor;
      uniform float uBrightness;
      uniform float uCoreBrightness;

      varying float vAlpha;
      varying float vGlow;

      void main() {
        vec2 point =
          gl_PointCoord - 0.5;

        float radialDistance =
          length(point);

        float softMask =
          1.0 -
          smoothstep(
            0.0,
            0.5,
            radialDistance
          );

        float coreMask =
          1.0 -
          smoothstep(
            0.0,
            0.13,
            radialDistance
          );

        float intensity =
          softMask * uBrightness +
          coreMask *
          uCoreBrightness *
          (
            0.45 +
            vGlow
          );

        float alpha =
          vAlpha * softMask;

        if (alpha < 0.01) {
          discard;
        }

        gl_FragColor = vec4(
          uColor * intensity,
          alpha
        );
      }
    `;

    const starVertexShader = `
      uniform float uPointSize;

      attribute float aStarScale;

      varying float vStarAlpha;

      void main() {
        vec4 viewPosition =
          modelViewMatrix *
          vec4(position, 1.0);

        gl_Position =
          projectionMatrix *
          viewPosition;

        gl_PointSize = max(
          1.0,
          uPointSize *
          (
            0.72 +
            aStarScale * 0.34
          )
        );

        vStarAlpha =
          0.62 +
          aStarScale * 0.38;
      }
    `;

    const starFragmentShader = `
      uniform vec3 uColor;
      uniform float uOpacity;

      varying float vStarAlpha;

      void main() {
        vec2 point =
          gl_PointCoord - 0.5;

        float radialDistance =
          length(point);

        float mask =
          1.0 -
          smoothstep(
            0.08,
            0.5,
            radialDistance
          );

        float alpha =
          mask *
          uOpacity *
          vStarAlpha;

        if (alpha < 0.005) {
          discard;
        }

        gl_FragColor = vec4(
          uColor,
          alpha
        );
      }
    `;

    const lineVertexShader = `
      uniform float uTime;
      uniform float uFlowSpeed;
      uniform float uTwist;
      uniform float uNeckRadius;
      uniform float uUpperWidth;
      uniform float uLowerWidth;
      uniform float uHeight;
      uniform float uLineFade;

      attribute vec4 aLineData;
      attribute vec3 aLineRandom;

      varying float vLineAlpha;

      ${sharedFlowGLSL}

      void main() {
        float localProgress =
          aLineData.x;

        float lane =
          aLineData.y;

        float seed =
          aLineData.z;

        float region =
          aLineData.w;

        float flowTime =
          uTime * uFlowSpeed;

        float phase =
          fract(
            localProgress +
            flowTime
          );

        vec3 flowPosition =
          getFlowPosition(
            phase,
            lane,
            seed,
            region,
            aLineRandom.xy,
            flowTime,
            uTwist,
            uNeckRadius,
            uUpperWidth,
            uLowerWidth,
            uHeight
          );

        gl_Position =
          projectionMatrix *
          modelViewMatrix *
          vec4(flowPosition, 1.0);

        float startFade =
          smoothstep(
            0.0,
            uLineFade,
            localProgress
          );

        float endFade =
          1.0 -
          smoothstep(
            1.0 - uLineFade,
            1.0,
            localProgress
          );

        float laneFade =
          1.0 -
          smoothstep(
            0.72,
            1.0,
            lane
          ) *
          0.35;

        vLineAlpha =
          startFade *
          endFade *
          laneFade;
      }
    `;

    const lineFragmentShader = `
      uniform vec3 uLineColor;
      uniform float uLineOpacity;

      varying float vLineAlpha;

      void main() {
        float alpha =
          vLineAlpha *
          uLineOpacity;

        if (alpha < 0.002) {
          discard;
        }

        gl_FragColor = vec4(
          uLineColor,
          alpha
        );
      }
    `;

    let particlePoints = null;
    let particleGeometry = null;
    let particleMaterial = null;

    let starPoints = null;
    let starGeometry = null;
    let starMaterial = null;

    let flowLines = null;
    let lineGeometry = null;
    let lineMaterial = null;

    function getResponsiveCameraDistance(width, height) {
      const safeHeight =
        Math.max(height, 1);

      const aspect =
        width / safeHeight;

      if (aspect >= RESPONSIVE_REFERENCE_ASPECT) {
        return params.cameraZ;
      }

      const narrowness =
        RESPONSIVE_REFERENCE_ASPECT /
        Math.max(aspect, 0.25);

      const distanceScale =
        1 +
        (narrowness - 1) *
        RESPONSIVE_DISTANCE_STRENGTH;

      return (
        params.cameraZ *
        Math.min(
          distanceScale,
          MAX_RESPONSIVE_DISTANCE_SCALE
        )
      );
    }

    function updateCamera(width = window.innerWidth, height = window.innerHeight) {
      const safeWidth =
        Math.max(width, 1);

      const safeHeight =
        Math.max(height, 1);

      const responsiveDistance =
        getResponsiveCameraDistance(
          safeWidth,
          safeHeight
        );

      const directionLength =
        Math.hypot(
          params.cameraY,
          params.cameraZ
        );

      const normalizedY =
        directionLength > 0
          ? params.cameraY / directionLength
          : 0;

      const normalizedZ =
        directionLength > 0
          ? params.cameraZ / directionLength
          : 1;

      const baseLength =
        Math.hypot(
          params.cameraY,
          responsiveDistance
        );

      camera.fov =
        params.cameraFov;

      camera.aspect =
        safeWidth / safeHeight;

      camera.position.set(
        0,
        normalizedY * baseLength,
        normalizedZ * baseLength
      );

      camera.lookAt(cameraTarget);
      camera.updateProjectionMatrix();
    }

    function resizeRenderer() {
      const width =
        Math.max(
          document.documentElement.clientWidth,
          window.innerWidth,
          1
        );

      const height =
        Math.max(
          document.documentElement.clientHeight,
          window.innerHeight,
          1
        );

      const pixelRatio =
        Math.min(
          Number(params.dpr),
          2
        );

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(
        width,
        height,
        false
      );

      composer.setPixelRatio(pixelRatio);
      composer.setSize(
        width,
        height
      );

      bloomPass.setSize(
        width * pixelRatio,
        height * pixelRatio
      );

      updateCamera(
        width,
        height
      );

      updateFlowUniforms();
    }

    function createParticleUniforms() {
      return {
        uTime: {
          value: 0
        },
        uPointSize: {
          value:
            params.particleSize *
            params.dpr
        },
        uFlowSpeed: {
          value: params.flowSpeed
        },
        uTwist: {
          value: params.twist
        },
        uNeckRadius: {
          value: params.neckRadius
        },
        uUpperWidth: {
          value: params.upperWidth
        },
        uLowerWidth: {
          value: params.lowerWidth
        },
        uHeight: {
          value: params.height
        },
        uColor: {
          value:
            new THREE.Color(
              params.particleColor
            )
        },
        uBrightness: {
          value: params.brightness
        },
        uCoreBrightness: {
          value:
            params.coreBrightness
        }
      };
    }

    function createStarUniforms() {
      return {
        uPointSize: {
          value:
            params.particleSize *
            params.dpr
        },
        uColor: {
          value:
            new THREE.Color(
              params.particleColor
            )
        },
        uOpacity: {
          value:
            params.starOpacity
        }
      };
    }

    function createLineUniforms() {
      return {
        uTime: {
          value: 0
        },
        uFlowSpeed: {
          value: params.flowSpeed
        },
        uTwist: {
          value: params.twist
        },
        uNeckRadius: {
          value: params.neckRadius
        },
        uUpperWidth: {
          value: params.upperWidth
        },
        uLowerWidth: {
          value: params.lowerWidth
        },
        uHeight: {
          value: params.height
        },
        uLineColor: {
          value:
            new THREE.Color(
              params.lineColor
            )
        },
        uLineOpacity: {
          value: params.lineOpacity
        },
        uLineFade: {
          value: params.lineFade
        }
      };
    }

    function rebuildStars() {
      if (starPoints) {
        scene.remove(starPoints);
        starGeometry.dispose();
        starMaterial.dispose();
      }

      const count =
        Math.floor(
          params.starCount
        );

      const positions =
        new Float32Array(
          count * 3
        );

      const starScales =
        new Float32Array(count);

      for (
        let index = 0;
        index < count;
        index++
      ) {
        const index3 =
          index * 3;

        const radius =
          params.starFieldRadius *
          (
            0.72 +
            Math.random() * 0.28
          );

        const theta =
          Math.random() *
          Math.PI *
          2;

        const phi =
          Math.acos(
            2 * Math.random() - 1
          );

        positions[index3] =
          radius *
          Math.sin(phi) *
          Math.cos(theta);

        positions[index3 + 1] =
          radius *
          Math.cos(phi) *
          0.65;

        positions[index3 + 2] =
          radius *
          Math.sin(phi) *
          Math.sin(theta) -
          15;

        starScales[index] =
          Math.random();
      }

      starGeometry =
        new THREE.BufferGeometry();

      starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      starGeometry.setAttribute(
        "aStarScale",
        new THREE.BufferAttribute(
          starScales,
          1
        )
      );

      starGeometry.boundingSphere =
        new THREE.Sphere(
          new THREE.Vector3(
            0,
            0,
            -15
          ),
          params.starFieldRadius * 1.1
        );

      starMaterial =
        new THREE.ShaderMaterial({
          uniforms:
            createStarUniforms(),
          vertexShader:
            starVertexShader,
          fragmentShader:
            starFragmentShader,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending:
            THREE.AdditiveBlending
        });

      starPoints =
        new THREE.Points(
          starGeometry,
          starMaterial
        );

      starPoints.frustumCulled =
        false;

      starPoints.renderOrder = -1;

      scene.add(starPoints);
    }

    function rebuildParticles() {
      if (particlePoints) {
        scene.remove(particlePoints);
        particleGeometry.dispose();
        particleMaterial.dispose();
      }

      const count =
        Math.floor(
          params.particleCount
        );

      const positions =
        new Float32Array(
          count * 3
        );

      const data =
        new Float32Array(
          count * 4
        );

      const random =
        new Float32Array(
          count * 3
        );

      for (
        let index = 0;
        index < count;
        index++
      ) {
        const index3 =
          index * 3;

        const index4 =
          index * 4;

        const region =
          Math.random() < 0.72
            ? 1
            : 2;

        const lane =
          Math.pow(
            Math.random(),
            region === 1
              ? 0.78
              : 0.58
          );

        data[index4] =
          lane;

        data[index4 + 1] =
          Math.random();

        data[index4 + 2] =
          region;

        data[index4 + 3] =
          Math.random();

        random[index3] =
          Math.random() * 2 - 1;

        random[index3 + 1] =
          Math.random() * 2 - 1;

        random[index3 + 2] =
          Math.random();
      }

      particleGeometry =
        new THREE.BufferGeometry();

      particleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      particleGeometry.setAttribute(
        "aData",
        new THREE.BufferAttribute(
          data,
          4
        )
      );

      particleGeometry.setAttribute(
        "aRandom",
        new THREE.BufferAttribute(
          random,
          3
        )
      );

      particleGeometry.boundingSphere =
        new THREE.Sphere(
          new THREE.Vector3(),
          20
        );

      particleMaterial =
        new THREE.ShaderMaterial({
          uniforms:
            createParticleUniforms(),
          vertexShader:
            particleVertexShader,
          fragmentShader:
            particleFragmentShader,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending:
            THREE.AdditiveBlending
        });

      particlePoints =
        new THREE.Points(
          particleGeometry,
          particleMaterial
        );

      particlePoints.frustumCulled =
        false;

      particlePoints.renderOrder = 1;

      scene.add(particlePoints);
    }

    function rebuildLines() {
      if (flowLines) {
        scene.remove(flowLines);
        lineGeometry.dispose();
        lineMaterial.dispose();
      }

      const lineCount =
        Math.floor(
          params.lineCount
        );

      const activeRegions = [
        1,
        2
      ];

      const samplesPerLine = 260;
      const segmentCount =
        samplesPerLine - 1;

      const vertexCount =
        lineCount *
        activeRegions.length *
        segmentCount *
        2;

      const positions =
        new Float32Array(
          vertexCount * 3
        );

      const lineData =
        new Float32Array(
          vertexCount * 4
        );

      const lineRandom =
        new Float32Array(
          vertexCount * 3
        );

      let vertexIndex = 0;

      function writeVertex(
        progress,
        lane,
        seed,
        region,
        randomX,
        randomY
      ) {
        const index3 =
          vertexIndex * 3;

        const index4 =
          vertexIndex * 4;

        lineData[index4] =
          progress;

        lineData[index4 + 1] =
          lane;

        lineData[index4 + 2] =
          seed;

        lineData[index4 + 3] =
          region;

        lineRandom[index3] =
          randomX;

        lineRandom[index3 + 1] =
          randomY;

        vertexIndex++;
      }

      for (
        let regionIndex = 0;
        regionIndex <
        activeRegions.length;
        regionIndex++
      ) {
        const region =
          activeRegions[regionIndex];

        for (
          let lineIndex = 0;
          lineIndex < lineCount;
          lineIndex++
        ) {
          const lineRatio =
            lineCount > 1
              ? lineIndex /
                (lineCount - 1)
              : 0.5;

          const lane =
            0.08 +
            Math.pow(
              lineRatio,
              region === 1
                ? 0.82
                : 0.64
            ) *
            0.82;

          const seed =
            lineIndex /
            Math.max(
              lineCount,
              1
            ) +
            regionIndex * 0.173;

          const randomX =
            Math.sin(
              seed * 91.7
            ) *
            0.7;

          const randomY =
            Math.cos(
              seed * 73.3
            ) *
            0.7;

          for (
            let sample = 0;
            sample < segmentCount;
            sample++
          ) {
            const progressA =
              sample /
              segmentCount;

            const progressB =
              (sample + 1) /
              segmentCount;

            writeVertex(
              progressA,
              lane,
              seed,
              region,
              randomX,
              randomY
            );

            writeVertex(
              progressB,
              lane,
              seed,
              region,
              randomX,
              randomY
            );
          }
        }
      }

      lineGeometry =
        new THREE.BufferGeometry();

      lineGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );

      lineGeometry.setAttribute(
        "aLineData",
        new THREE.BufferAttribute(
          lineData,
          4
        )
      );

      lineGeometry.setAttribute(
        "aLineRandom",
        new THREE.BufferAttribute(
          lineRandom,
          3
        )
      );

      lineGeometry.boundingSphere =
        new THREE.Sphere(
          new THREE.Vector3(),
          20
        );

      lineMaterial =
        new THREE.ShaderMaterial({
          uniforms:
            createLineUniforms(),
          vertexShader:
            lineVertexShader,
          fragmentShader:
            lineFragmentShader,
          transparent: true,
          depthWrite: false,
          depthTest: true,
          blending:
            THREE.AdditiveBlending
        });

      flowLines =
        new THREE.LineSegments(
          lineGeometry,
          lineMaterial
        );

      flowLines.frustumCulled =
        false;

      flowLines.renderOrder = 0;

      scene.add(flowLines);
    }

    function updateFlowUniforms() {
      const pixelRatio =
        Math.min(
          Number(params.dpr),
          2
        );

      if (particleMaterial) {
        const uniforms =
          particleMaterial.uniforms;

        uniforms.uPointSize.value =
          params.particleSize *
          pixelRatio;

        uniforms.uFlowSpeed.value =
          params.flowSpeed;

        uniforms.uTwist.value =
          params.twist;

        uniforms.uNeckRadius.value =
          params.neckRadius;

        uniforms.uUpperWidth.value =
          params.upperWidth;

        uniforms.uLowerWidth.value =
          params.lowerWidth;

        uniforms.uHeight.value =
          params.height;

        uniforms.uBrightness.value =
          params.brightness;

        uniforms.uCoreBrightness.value =
          params.coreBrightness;

        uniforms.uColor.value.set(
          params.particleColor
        );
      }

      if (starMaterial) {
        const uniforms =
          starMaterial.uniforms;

        uniforms.uPointSize.value =
          params.particleSize *
          pixelRatio;

        uniforms.uColor.value.set(
          params.particleColor
        );

        uniforms.uOpacity.value =
          params.starOpacity;
      }

      if (lineMaterial) {
        const uniforms =
          lineMaterial.uniforms;

        uniforms.uFlowSpeed.value =
          params.flowSpeed;

        uniforms.uTwist.value =
          params.twist;

        uniforms.uNeckRadius.value =
          params.neckRadius;

        uniforms.uUpperWidth.value =
          params.upperWidth;

        uniforms.uLowerWidth.value =
          params.lowerWidth;

        uniforms.uHeight.value =
          params.height;

        uniforms.uLineOpacity.value =
          params.lineOpacity;

        uniforms.uLineFade.value =
          params.lineFade;

        uniforms.uLineColor.value.set(
          params.lineColor
        );
      }
    }

    function updatePostProcessing() {
      bloomPass.strength =
        params.bloomStrength;

      bloomPass.radius =
        params.bloomRadius;

      bloomPass.threshold =
        params.bloomThreshold;
    }

    rebuildStars();
    rebuildParticles();
    rebuildLines();
    updatePostProcessing();
    resizeRenderer();

    const gui = new GUI({
      title: "Settings"
    });

    const cameraFolder =
      gui.addFolder("Camera");

    cameraFolder
      .add(
        params,
        "cameraFov",
        30,
        75,
        1
      )
      .name("FOV")
      .onChange(() => {
        updateCamera();
      });

    cameraFolder
      .add(
        params,
        "cameraZ",
        4,
        12,
        0.1
      )
      .name("Distance")
      .onChange(() => {
        updateCamera();
      });

    cameraFolder
      .add(
        params,
        "cameraY",
        -6,
        6,
        0.01
      )
      .name("Vertical")
      .onChange(() => {
        updateCamera();
      });

    const animationFolder =
      gui.addFolder("Animation");

    animationFolder
      .add(
        params,
        "flowSpeed",
        0,
        0.12,
        0.001
      )
      .name("Flow Speed")
      .onChange(updateFlowUniforms);

    animationFolder
      .add(
        params,
        "twist",
        0,
        8,
        0.01
      )
      .name("Twist")
      .onChange(updateFlowUniforms);

    const geometryFolder =
      gui.addFolder("Geometry");

    geometryFolder
      .add(
        params,
        "particleCount",
        30000,
        220000,
        1000
      )
      .name("Particle Count")
      .onFinishChange(rebuildParticles);

    geometryFolder
      .add(
        params,
        "particleSize",
        0.4,
        3,
        0.01
      )
      .name("Particle Size")
      .onChange(updateFlowUniforms);

    geometryFolder
      .add(
        params,
        "neckRadius",
        0.15,
        1,
        0.01
      )
      .name("Neck Radius")
      .onChange(updateFlowUniforms);

    geometryFolder
      .add(
        params,
        "upperWidth",
        1,
        7,
        0.01
      )
      .name("Upper Width")
      .onChange(updateFlowUniforms);

    geometryFolder
      .add(
        params,
        "lowerWidth",
        1,
        7,
        0.01
      )
      .name("Lower Width")
      .onChange(updateFlowUniforms);

    geometryFolder
      .add(
        params,
        "height",
        2,
        8,
        0.01
      )
      .name("Height")
      .onChange(updateFlowUniforms);

    geometryFolder
      .add(
        params,
        "lineCount",
        0,
        32,
        1
      )
      .name("Line Count")
      .onFinishChange(rebuildLines);

    const materialFolder =
      gui.addFolder("Material");

    materialFolder
      .add(
        params,
        "brightness",
        0.1,
        4,
        0.01
      )
      .name("Brightness")
      .onChange(updateFlowUniforms);

    materialFolder
      .add(
        params,
        "coreBrightness",
        0,
        5,
        0.01
      )
      .name("Core Brightness")
      .onChange(updateFlowUniforms);

    materialFolder
      .add(
        params,
        "lineOpacity",
        0,
        1,
        0.01
      )
      .name("Line Opacity")
      .onChange(updateFlowUniforms);

    materialFolder
      .add(
        params,
        "lineFade",
        0.03,
        0.45,
        0.01
      )
      .name("Line End Fade")
      .onChange(updateFlowUniforms);

    const colorsFolder =
      gui.addFolder("Colors");

    colorsFolder
      .addColor(
        params,
        "particleColor"
      )
      .name("Particles")
      .onChange(updateFlowUniforms);

    colorsFolder
      .addColor(
        params,
        "lineColor"
      )
      .name("Lines")
      .onChange(updateFlowUniforms);

    colorsFolder
      .addColor(
        params,
        "background"
      )
      .name("Background")
      .onChange((value) => {
        scene.background.set(value);
      });

    const postFolder =
      gui.addFolder("Post Processing");

    postFolder
      .add(
        params,
        "bloomStrength",
        0,
        2,
        0.01
      )
      .name("Bloom Strength")
      .onChange(updatePostProcessing);

    postFolder
      .add(
        params,
        "bloomRadius",
        0,
        1,
        0.01
      )
      .name("Bloom Radius")
      .onChange(updatePostProcessing);

    postFolder
      .add(
        params,
        "bloomThreshold",
        0,
        1,
        0.01
      )
      .name("Bloom Threshold")
      .onChange(updatePostProcessing);

    const performanceFolder =
      gui.addFolder("Performance");

    performanceFolder
      .add(
        params,
        "dpr",
        [
          0.5,
          0.75,
          1,
          1.25,
          1.5,
          2
        ]
      )
      .name("DPR")
      .onChange(resizeRenderer);

    gui.close();

    const clock =
      new THREE.Clock();

    let elapsed = 0;
    let resizeFrame = 0;

    function handleResize() {
      cancelAnimationFrame(
        resizeFrame
      );

      resizeFrame =
        requestAnimationFrame(
          resizeRenderer
        );
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );

      elapsed += delta;

      if (particleMaterial) {
        particleMaterial.uniforms
          .uTime.value = elapsed;
      }

      if (lineMaterial) {
        lineMaterial.uniforms
          .uTime.value = elapsed;
      }

      if (starPoints) {
        starPoints.rotation.y =
          elapsed * 0.002;

        starPoints.rotation.x =
          Math.sin(
            elapsed * 0.025
          ) *
          0.008;
      }

      composer.render();
    }

    window.addEventListener(
      "resize",
      handleResize,
      {
        passive: true
      }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        handleResize,
        {
          passive: true
        }
      );
    }

    animate();
  </script>
</body>
</html>
