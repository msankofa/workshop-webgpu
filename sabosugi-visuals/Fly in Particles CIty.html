<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fly in Particles CIty
</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lil-gui.root {
      --background-color: rgba(8, 8, 14, 0.88);
      --widget-color: rgba(38, 38, 54, 0.95);
      --hover-color: rgba(54, 54, 76, 0.95);
      --focus-color: rgba(74, 74, 102, 0.95);
      --text-color: #eeeeff;
      --number-color: #8fdcff;
      --string-color: #ff8eea;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GUI } from "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { AfterimagePass } from "three/addons/postprocessing/AfterimagePass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    // -------------------- Main parameters --------------------

    const PARAMS = {
      Camera: {
        FOV: 72,
        Sway: 1.2,
        Vertical: 1.16,
        Roll: 0
      },

      Animation: {
        Speed: 4.9,
        Pulse: 0.3
      },

      Geometry: {
        Density: "Medium",
        CorridorWidth: 19.5,
        CurveAmount: 5.45,
        CityHeight: 1.8
      },

      Material: {
        PointSize: 0.86,
        PointOpacity: 1.0,
        EdgeOpacity: 0.22
      },

      Colors: {
        Primary: "#766dff",
        Cyan: "#38c9ff",
        Magenta: "#ff48d7",
        Red: "#ff4b5e"
      },

      PostProcessing: {
        BloomStrength: 0.31,
        BloomRadius: 0.82,
        BloomThreshold: 0.045,
        TrailPersistence: 0.565,
        ChromaticShift: 0.0036,
        Grain: 0.035,
        Vignette: 0.58
      },

      Performance: {
        DPR: 1
      }
    };

    const DENSITY_SCALE = {
      Low: 0.52,
      Medium: 0.76,
      High: 1.0
    };

    const WORLD_LENGTH = 430.0;
    const WORLD_HALF = WORLD_LENGTH * 0.5;
    const TAU = Math.PI * 2.0;

    const SIDEWALK_CENTER_OFFSET = 1.7;
    const SIDEWALK_WIDTH = 2.8;
    const BUILDING_GAP = 2.1;

    // -------------------- Renderer and scene --------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      PARAMS.Camera.FOV,
      window.innerWidth / window.innerHeight,
      0.08,
      360.0
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(PARAMS.Performance.DPR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    document.body.appendChild(renderer.domElement);

    // -------------------- Post processing --------------------

    const renderPass = new RenderPass(scene, camera);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
      ),
      PARAMS.PostProcessing.BloomStrength,
      PARAMS.PostProcessing.BloomRadius,
      PARAMS.PostProcessing.BloomThreshold
    );

    const afterimagePass = new AfterimagePass();
    afterimagePass.uniforms.damp.value =
      PARAMS.PostProcessing.TrailPersistence;

    const finalPass = new ShaderPass({
      uniforms: {
        tDiffuse: {
          value: null
        },

        uTime: {
          value: 0
        },

        uFrame: {
          value: 0
        },

        uResolution: {
          value: new THREE.Vector2(1, 1)
        },

        uPixelRatio: {
          value: PARAMS.Performance.DPR
        },

        uChromaticShift: {
          value: PARAMS.PostProcessing.ChromaticShift
        },

        uGrain: {
          value: PARAMS.PostProcessing.Grain
        },

        uVignette: {
          value: PARAMS.PostProcessing.Vignette
        }
      },

      vertexShader: /* glsl */ `
        varying vec2 vUv;

        void main() {
          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);
        }
      `,

      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;

        uniform float uTime;
        uniform float uFrame;
        uniform vec2 uResolution;
        uniform float uPixelRatio;
        uniform float uChromaticShift;
        uniform float uGrain;
        uniform float uVignette;

        varying vec2 vUv;

        float pixelHash(vec2 position) {
          vec3 value =
            fract(
              vec3(
                position.x,
                position.y,
                position.x
              ) *
              vec3(
                0.1031,
                0.1030,
                0.0973
              )
            );

          value +=
            dot(
              value,
              value.yzx +
              33.33
            );

          return fract(
            (
              value.x +
              value.y
            ) *
            value.z
          );
        }

        void main() {
          vec2 centered =
            vUv -
            0.5;

          float radial =
            dot(
              centered,
              centered
            );

          vec2 direction =
            normalize(
              centered +
              vec2(0.00001)
            );

          float shift =
            uChromaticShift *
            (
              0.42 +
              radial *
              2.6
            );

          float redChannel =
            texture2D(
              tDiffuse,
              vUv +
              direction *
              shift
            ).r;

          float greenChannel =
            texture2D(
              tDiffuse,
              vUv
            ).g;

          float blueChannel =
            texture2D(
              tDiffuse,
              vUv -
              direction *
              shift
            ).b;

          vec3 color =
            vec3(
              redChannel,
              greenChannel,
              blueChannel
            );

          float effectivePixelRatio =
            max(
              uPixelRatio,
              1.0
            );

          vec2 safeResolution =
            max(
              uResolution,
              vec2(1.0)
            );

          vec2 cssResolution =
            max(
              floor(
                safeResolution /
                effectivePixelRatio
              ),
              vec2(1.0)
            );

          vec2 normalizedFragment =
            clamp(
              gl_FragCoord.xy /
              safeResolution,
              vec2(0.0),
              vec2(1.0)
            );

          vec2 cssPixel =
            floor(
              normalizedFragment *
              cssResolution
            );

          float cssPixelY =
            gl_FragCoord.y /
            effectivePixelRatio;

          float scan =
            sin(
              (
                cssPixelY +
                uTime *
                42.0
              ) *
              3.14159265
            ) *
            0.5 +
            0.5;

          color *=
            0.985 +
            scan *
            0.015;

          vec2 temporalOffset =
            vec2(
              mod(
                uFrame *
                37.0,
                4096.0
              ),

              mod(
                uFrame *
                61.0,
                4096.0
              )
            );

          float grain =
            pixelHash(
              cssPixel +
              temporalOffset
            ) -
            0.5;

          float luminance =
            dot(
              color,
              vec3(
                0.2126,
                0.7152,
                0.0722
              )
            );

          float grainVisibility =
            0.3 +
            0.7 *
            clamp(
              luminance,
              0.0,
              1.0
            );

          color +=
            grain *
            uGrain *
            grainVisibility;

          float vignette =
            smoothstep(
              0.92,
              0.18,
              radial *
              (
                1.05 +
                uVignette
              )
            );

          color *=
            mix(
              1.0,
              vignette,
              uVignette
            );

          gl_FragColor =
            vec4(
              max(
                color,
                0.0
              ),
              1.0
            );
        }
      `
    });

    const outputPass = new OutputPass();

    const composer = new EffectComposer(renderer);

    composer.addPass(renderPass);
    composer.addPass(bloomPass);
    composer.addPass(afterimagePass);
    composer.addPass(finalPass);
    composer.addPass(outputPass);

    // -------------------- Static periodic path --------------------

    function getPathPhase(z) {
      return (
        z /
        WORLD_LENGTH
      ) * TAU;
    }

    function getPathX(z) {
      const phase =
        getPathPhase(z);

      return (
        Math.sin(
          phase *
          2.0
        ) *
        0.72 +
        Math.sin(
          phase *
          5.0 +
          1.8
        ) *
        0.22 +
        Math.sin(
          phase -
          0.7
        ) *
        0.35
      ) *
      PARAMS.Geometry.CurveAmount;
    }

    function getPathY(z) {
      const phase =
        getPathPhase(z);

      return (
        Math.sin(
          phase *
          2.0 +
          0.8
        ) *
        0.48
      );
    }

    // -------------------- Shared uniforms --------------------

    const sharedUniforms = {
      uTime: {
        value: 0
      },

      uCameraWorldZ: {
        value: 0
      },

      uWorldLength: {
        value: WORLD_LENGTH
      },

      uCurveAmount: {
        value: PARAMS.Geometry.CurveAmount
      },

      uCityHeight: {
        value: PARAMS.Geometry.CityHeight
      },

      uPointSize: {
        value: PARAMS.Material.PointSize
      },

      uPointOpacity: {
        value: PARAMS.Material.PointOpacity
      },

      uDpr: {
        value: PARAMS.Performance.DPR
      },

      uPulse: {
        value: PARAMS.Animation.Pulse
      },

      uPrimary: {
        value: new THREE.Color(
          PARAMS.Colors.Primary
        )
      },

      uCyan: {
        value: new THREE.Color(
          PARAMS.Colors.Cyan
        )
      },

      uMagenta: {
        value: new THREE.Color(
          PARAMS.Colors.Magenta
        )
      },

      uRed: {
        value: new THREE.Color(
          PARAMS.Colors.Red
        )
      }
    };

    // -------------------- Point material --------------------

    const pointMaterial = new THREE.ShaderMaterial({
      uniforms: sharedUniforms,

      vertexShader: /* glsl */ `
        uniform float uTime;
        uniform float uCameraWorldZ;
        uniform float uWorldLength;
        uniform float uCurveAmount;
        uniform float uCityHeight;
        uniform float uPointSize;
        uniform float uDpr;
        uniform float uPulse;

        attribute float aSeed;
        attribute float aSize;
        attribute float aBrightness;
        attribute float aPalette;

        varying float vSeed;
        varying float vBrightness;
        varying float vPalette;
        varying float vDepthFade;

        const float TAU =
          6.28318530718;

        float wrapRelativeZ(float z) {
          float halfLength =
            uWorldLength *
            0.5;

          return
            mod(
              z +
              halfLength,
              uWorldLength
            ) -
            halfLength;
        }

        float pathPhase(float z) {
          return
            z /
            uWorldLength *
            TAU;
        }

        float pathX(float z) {
          float phase =
            pathPhase(z);

          return (
            sin(
              phase *
              2.0
            ) *
            0.72 +
            sin(
              phase *
              5.0 +
              1.8
            ) *
            0.22 +
            sin(
              phase -
              0.7
            ) *
            0.35
          ) *
          uCurveAmount;
        }

        float pathY(float z) {
          float phase =
            pathPhase(z);

          return
            sin(
              phase *
              2.0 +
              0.8
            ) *
            0.48;
        }

        void main() {
          float relativeZ =
            position.z -
            uCameraWorldZ;

          float wrappedZ =
            wrapRelativeZ(
              relativeZ
            );

          float cameraPathX =
            pathX(
              uCameraWorldZ
            );

          float cameraPathY =
            pathY(
              uCameraWorldZ
            );

          float pointPathX =
            pathX(
              position.z
            );

          float pointPathY =
            pathY(
              position.z
            );

          vec3 transformed =
            vec3(
              position.x +
              pointPathX -
              cameraPathX,

              position.y *
              uCityHeight +
              pointPathY -
              cameraPathY,

              wrappedZ
            );

          vec4 mvPosition =
            modelViewMatrix *
            vec4(
              transformed,
              1.0
            );

          float distanceScale =
            105.0 /
            max(
              18.0,
              -mvPosition.z
            );

          float pulse =
            1.0 +
            sin(
              uTime *
              2.1 +
              aSeed *
              13.0
            ) *
            uPulse *
            0.12;

          gl_PointSize =
            clamp(
              uPointSize *
              aSize *
              uDpr *
              distanceScale *
              pulse,
              0.55,
              5.2 *
              uDpr
            );

          gl_Position =
            projectionMatrix *
            mvPosition;

          vSeed =
            aSeed;

          vBrightness =
            aBrightness;

          vPalette =
            aPalette;

          float farFade =
            smoothstep(
              -uWorldLength *
              0.5,
              -uWorldLength *
              0.5 +
              92.0,
              mvPosition.z
            );

          float nearFade =
            1.0 -
            smoothstep(
              -17.0,
              -3.0,
              mvPosition.z
            );

          vDepthFade =
            farFade *
            nearFade;
        }
      `,

      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uPointOpacity;

        uniform vec3 uPrimary;
        uniform vec3 uCyan;
        uniform vec3 uMagenta;
        uniform vec3 uRed;

        varying float vSeed;
        varying float vBrightness;
        varying float vPalette;
        varying float vDepthFade;

        void main() {
          vec2 pointPosition =
            abs(
              gl_PointCoord -
              0.5
            );

          float pointEdge =
            max(
              pointPosition.x,
              pointPosition.y
            );

          float pointShape =
            1.0 -
            smoothstep(
              0.36,
              0.5,
              pointEdge
            );

          vec3 colorA =
            mix(
              uPrimary,
              uCyan,
              smoothstep(
                0.0,
                0.45,
                vPalette
              )
            );

          vec3 colorB =
            mix(
              uMagenta,
              uRed,
              smoothstep(
                0.55,
                1.0,
                vPalette
              )
            );

          vec3 color =
            mix(
              colorA,
              colorB,
              smoothstep(
                0.38,
                0.72,
                vPalette
              )
            );

          float spectral =
            fract(
              vSeed *
              19.17
            );

          if (
            spectral <
            0.055
          ) {
            color =
              uRed;
          } else if (
            spectral <
            0.105
          ) {
            color =
              vec3(
                0.25,
                1.0,
                0.45
              );
          } else if (
            spectral <
            0.165
          ) {
            color =
              uCyan;
          }

          float brightnessPulse =
            0.9 +
            0.1 *
            sin(
              uTime *
              3.0 +
              vSeed *
              43.0
            );

          float alpha =
            pointShape *
            uPointOpacity *
            vBrightness *
            vDepthFade *
            brightnessPulse;

          gl_FragColor =
            vec4(
              color *
              (
                0.72 +
                vBrightness *
                0.75
              ),
              alpha
            );
        }
      `,

      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });

    // -------------------- Edge material --------------------

    const edgeMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uCameraWorldZ:
          sharedUniforms.uCameraWorldZ,

        uWorldLength:
          sharedUniforms.uWorldLength,

        uCurveAmount:
          sharedUniforms.uCurveAmount,

        uCityHeight:
          sharedUniforms.uCityHeight,

        uOpacity: {
          value:
            PARAMS.Material.EdgeOpacity
        },

        uPrimary:
          sharedUniforms.uPrimary,

        uCyan:
          sharedUniforms.uCyan
      },

      vertexShader: /* glsl */ `
        uniform float uCameraWorldZ;
        uniform float uWorldLength;
        uniform float uCurveAmount;
        uniform float uCityHeight;

        attribute float aLineSeed;
        attribute float aSegmentCenterZ;

        varying float vLineSeed;
        varying float vDepthFade;

        const float TAU =
          6.28318530718;

        float wrapRelativeZ(float z) {
          float halfLength =
            uWorldLength *
            0.5;

          return
            mod(
              z +
              halfLength,
              uWorldLength
            ) -
            halfLength;
        }

        float pathPhase(float z) {
          return
            z /
            uWorldLength *
            TAU;
        }

        float pathX(float z) {
          float phase =
            pathPhase(z);

          return (
            sin(
              phase *
              2.0
            ) *
            0.72 +
            sin(
              phase *
              5.0 +
              1.8
            ) *
            0.22 +
            sin(
              phase -
              0.7
            ) *
            0.35
          ) *
          uCurveAmount;
        }

        float pathY(float z) {
          float phase =
            pathPhase(z);

          return
            sin(
              phase *
              2.0 +
              0.8
            ) *
            0.48;
        }

        void main() {
          float relativeCenterZ =
            aSegmentCenterZ -
            uCameraWorldZ;

          float wrappedCenterZ =
            wrapRelativeZ(
              relativeCenterZ
            );

          float sharedWrapOffset =
            wrappedCenterZ -
            relativeCenterZ;

          float wrappedVertexZ =
            position.z -
            uCameraWorldZ +
            sharedWrapOffset;

          float cameraPathX =
            pathX(
              uCameraWorldZ
            );

          float cameraPathY =
            pathY(
              uCameraWorldZ
            );

          float pointPathX =
            pathX(
              position.z
            );

          float pointPathY =
            pathY(
              position.z
            );

          vec3 transformed =
            vec3(
              position.x +
              pointPathX -
              cameraPathX,

              position.y *
              uCityHeight +
              pointPathY -
              cameraPathY,

              wrappedVertexZ
            );

          vec4 mvPosition =
            modelViewMatrix *
            vec4(
              transformed,
              1.0
            );

          gl_Position =
            projectionMatrix *
            mvPosition;

          vLineSeed =
            aLineSeed;

          float farFade =
            smoothstep(
              -uWorldLength *
              0.5,
              -uWorldLength *
              0.5 +
              96.0,
              wrappedCenterZ
            );

          float nearFade =
            1.0 -
            smoothstep(
              -30.0,
              -14.0,
              wrappedCenterZ
            );

          float frontVisibility =
            1.0 -
            step(
              0.0,
              wrappedCenterZ
            );

          vDepthFade =
            farFade *
            nearFade *
            frontVisibility;
        }
      `,

      fragmentShader: /* glsl */ `
        uniform float uOpacity;

        uniform vec3 uPrimary;
        uniform vec3 uCyan;

        varying float vLineSeed;
        varying float vDepthFade;

        void main() {
          if (
            vDepthFade <=
            0.001
          ) {
            discard;
          }

          vec3 color =
            mix(
              uPrimary,
              uCyan,
              fract(
                vLineSeed *
                7.37
              )
            );

          gl_FragColor =
            vec4(
              color *
              1.15,
              uOpacity *
              vDepthFade
            );
        }
      `,

      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });

    // -------------------- Geometry generation --------------------

    let cityPoints = null;
    let cityEdges = null;

    function mulberry32(seed) {
      return function random() {
        let value =
          seed +=
          0x6D2B79F5;

        value =
          Math.imul(
            value ^
            value >>> 15,
            value | 1
          );

        value ^=
          value +
          Math.imul(
            value ^
            value >>> 7,
            value | 61
          );

        return (
          (
            value ^
            value >>> 14
          ) >>>
          0
        ) /
        4294967296;
      };
    }

    function addBoxEdges(
      target,
      centerX,
      baseY,
      centerZ,
      sizeX,
      sizeY,
      sizeZ,
      seed
    ) {
      const x0 =
        centerX -
        sizeX *
        0.5;

      const x1 =
        centerX +
        sizeX *
        0.5;

      const y0 =
        baseY;

      const y1 =
        baseY +
        sizeY;

      const z0 =
        centerZ -
        sizeZ *
        0.5;

      const z1 =
        centerZ +
        sizeZ *
        0.5;

      const corners = [
        [x0, y0, z0],
        [x1, y0, z0],
        [x1, y0, z1],
        [x0, y0, z1],

        [x0, y1, z0],
        [x1, y1, z0],
        [x1, y1, z1],
        [x0, y1, z1]
      ];

      const indices = [
        4, 5,
        5, 6,
        6, 7,
        7, 4,

        0, 4,
        1, 5,
        2, 6,
        3, 7
      ];

      for (
        let index = 0;
        index < indices.length;
        index += 2
      ) {
        const pointA =
          corners[
            indices[index]
          ];

        const pointB =
          corners[
            indices[
              index +
              1
            ]
          ];

        const segmentCenterZ =
          (
            pointA[2] +
            pointB[2]
          ) *
          0.5;

        target.positions.push(
          pointA[0],
          pointA[1],
          pointA[2],

          pointB[0],
          pointB[1],
          pointB[2]
        );

        target.seeds.push(
          seed,
          seed
        );

        target.centers.push(
          segmentCenterZ,
          segmentCenterZ
        );
      }
    }

    function sampleBoxSurface(
      random,
      target,
      centerX,
      baseY,
      centerZ,
      sizeX,
      sizeY,
      sizeZ,
      count,
      paletteBias
    ) {
      const topArea =
        sizeX *
        sizeZ;

      const sideXArea =
        sizeY *
        sizeZ *
        2.0;

      const sideZArea =
        sizeX *
        sizeY *
        2.0;

      const totalArea =
        topArea +
        sideXArea +
        sideZArea;

      for (
        let index = 0;
        index < count;
        index += 1
      ) {
        const face =
          random() *
          totalArea;

        let pointX;
        let pointY;
        let pointZ;

        let brightness =
          0.48 +
          random() *
          0.48;

        if (
          face <
          topArea
        ) {
          pointX =
            centerX +
            (
              random() -
              0.5
            ) *
            sizeX;

          pointY =
            baseY +
            sizeY;

          pointZ =
            centerZ +
            (
              random() -
              0.5
            ) *
            sizeZ;

          brightness *=
            1.08;
        } else if (
          face <
          topArea +
          sideXArea
        ) {
          pointX =
            centerX +
            (
              random() <
              0.5
                ? -0.5
                : 0.5
            ) *
            sizeX;

          pointY =
            baseY +
            random() *
            sizeY;

          pointZ =
            centerZ +
            (
              random() -
              0.5
            ) *
            sizeZ;
        } else {
          pointX =
            centerX +
            (
              random() -
              0.5
            ) *
            sizeX;

          pointY =
            baseY +
            random() *
            sizeY;

          pointZ =
            centerZ +
            (
              random() <
              0.5
                ? -0.5
                : 0.5
            ) *
            sizeZ;

          brightness *=
            1.12;
        }

        target.positions.push(
          pointX,
          pointY,
          pointZ
        );

        target.seeds.push(
          random()
        );

        target.sizes.push(
          0.72 +
          random() *
          0.92
        );

        target.brightness.push(
          brightness
        );

        target.palette.push(
          THREE.MathUtils.clamp(
            paletteBias +
            (
              random() -
              0.5
            ) *
            0.34,
            0,
            1
          )
        );
      }
    }

    function sampleDeck(
      random,
      target,
      centerX,
      y,
      width,
      zStart,
      zEnd,
      count,
      paletteBias
    ) {
      for (
        let index = 0;
        index < count;
        index += 1
      ) {
        const pointZ =
          THREE.MathUtils.lerp(
            zStart,
            zEnd,
            random()
          );

        const pointX =
          centerX +
          (
            random() -
            0.5
          ) *
          width;

        const ripple =
          Math.sin(
            pointZ *
            0.19 +
            pointX *
            0.41
          ) *
          0.08;

        target.positions.push(
          pointX,
          y +
          ripple,
          pointZ
        );

        target.seeds.push(
          random()
        );

        target.sizes.push(
          0.62 +
          random() *
          0.82
        );

        target.brightness.push(
          0.42 +
          random() *
          0.5
        );

        target.palette.push(
          THREE.MathUtils.clamp(
            paletteBias +
            (
              random() -
              0.5
            ) *
            0.28,
            0,
            1
          )
        );
      }
    }

    function createCityGeometry() {
      const random =
        mulberry32(4293815);

      const densityScale =
        DENSITY_SCALE[
          PARAMS.Geometry.Density
        ];

      const corridorHalf =
        PARAMS.Geometry.CorridorWidth *
        0.5;

      const sidewalkOuterDistance =
        corridorHalf +
        SIDEWALK_CENTER_OFFSET +
        SIDEWALK_WIDTH *
        0.5;

      const pointData = {
        positions: [],
        seeds: [],
        sizes: [],
        brightness: [],
        palette: []
      };

      const lineData = {
        positions: [],
        seeds: [],
        centers: []
      };

      const baseY =
        -4.1;

      const blockStep =
        5.2;

      const blockCount =
        Math.floor(
          WORLD_LENGTH /
          blockStep
        );

      for (
        let blockIndex = 0;
        blockIndex < blockCount;
        blockIndex += 1
      ) {
        const centerZ =
          -WORLD_HALF +
          blockIndex *
          blockStep +
          (
            random() -
            0.5
          ) *
          2.2;

        for (
          const side of [-1, 1]
        ) {
          const layers =
            random() <
            0.56
              ? 2
              : 3;

          for (
            let layer = 0;
            layer < layers;
            layer += 1
          ) {
            const sizeX =
              3.5 +
              random() *
              6.0;

            const sizeZ =
              3.2 +
              random() *
              6.5;

            const heightBias =
              layer === 0
                ? 0.68
                : 1.0;

            const sizeY =
              (
                4.2 +
                Math.pow(
                  random(),
                  0.62
                ) *
                19.0
              ) *
              heightBias;

            const facadeDistance =
              sidewalkOuterDistance +
              BUILDING_GAP +
              random() *
              1.8 +
              layer *
              7.3;

            const centerDistance =
              facadeDistance +
              sizeX *
              0.5;

            const centerX =
              side *
              centerDistance;

            const paletteBias =
              side <
              0
                ? 0.28 +
                  random() *
                  0.28
                : 0.46 +
                  random() *
                  0.34;

            const surfaceArea =
              sizeX *
              sizeZ +
              2.0 *
              sizeY *
              (
                sizeX +
                sizeZ
              );

            const pointCount =
              Math.max(
                95,
                Math.floor(
                  surfaceArea *
                  0.72 *
                  densityScale
                )
              );

            sampleBoxSurface(
              random,
              pointData,
              centerX,
              baseY,
              centerZ,
              sizeX,
              sizeY,
              sizeZ,
              pointCount,
              paletteBias
            );

            if (
              random() <
              0.77 ||
              layer === 0
            ) {
              addBoxEdges(
                lineData,
                centerX,
                baseY,
                centerZ,
                sizeX,
                sizeY,
                sizeZ,
                random()
              );
            }
          }
        }
      }

      const sidewalkCount =
        Math.floor(
          41000 *
          densityScale
        );

      sampleDeck(
        random,
        pointData,
        -(
          corridorHalf +
          SIDEWALK_CENTER_OFFSET
        ),
        -2.7,
        SIDEWALK_WIDTH,
        -WORLD_HALF,
        WORLD_HALF,
        sidewalkCount,
        0.27
      );

      sampleDeck(
        random,
        pointData,
        corridorHalf +
        SIDEWALK_CENTER_OFFSET,
        -2.7,
        SIDEWALK_WIDTH,
        -WORLD_HALF,
        WORLD_HALF,
        sidewalkCount,
        0.63
      );

      const edgeParticleCount =
        Math.floor(
          18000 *
          densityScale
        );

      for (
        let pointIndex = 0;
        pointIndex < edgeParticleCount;
        pointIndex += 1
      ) {
        const pointZ =
          -WORLD_HALF +
          random() *
          WORLD_LENGTH;

        const side =
          random() <
          0.5
            ? -1
            : 1;

        const sidewalkInner =
          corridorHalf +
          0.25;

        const sidewalkOuter =
          sidewalkOuterDistance -
          0.15;

        const distance =
          THREE.MathUtils.lerp(
            sidewalkInner,
            sidewalkOuter,
            random()
          );

        const pointX =
          side *
          distance;

        const pointY =
          -3.55 +
          Math.sin(
            pointZ *
            0.08 +
            pointX
          ) *
          0.12;

        pointData.positions.push(
          pointX,
          pointY,
          pointZ
        );

        pointData.seeds.push(
          random()
        );

        pointData.sizes.push(
          0.7 +
          random() *
          0.65
        );

        pointData.brightness.push(
          0.58 +
          random() *
          0.42
        );

        pointData.palette.push(
          side <
          0
            ? 0.28 +
              random() *
              0.28
            : 0.54 +
              random() *
              0.28
        );
      }

      const verticalMistCount =
        Math.floor(
          14500 *
          densityScale
        );

      for (
        let pointIndex = 0;
        pointIndex < verticalMistCount;
        pointIndex += 1
      ) {
        const pointZ =
          -WORLD_HALF +
          random() *
          WORLD_LENGTH;

        const side =
          random() <
          0.5
            ? -1
            : 1;

        const pointX =
          side *
          (
            sidewalkOuterDistance +
            BUILDING_GAP +
            1.0 +
            Math.pow(
              random(),
              1.8
            ) *
            18.0
          );

        const pointY =
          baseY +
          Math.pow(
            random(),
            0.92
          ) *
          23.0;

        pointData.positions.push(
          pointX,
          pointY,
          pointZ
        );

        pointData.seeds.push(
          random()
        );

        pointData.sizes.push(
          0.52 +
          random() *
          0.72
        );

        pointData.brightness.push(
          0.18 +
          random() *
          0.32
        );

        pointData.palette.push(
          0.22 +
          random() *
          0.66
        );
      }

      const pointGeometry =
        new THREE.BufferGeometry();

      pointGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
          pointData.positions,
          3
        )
      );

      pointGeometry.setAttribute(
        "aSeed",
        new THREE.Float32BufferAttribute(
          pointData.seeds,
          1
        )
      );

      pointGeometry.setAttribute(
        "aSize",
        new THREE.Float32BufferAttribute(
          pointData.sizes,
          1
        )
      );

      pointGeometry.setAttribute(
        "aBrightness",
        new THREE.Float32BufferAttribute(
          pointData.brightness,
          1
        )
      );

      pointGeometry.setAttribute(
        "aPalette",
        new THREE.Float32BufferAttribute(
          pointData.palette,
          1
        )
      );

      pointGeometry.computeBoundingSphere();

      const lineGeometry =
        new THREE.BufferGeometry();

      lineGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
          lineData.positions,
          3
        )
      );

      lineGeometry.setAttribute(
        "aLineSeed",
        new THREE.Float32BufferAttribute(
          lineData.seeds,
          1
        )
      );

      lineGeometry.setAttribute(
        "aSegmentCenterZ",
        new THREE.Float32BufferAttribute(
          lineData.centers,
          1
        )
      );

      lineGeometry.computeBoundingSphere();

      return {
        pointGeometry,
        lineGeometry
      };
    }

    function rebuildCity() {
      const geometries =
        createCityGeometry();

      if (
        cityPoints
      ) {
        scene.remove(
          cityPoints
        );

        cityPoints.geometry.dispose();
      }

      if (
        cityEdges
      ) {
        scene.remove(
          cityEdges
        );

        cityEdges.geometry.dispose();
      }

      cityPoints =
        new THREE.Points(
          geometries.pointGeometry,
          pointMaterial
        );

      cityPoints.frustumCulled =
        false;

      cityPoints.renderOrder =
        1;

      scene.add(
        cityPoints
      );

      cityEdges =
        new THREE.LineSegments(
          geometries.lineGeometry,
          edgeMaterial
        );

      cityEdges.frustumCulled =
        false;

      cityEdges.renderOrder =
        0;

      scene.add(
        cityEdges
      );
    }

    rebuildCity();

    // -------------------- GUI --------------------

    const gui =
      new GUI({
        title:
          "Scene Settings"
      });

    const cameraFolder =
      gui.addFolder("Camera");

    cameraFolder
      .add(
        PARAMS.Camera,
        "FOV",
        45,
        100,
        1
      )
      .onChange(
        (value) => {
          camera.fov =
            value;

          camera.updateProjectionMatrix();
        }
      );

    cameraFolder.add(
      PARAMS.Camera,
      "Sway",
      0,
      4,
      0.01
    );

    cameraFolder.add(
      PARAMS.Camera,
      "Vertical",
      -2,
      3,
      0.01
    );

    cameraFolder.add(
      PARAMS.Camera,
      "Roll",
      0,
      0.18,
      0.001
    );

    const animationFolder =
      gui.addFolder(
        "Animation"
      );

    animationFolder.add(
      PARAMS.Animation,
      "Speed",
      0,
      30,
      0.1
    );

    animationFolder
      .add(
        PARAMS.Animation,
        "Pulse",
        0,
        1,
        0.01
      )
      .onChange(
        (value) => {
          sharedUniforms.uPulse.value =
            value;
        }
      );

    const geometryFolder =
      gui.addFolder(
        "Geometry"
      );

    geometryFolder
      .add(
        PARAMS.Geometry,
        "Density",
        [
          "Low",
          "Medium",
          "High"
        ]
      )
      .onChange(
        rebuildCity
      );

    geometryFolder
      .add(
        PARAMS.Geometry,
        "CorridorWidth",
        8,
        26,
        0.1
      )
      .onFinishChange(
        rebuildCity
      );

    geometryFolder
      .add(
        PARAMS.Geometry,
        "CurveAmount",
        0,
        7,
        0.01
      )
      .onChange(
        (value) => {
          sharedUniforms.uCurveAmount.value =
            value;
        }
      );

    geometryFolder
      .add(
        PARAMS.Geometry,
        "CityHeight",
        0.5,
        2.2,
        0.01
      )
      .onChange(
        (value) => {
          sharedUniforms.uCityHeight.value =
            value;
        }
      );

    const materialFolder =
      gui.addFolder(
        "Material"
      );

    materialFolder
      .add(
        PARAMS.Material,
        "PointSize",
        0.5,
        4,
        0.01
      )
      .onChange(
        (value) => {
          sharedUniforms.uPointSize.value =
            value;
        }
      );

    materialFolder
      .add(
        PARAMS.Material,
        "PointOpacity",
        0.1,
        1,
        0.01
      )
      .onChange(
        (value) => {
          sharedUniforms.uPointOpacity.value =
            value;
        }
      );

    materialFolder
      .add(
        PARAMS.Material,
        "EdgeOpacity",
        0,
        0.8,
        0.01
      )
      .onChange(
        (value) => {
          edgeMaterial.uniforms.uOpacity.value =
            value;
        }
      );

    const colorsFolder =
      gui.addFolder("Colors");

    colorsFolder
      .addColor(
        PARAMS.Colors,
        "Primary"
      )
      .onChange(
        (value) => {
          sharedUniforms.uPrimary.value.set(
            value
          );
        }
      );

    colorsFolder
      .addColor(
        PARAMS.Colors,
        "Cyan"
      )
      .onChange(
        (value) => {
          sharedUniforms.uCyan.value.set(
            value
          );
        }
      );

    colorsFolder
      .addColor(
        PARAMS.Colors,
        "Magenta"
      )
      .onChange(
        (value) => {
          sharedUniforms.uMagenta.value.set(
            value
          );
        }
      );

    colorsFolder
      .addColor(
        PARAMS.Colors,
        "Red"
      )
      .onChange(
        (value) => {
          sharedUniforms.uRed.value.set(
            value
          );
        }
      );

    const postFolder =
      gui.addFolder(
        "Post Processing"
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "BloomStrength",
        0,
        3,
        0.01
      )
      .onChange(
        (value) => {
          bloomPass.strength =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "BloomRadius",
        0,
        1,
        0.01
      )
      .onChange(
        (value) => {
          bloomPass.radius =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "BloomThreshold",
        0,
        1,
        0.001
      )
      .onChange(
        (value) => {
          bloomPass.threshold =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "TrailPersistence",
        0,
        0.97,
        0.001
      )
      .onChange(
        (value) => {
          afterimagePass.uniforms.damp.value =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "ChromaticShift",
        0,
        0.012,
        0.0001
      )
      .onChange(
        (value) => {
          finalPass.uniforms.uChromaticShift.value =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "Grain",
        0,
        0.2,
        0.001
      )
      .onChange(
        (value) => {
          finalPass.uniforms.uGrain.value =
            value;
        }
      );

    postFolder
      .add(
        PARAMS.PostProcessing,
        "Vignette",
        0,
        1,
        0.01
      )
      .onChange(
        (value) => {
          finalPass.uniforms.uVignette.value =
            value;
        }
      );

    const performanceFolder =
      gui.addFolder(
        "Performance"
      );

    performanceFolder
      .add(
        PARAMS.Performance,
        "DPR",
        {
          "0.5": 0.5,
          "0.75": 0.75,
          "1": 1,
          "1.25": 1.25,
          "1.5": 1.5
        }
      )
      .onChange(
        applyDpr
      );

    gui.close();

    // -------------------- Render metrics --------------------

    const drawingBufferSize =
      new THREE.Vector2();

    function updateRenderMetrics() {
      renderer.getDrawingBufferSize(
        drawingBufferSize
      );

      finalPass.uniforms.uResolution.value.copy(
        drawingBufferSize
      );

      finalPass.uniforms.uPixelRatio.value =
        renderer.getPixelRatio();
    }

    // -------------------- Animation --------------------

    const clock =
      new THREE.Clock();

    const cameraTarget =
      new THREE.Vector3();

    let elapsed =
      0;

    let frameIndex =
      0;

    let pageVisible =
      !document.hidden;

    function updateCamera(
      time,
      cameraWorldZ
    ) {
      const lookDistance =
        28.0;

      const lookWorldZ =
        cameraWorldZ -
        lookDistance;

      const cameraPathX =
        getPathX(
          cameraWorldZ
        );

      const cameraPathY =
        getPathY(
          cameraWorldZ
        );

      const lookPathX =
        getPathX(
          lookWorldZ
        );

      const lookPathY =
        getPathY(
          lookWorldZ
        );

      const sway =
        Math.sin(
          time *
          0.18
        ) *
        PARAMS.Camera.Sway;

      camera.position.set(
        sway,
        PARAMS.Camera.Vertical,
        0
      );

      cameraTarget.set(
        lookPathX -
        cameraPathX +
        sway *
        0.42,

        PARAMS.Camera.Vertical +
        lookPathY -
        cameraPathY,

        -lookDistance
      );

      camera.lookAt(
        cameraTarget
      );

      camera.rotateZ(
        Math.sin(
          time *
          0.24 +
          0.9
        ) *
        PARAMS.Camera.Roll +
        Math.sin(
          time *
          0.61
        ) *
        PARAMS.Camera.Roll *
        0.24
      );
    }

    function animate() {
      requestAnimationFrame(
        animate
      );

      if (
        !pageVisible
      ) {
        clock.getDelta();
        return;
      }

      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );

      elapsed +=
        delta;

      frameIndex =
        (
          frameIndex +
          1
        ) %
        4096;

      const travel =
        (
          elapsed *
          PARAMS.Animation.Speed
        ) %
        WORLD_LENGTH;

      const cameraWorldZ =
        -travel;

      sharedUniforms.uTime.value =
        elapsed;

      sharedUniforms.uCameraWorldZ.value =
        cameraWorldZ;

      finalPass.uniforms.uTime.value =
        elapsed;

      finalPass.uniforms.uFrame.value =
        frameIndex;

      const beat =
        0.5 +
        0.5 *
        Math.sin(
          elapsed *
          2.1
        );

      bloomPass.strength =
        PARAMS.PostProcessing.BloomStrength *
        (
          1.0 +
          beat *
          PARAMS.Animation.Pulse *
          0.09
        );

      updateCamera(
        elapsed,
        cameraWorldZ
      );

      composer.render(
        delta
      );
    }

    // -------------------- Resize and DPR --------------------

    function applyDpr(value) {
      const dpr =
        Number(value);

      PARAMS.Performance.DPR =
        dpr;

      renderer.setPixelRatio(
        dpr
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );

      composer.setPixelRatio(
        dpr
      );

      composer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      sharedUniforms.uDpr.value =
        dpr;

      updateRenderMetrics();
    }

    function onResize() {
      const width =
        window.innerWidth;

      const height =
        window.innerHeight;

      camera.aspect =
        width /
        height;

      camera.updateProjectionMatrix();

      renderer.setSize(
        width,
        height,
        false
      );

      composer.setSize(
        width,
        height
      );

      updateRenderMetrics();
    }

    window.addEventListener(
      "resize",
      onResize
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        pageVisible =
          !document.hidden;

        if (
          pageVisible
        ) {
          clock.getDelta();
        }
      }
    );

    updateRenderMetrics();
    animate();
  </script>
</body>
</html>
