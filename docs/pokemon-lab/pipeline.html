  <!-- ══ PART 1 ═══════════════════════════════════ -->
  <text x="40" y="372" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">PART 1 — MEASURE THE SKELETON (pokemon-rig.js · facts only, no THREE, no guesses)</text>

  <g data-tip="readRigFromGLB(bytes) parses the container and hands the rest the json and the binary chunk|The one thing shared with the old stadium line is stadium-glb.js, whose GLB reading is verified and worth reusing: parseGLB, readAccessor, nodeWorldMatrices, readSkinnedVertices|No THREE anywhere in this module, which is what lets all 151 models be measured in Node without a GPU|Throws only when the file cannot describe a body at all — no skinned pivots, or no vertical extent">
    <rect class="node" x="60" y="382" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="155" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">readRigFromGLB()</text>
    <text x="155" y="421" font-size="11" text-anchor="middle" fill="#4b5563">parseGLB → json + bin</text>
    <text x="155" y="436" font-size="11" text-anchor="middle" fill="#4b5563">via stadium-glb.js</text>
  </g>

  <g data-tip="Stadium rigs are two nodes per bone: a boneNN pivot that carries the transform, and a childless boneNN_scale leaf that the skin binds to|The pivots are the skeleton; parent links walk upward past the leaves|Every skeleton in the dex has exactly one root, the tree is acyclic and fully reachable, and a test asserts all three over all 151 models|No model uses a matrix node, so the authored rest TRS is never a lie">
    <rect class="node" x="280" y="382" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="375" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">pivotTree()</text>
    <text x="375" y="421" font-size="11" text-anchor="middle" fill="#4b5563">pivot carries the transform</text>
    <text x="375" y="436" font-size="11" text-anchor="middle" fill="#4b5563">_scale leaf carries the skin</text>
  </g>

  <g data-tip="Bones are keyed by NAME: readable, diffs cleanly in git, and survives a reload — an annotation file never stores an index|All 151 models name every bone boneNN|Charmander, Charizard and Magmar each contain two DIFFERENT bones sharing one name; a collision gets #2, assigned in ascending node order so it is deterministic|A test pins that set to exactly those three, so a re-extraction that changes it fails loudly rather than silently attaching a role to the wrong bone">
    <rect class="node" x="500" y="382" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="595" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">boneKeys()</text>
    <text x="595" y="421" font-size="11" text-anchor="middle" fill="#4b5563">names, never indices</text>
    <text x="595" y="436" font-size="11" text-anchor="middle" fill="#4b5563">3 species collide → #2</text>
  </g>

  <g data-tip="Where each bone's geometry actually is, in world space at rest|Bone ORIGINS are not anatomical — that is what the original handoff got wrong — so the vertices are used instead|Re-keyed from the _scale leaf the skin binds to onto the pivot that actually moves, merging rather than overwriting when two leaves share one pivot|Per bone: count, points, centroid, min, max, and the single lowest vertex">
    <rect class="node" x="720" y="382" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="815" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">boneGeometry()</text>
    <text x="815" y="421" font-size="11" text-anchor="middle" fill="#4b5563">vertices, not bone origins</text>
    <text x="815" y="436" font-size="11" text-anchor="middle" fill="#4b5563">101,843 skinned vertices</text>
  </g>

  <g data-tip="Chains split at every branch point. That decomposition is deterministic topology and is a FACT; that a chain is a LIMB is a guess, and is not made here|massFraction is the share of the whole mesh hanging below a chain's first bone — the threshold is the caller's business|3,496 chains across the dex, 1,772 of them over 2% of their model's mesh (median 11 a species)|Frames and fps are MEASURED, not assumed: the frame count is the key count on the longest track, and the keys are uniformly spaced, so the rate falls out of the duration|Every clip in the dex measures exactly 30 fps — but nothing writes 30 down, so a clip that was not would report its own rate rather than play at the wrong speed">
    <rect class="node" x="940" y="382" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1035" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">chains + clips</text>
    <text x="1035" y="421" font-size="11" text-anchor="middle" fill="#4b5563">3,496 chains · 1,772 over 2%</text>
    <text x="1035" y="436" font-size="11" text-anchor="middle" fill="#4b5563">1,171 clips, all 30 fps</text>
  </g>

  <g data-tip="bones, byKey, nodeOf, keyOf, root, roots, chains, geometry, clips, units, duplicateNames, hash, notes|rig.hash is FNV-1a over the topology — each bone's key, its parent, its vertex count — so a re-extracted model invalidates its annotations loudly instead of applying them to bones that moved|units.floorY is the model's own lowest vertex: 32 of the 151 do not stand on y=0, by up to 303% of body height, because y=0 is the battle-platform anchor and not the ground|Anything odd goes into notes rather than being thrown, because a person browsing 151 models must not be stopped by one of them">
    <rect class="node" x="1160" y="382" width="210" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1265" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">the rig object</text>
    <text x="1265" y="421" font-size="11" text-anchor="middle" fill="#4b5563">facts, plus rig.hash</text>
    <text x="1265" y="436" font-size="11" text-anchor="middle" fill="#4b5563">32 of 151 sit off y=0</text>
  </g>

  <!-- ══ PART 2 ═══════════════════════════════════ -->
  <text x="40" y="518" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">PART 2 — THE PAGE (pokemon-lab.html · browse mode)</text>

  <g data-tip="One fetch per species, and the same bytes go two ways: through GLTFLoader for something to draw, and through this repo's own reader for the facts|The reader deliberately does not depend on THREE, so the numbers in the facts panel are the same numbers a Node test checks|Parsed models are kept for six species in an LRU cache and disposed after that — re-parsing is the one clearly non-linear cost in going back to something you were just looking at|A load token guards against a faster click landing behind a slower fetch">
    <rect class="node" x="60" y="528" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="155" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">fetch the .glb once</text>
    <text x="155" y="567" font-size="11" text-anchor="middle" fill="#4b5563">GLTFLoader for the picture</text>
    <text x="155" y="582" font-size="11" text-anchor="middle" fill="#4b5563">readRig for the facts</text>
  </g>

  <g data-tip="Two model quirks from docs/stadium/HANDOFF.md that show up the moment they are ignored|Vertices are authored 10x in bone-local space with a model_root scaling down, so bounding volumes are garbage and parts vanish with camera angle — hence frustumCulled = false on every mesh|Some face-decal triangles are wound backwards because the game rendered with culling off — hence DoubleSide on every material|The authored rest is captured here, before any clip runs, so Rest pose restores rather than approximates|Same reason the camera is framed from rig.units: a skinned mesh's own bounding box cannot be trusted on these files">
    <rect class="node" x="280" y="528" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="375" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">load-time fixes</text>
    <text x="375" y="567" font-size="11" text-anchor="middle" fill="#4b5563">frustumCulled = false</text>
    <text x="375" y="582" font-size="11" text-anchor="middle" fill="#4b5563">DoubleSide · rest captured</text>
  </g>

  <g data-tip="Every frame the page works out a frame number, writes it into action.time, and calls mixer.update(0) so nothing else advances anything|That is what makes a segment and a whole clip the same code path: a range whose start is after its end runs backwards, and a range that holds simply stops at its end|Expressing those four cases through LoopOnce, LoopRepeat, clampWhenFinished and a negative timeScale would be more code and less predictable|A static check asserts every mixer.update call passes zero, so the two clocks can never fight|The frame is fractional on purpose — snapping is a scrubbing convenience, not a limit of the model. Stepping floors going forward and ceils going back, so a step from frame 12.6 lands on 13 rather than skipping to 14">
    <rect class="node" x="500" y="528" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="595" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">the page owns the clock</text>
    <text x="595" y="567" font-size="11" text-anchor="middle" fill="#4b5563">applyFrame → mixer.update(0)</text>
    <text x="595" y="582" font-size="11" text-anchor="middle" fill="#4b5563">one path for all four cases</text>
  </g>

  <g data-tip="SkeletonUtils.clone, not Object3D.clone(true): a plain clone shares the skeleton, so posing a ghost would pose the live model with it|Green is the start frame and amber the end, matching the range bar under the scrubber|Two independent choices: WHICH frames to show (start, end, both) and WHERE to put them — overlap, to watch how near the animation comes to landing back on one, or offset, pushed aside so they do not sit inside it|One flat MeshBasicMaterial each, because cloning the real node materials produced nothing visible under WebGPU|The geometry is SHARED with the live model, so disposing it would empty the viewport; only the material is disposed, and a check pins that|If a clone throws, ghosts switch themselves off rather than taking the page down|Toggling ghosts does not move the camera, and marking a start or an end does not start playback. Both were reported as annoyances and both have checks">
    <rect class="node" x="720" y="528" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="815" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">ghosts</text>
    <text x="815" y="567" font-size="11" text-anchor="middle" fill="#4b5563">the start and end frames</text>
    <text x="815" y="582" font-size="11" text-anchor="middle" fill="#4b5563">skeletonClone · one material</text>
  </g>

  <g data-tip="Set start and set end (keys i and o), then type a name and save|The playhead stays where you left it after marking: you are standing on the frame you just marked|Mark pose sets start and end to the same frame and switches to hold — the smallest thing that counts as a state|A range covering the whole clip is stored as wholeClip(), which records no length, so it stays correct if the model is ever re-extracted at a different one|Saving over a name that already exists is an edit, so the button says Update rather than looking additive">
    <rect class="node" x="940" y="528" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1035" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">mark a range, name it</text>
    <text x="1035" y="567" font-size="11" text-anchor="middle" fill="#4b5563">i and o, then Save</text>
    <text x="1035" y="582" font-size="11" text-anchor="middle" fill="#4b5563">this is what the page saves</text>
  </g>

  <g data-tip="A stack of whole libraries, 200 deep, which is only affordable because every edit in pokemon-annotation.js returns a NEW object instead of mutating: unchanged species are SHARED between snapshots rather than copied|commit() is the only place library is assigned other than undo and redo, and a check asserts that count stays at three — an edit that wrote library directly would be invisible to undo and would not be saved|Ctrl+Z works from inside a text box too, where the browser's own undo lives and is not what somebody pressing it after saving a segment means|A static check asserts every edit to the library is followed by a save">
    <rect class="node" x="1160" y="528" width="210" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1265" y="550" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">undo: a stack of libraries</text>
    <text x="1265" y="567" font-size="11" text-anchor="middle" fill="#4b5563">200 deep, structurally shared</text>
    <text x="1265" y="582" font-size="11" text-anchor="middle" fill="#4b5563">every write goes through commit</text>
  </g>

  <!-- ══ PART 3 ═══════════════════════════════════ -->
  <text x="40" y="664" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">PART 3 — THE DECISIONS (pokemon-annotation.js · complete and tested, well ahead of its UI — note 4)</text>

  <g data-tip="version, species, rigHash, locomotion, posture, parts, neutral, segments, done, notes|Every edit returns a NEW annotation rather than mutating, so undo is a stack of references|TRS arrays are copied rather than spread: sharing them would make an undo stack mutate its own history|A blank annotation is deleted rather than written, so the file only holds decisions somebody actually made|rigHash records which version of the model it was made against">
    <rect class="node" x="60" y="674" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="155" y="696" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">one annotation</text>
    <text x="155" y="713" font-size="11" text-anchor="middle" fill="#4b5563">copied on every edit</text>
    <text x="155" y="728" font-size="11" text-anchor="middle" fill="#4b5563">never mutated in place</text>
  </g>

  <g data-tip="A segment is a clip, a frame range and how it ends. It is a VIEW into a clip, not a copy of its keyframes, so naming a range costs nothing and re-slicing costs nothing|to: null means the last frame, so a whole-clip segment records no length|from after to plays backwards, which is how an exit is the entrance reversed for free|ends is loop or hold, and only those two, because only two things are being said: this is a state, or this is a transition|Only 2 of 1,171 clips translate the root bone at all, and neither by more than 10% of body height — which is what makes lifting a segment out of the middle of a battle performance safe">
    <rect class="node" x="280" y="674" width="190" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="375" y="696" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">segments</text>
    <text x="375" y="713" font-size="11" text-anchor="middle" fill="#4b5563">clip, from, to, ends</text>
    <text x="375" y="728" font-size="11" text-anchor="middle" fill="#4b5563">the only half with a UI</text>
  </g>

  <g data-tip="root, spine, head, appendages and contacts. A part stores an ORDERED BONE LIST, never a reference to a chain|toggleBones() is the single primitive behind both selection gestures: the bone gesture passes one key, the chain gesture passes a chain's worth. Because both land in the same place there is no mode to be in, and correcting one bone on a part built by a chain click cannot leave a stale reference|Contacts are stored once, flat; which limb a contact belongs to is derived, and a contact in no limb is a body contact — a Caterpie's belly, a Voltorb's underside|Ten locomotion classes. serpent and worm are separate on purpose: Onix is a rigid segmented body that steers, Caterpie inches by travelling a wave along itself|Written and tested; no gesture in the page reaches it yet">
    <rect class="node" x="500" y="674" width="190" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="595" y="696" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">parts and classes</text>
    <text x="595" y="713" font-size="11" text-anchor="middle" fill="#4b5563">root · spine · head · limbs</text>
    <text x="595" y="728" font-size="11" text-anchor="middle" fill="#4b5563">contacts stored once</text>

    <text x="665" y="678" font-size="10" text-anchor="middle" fill="#ffffff">4</text>
  </g>

  <g data-tip="declareMirror() is reciprocal by construction and releases whatever either side pointed at before, so a one-way mirror cannot be created|suggestMirror() proposes the opposite-side bones by matching x-mirrored rest geometry and reports a per-bone distance in body heights — it is a SUGGESTION, it saves clicking, it does not decide. On Rattata it matches 4 of 4 bones with a worst error of 1.0% of body height|The neutral pose is the pose a species stands in, taken from a clip frame and recording where it came from|Grounding is class-dependent: false for flyers, floaters and swimmers, because dropping a Gastly onto the floor would be actively wrong">
    <rect class="node" x="720" y="674" width="190" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="815" y="696" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">mirrors + neutral pose</text>
    <text x="815" y="713" font-size="11" text-anchor="middle" fill="#4b5563">the pair is declared</text>

  <g data-tip="Structural integrity of the annotation against its rig. Class rules belong in pokemon-gates.js and are deliberately not here|Never throws and never repairs: it reports findings, and the caller decides. A list a person can act on beats a silent correction that moves their work|Codes: stale-rig, unknown-bone, broken-chain, double-claim, duplicate-id, dangling-mirror, one-way-mirror, same-side-mirror, bad-class, bad-posture, bad-type, bad-side, bad-clip, bad-segment, empty-part, posture-ignored|Written and tested; the page does not import it yet">

  <text x="40" y="1206" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">NOTES</text>
  <text x="40" y="1228" font-size="11.5" fill="#374151">1 — The ROM and the session zip are both outside git. The 151 models can be regenerated two ways: from the ROM through build.py, or from pokedex-151.html with extract_glb.py, which needs no ROM.</text>

<script>
  const tip = document.getElementById("tip");
  const wrap = document.getElementById("wrap");
  document.querySelectorAll("g[data-tip]").forEach(g => {
    g.addEventListener("mousemove", e => {
      const ul = document.createElement("ul");
      g.getAttribute("data-tip").split("|").forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
      });
      tip.replaceChildren(ul);
      tip.style.display = "block";
      const r = wrap.getBoundingClientRect();
      let x = e.clientX - r.left + 16;
      let y = e.clientY - r.top + 16;
      if (x + tip.offsetWidth > r.width) x = e.clientX - r.left - tip.offsetWidth - 16;
      if (y + tip.offsetHeight > r.height) y = e.clientY - r.top - tip.offsetHeight - 16;
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    });
    g.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
</script>
