<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pikachu — Pokémon Stadium model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center;
    font: 13px/1.4 system-ui, sans-serif; color: #cfd3dc; flex-wrap: wrap; max-width: calc(100% - 20px);
  }
  select, button {
    background: #232733; color: #e8eaf0; border: 1px solid #3a4050; border-radius: 6px;
    padding: 8px 10px; font: inherit; cursor: pointer; max-width: 70vw;
  }
  #err {
    position: fixed; top: 25%; left: 10px; right: 10px; display: none; z-index: 10;
    background: #3a1518; color: #ffd7d7; border: 1px solid #7c2a2f; border-radius: 8px;
    padding: 12px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all;
  }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center;
    color: #7d8494; font: 14px system-ui, sans-serif; }
  #note { position: fixed; bottom: 8px; left: 10px; right: 10px;
    font: 11px/1.5 system-ui, sans-serif; color: #7d8494; pointer-events: none; }
</style>
<script>
// Error surface FIRST: anything that goes wrong below prints on screen
// instead of failing silently.
window.__fail = function (msg) {
  var e = document.getElementById('err');
  if (e) { e.style.display = 'block'; e.textContent += msg + '\n'; }
};
window.onerror = function (msg, src, line) {
  window.__fail(msg + ' @ ' + (src || '').split('/').pop() + ':' + line);
};
window.addEventListener('unhandledrejection', function (ev) {
  window.__fail('promise: ' + (ev.reason && ev.reason.message || ev.reason));
});
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <select id="anim" aria-label="Animation"><option>loading model…</option></select>
  <button id="play">Pause</button>
  <span id="frameinfo"></span>
</div>
<div id="err"></div>
<div id="status">loading three.js…</div>
<div id="note">Pokémon Stadium (US 1.0) battle model, extracted from your own ROM by DramaticShapeVoxelMod's pipeline · 723 triangles, 37 bones, 30 fps · drag to orbit, pinch or wheel to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*GLTF_LOADER*/</script>
<script>/*ORBIT_CONTROLS*/</script>
<script>
"use strict";
try {
  if (typeof THREE === "undefined") {
    throw new Error("three.js did not load from cdnjs — the viewer may be offline or the CDN blocked");
  }
  document.getElementById("status").textContent = "decoding model…";

  const GLB_BASE64 = "/*GLB_BASE64*/";
  const CLIPS = /*CLIP_META*/;

  const bin = atob(GLB_BASE64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  const app = document.getElementById("app");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161c);
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xdde4ff, 0x2a2418, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(3, 6, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.35);
  rim.position.set(-4, 2, -3);
  scene.add(rim);

  let mixer = null, actions = [], active = -1, playing = true;
  const clock = new THREE.Clock();

  document.getElementById("status").textContent = "parsing model…";
  new THREE.GLTFLoader().parse(bytes.buffer, "", (gltf) => {
    try {
      document.getElementById("status").remove();
      const model = gltf.scene;
      scene.add(model);

      // The mod's own renderer draws with face culling OFF (Voxel3D.lua:
      // setMeshCullMode("none")); some face-decal triangles are wound
      // backwards for glTF, so culling them leaves holes. Match the source.
      model.traverse((o) => {
        if (o.isMesh || o.isSkinnedMesh) {
          // The bind-pose bounding spheres are wrong for this model (vertices
          // are authored 10x in bone-local space), so three.js frustum-culls
          // meshes that are actually on screen — parts vanish with camera
          // angle/distance. 18 draw calls; skip culling entirely.
          o.frustumCulled = false;
          (Array.isArray(o.material) ? o.material : [o.material])
            .forEach((m) => { m.side = THREE.DoubleSide; m.needsUpdate = true; });
        }
      });

      // Frame from skeleton joints: vertices are authored 10x in bone-local
      // space (the exporter's scale rig), so the geometry bounding box lies.
      mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
      mixer.update(0);
      model.updateMatrixWorld(true);
      const box = new THREE.Box3();
      const v = new THREE.Vector3();
      model.traverse((o) => { if (o.isBone) box.expandByPoint(o.getWorldPosition(v)); });
      box.expandByScalar(box.getSize(v).length() * 0.15);

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z);
      controls.target.copy(center);
      camera.position.set(center.x + radius * 1.6, center.y + radius * 0.6, center.z + radius * 1.9);
      camera.near = radius / 100; camera.far = radius * 20;
      camera.updateProjectionMatrix();

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(radius * 1.1, 48),
        new THREE.MeshBasicMaterial({ color: 0x1d212b })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = box.min.y - 0.001;
      scene.add(ground);

      mixer.stopAllAction();
      const sel = document.getElementById("anim");
      sel.innerHTML = "";
      gltf.animations.forEach((clip, i) => {
        const meta = CLIPS[i] || { label: clip.name, loop: true };
        const a = mixer.clipAction(clip);
        a.loop = meta.loop ? THREE.LoopRepeat : THREE.LoopOnce;
        a.clampWhenFinished = !meta.loop;
        actions.push(a);
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = meta.label;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", () => setActive(+sel.value));
      setActive(0);
    } catch (e) { window.__fail("setup: " + e.message); }
  }, (e) => {
    window.__fail("glTF parse failed: " + (e && e.message || e));
  });

  function setActive(i) {
    if (active >= 0) actions[active].stop();
    active = i;
    actions[i].reset().play();
    document.getElementById("frameinfo").textContent =
      CLIPS[i] ? CLIPS[i].frames + " frames · " + CLIPS[i].seconds + "s" : "";
  }

  document.getElementById("play").addEventListener("click", (e) => {
    playing = !playing;
    e.target.textContent = playing ? "Pause" : "Play";
  });

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function tick() {
    requestAnimationFrame(tick);
    const dt = clock.getDelta();
    if (mixer && playing) mixer.update(dt);
    controls.update();
    renderer.render(scene, camera);
  })();
} catch (e) {
  window.__fail(e.message);
}
</script>
</body>
</html>
