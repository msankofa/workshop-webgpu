<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>body{margin:0;background:#222;display:grid;grid-template-columns:repeat(6,200px);gap:2px}
img{width:200px;height:150px}div.l{position:absolute;color:#fff;font:11px sans-serif}</style>
<script src="node_modules/three/build/three.min.js"></script>
<script src="node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
"use strict";
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(400, 300);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const camera = new THREE.PerspectiveCamera(35, 400/300, 0.05, 500);
scene.add(new THREE.HemisphereLight(0xdde4ff, 0x2a2418, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(3,6,4); scene.add(key);

new THREE.GLTFLoader().load('glb/025_pikachu.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  const mixer = new THREE.AnimationMixer(model);
  mixer.clipAction(gltf.animations[0]).play();
  mixer.update(0);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3(); const v = new THREE.Vector3();
  model.traverse(o => { if (o.isBone) box.expandByPoint(o.getWorldPosition(v)); });
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(v).length() * 0.6;
  camera.position.set(c.x + r*0.5, c.y + r*0.45, c.z + r*1.2); // front-ish, head visible
  camera.lookAt(c.x, c.y + r*0.15, c.z);

  // collect unique materials in index order by name matNN
  const mats = new Map();
  model.traverse(o => { if (o.isMesh || o.isSkinnedMesh) {
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.set(m.name, m));
  }});
  const names = [...mats.keys()].sort();
  function shot(label) {
    renderer.render(scene, camera);
    const img = document.createElement('img');
    img.src = renderer.domElement.toDataURL();
    const wrap = document.createElement('div'); wrap.style.position = 'relative';
    const l = document.createElement('div'); l.className = 'l'; l.textContent = label;
    wrap.appendChild(img); wrap.appendChild(l);
    document.body.appendChild(wrap);
  }
  shot('normal');
  for (const n of names) {
    const m = mats.get(n);
    const old = m.emissive ? m.emissive.clone() : null;
    if (m.emissive) m.emissive.set(0xff0000);
    shot(n);
    if (old) m.emissive.copy(old);
  }
  document.title = 'done';
});
</script>
</body>
</html>
