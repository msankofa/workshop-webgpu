  <text x="40" y="140" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">PART 1 — ONE FRAME, LEFT TO RIGHT</text>
  <text x="300" y="140" font-size="11.5" fill="#9ca3af">— animate() runs the simulation, integrates streamed terrain, then hands the scene to Three</text>

  <g data-tip="Fixed-step player and world simulation.|Prediction, weapons, drones, vehicles, bots; about 1 to 4 ms per frame in captures.||playerSim and bodies slots in the capture. Untouched by this work except the drone-view material change.">
    <rect class="node" x="40" y="150" width="170" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="125" y="178" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">simulation</text>

  </g>
  <g data-tip="Marching-cubes terrain tiles built off the main thread, folded into batch buffers on it.|The walking dips tracked terrain worker activity: with 4 threads a frame ran about 61 ms against 28 idle; with 2, no penalty within a capture.|Default pool cap is now 2 threads (d3a01af). Worker activity still correlates with spikes at 2 in the 2026-09-08 sessions; unacknowledged-work counts are a proxy, not proof of contention.||terrain-worker-pool.js shared by all four streamers; terrain-chunk-batches.js now counts first uploads, visibility flips, fallbacks and compactions as logical bytes; residency reports both/extra/missing key sets.">
    <rect class="node" x="240" y="150" width="190" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>

    <text x="335" y="196" font-size="11" text-anchor="middle" fill="#4b5563">2 workers, batch fold, stats</text>
  </g>
  <g data-tip="Compute passes that decide what the GPU draws.|Forest cull writes per-variant live counts into indirect draw buffers; grass cull does the same for blades; Hi-Z feeds both.|The forest census: 8 shipped species x 2 variants x 9 meshes = 144 forest meshes, the largest object group.||forest-gpu.js, grass-compute.js, flora-occlusion.js. The grass material's per-frame uTime and uWorldOrigin moved to renderGroup (ff87a77), one upload per pass instead of per tier mesh; ?grassScope=object flips it back for comparison.">

  <g data-tip="Three's renderer.render(scene, camera): the CPU cost that dominates the frame.|Standing: 12 to 42 ms of encode for about 200 objects in the 2026-09-08 captures; GPU time is about 1 ms.|The shadow pass lists about 207 objects and draws 0 to 34. The planar mirror is off by default (reflection mode ssr in the newest captures).||Each pass: project the scene graph, sort, then per object the stages in Part 2. Everything in Part 2 is a breakdown of this box.">

  <g data-tip="Three asks its material observer whether this object needs a refresh.|In this build the answer is true for ANY material with a node property, before the static or comparison paths are reached. Every Base Game material has one, so every object refreshes every frame: refreshes equal refreshChecks in every capture.|This is the structural fact behind the per-object cost. The observer's own comparison path is dead for node materials.||NodeMaterialObserver.needsRefresh, three.webgpu.js:696-716; containsNode ~119. object.static is unreachable here.">
    <rect class="node" x="40" y="284" width="200" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="140" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">needsRefresh?</text>

    <text x="140" y="346" font-size="11" text-anchor="middle" fill="#4b5563">100% of objects, every frame</text>
  </g>
  <g data-tip="Node update callbacks run: frame- and pass-scoped ones once, object-scoped ones per object.|About 17% of the encode (2 to 10 ms).|Our TSL declares no object-scoped nodes; the cost is Three's built-in per-object uniforms.||nodesBeforeMs + nodesRenderMs in the trace. topNodes rows name the objects.">
    <rect class="node" x="270" y="284" width="200" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="370" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">nodes update</text>
    <text x="370" y="328" font-size="11" text-anchor="middle" fill="#4b5563">~17% of encode</text>
  </g>
  <g data-tip="Attribute versions are checked and dirty attributes uploaded.|Small share of the encode (0.4 to 3 ms). About 98 attribute writes per frame: the body and weapon instance batches mark only their live range, so the bytes are count x 64 B, not the buffer capacity.||geometriesMs. The trace counts bytes by the backend's own rule: one writeBuffer per update range, whole array when there are none (c16551c).">
    <rect class="node" x="500" y="284" width="200" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="600" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">geometries</text>
    <text x="600" y="328" font-size="11" text-anchor="middle" fill="#4b5563">attribute uploads, ~5%</text>
  </g>
  <g data-tip="Uniform groups are diffed against a JS shadow and only changes are written; bind groups are looked up.|The largest named slice: about 45% of the encode (5 to 19 ms). The diff walk runs for every object because the object group's version bumps per object; unchanged objects write nothing, but the walk itself is the cost.|Identical-but-distinct materials share the compiled pipeline but each own a bind group and uniform buffer.||bindingsMs; topBindings rows. UniformsGroup.update ~61973; Bindings._update ~32554.">
    <rect class="node" x="730" y="284" width="200" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="830" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">bindings update</text>
    <text x="830" y="328" font-size="11" text-anchor="middle" fill="#4b5563">uniform diff + write, ~45%</text>
  </g>
  <g data-tip="The render pipeline is fetched from a cache; a miss compiles a shader.|Runs for every object even outside the refresh gate: about 30 field compares per object per frame. Small (~2%) unless a cache miss compiles: one capture had a 1,482 ms encode with a pipeline built in it.||pipelinesMs. The trace now records each cache miss with the material and whether the async path ran (9f1a1bb), so that hitch can be attributed next time.">
    <rect class="node" x="960" y="284" width="200" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1060" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">pipeline lookup</text>
    <text x="1060" y="328" font-size="11" text-anchor="middle" fill="#4b5563">~2%; a miss compiles</text>
  </g>
  <g data-tip="The draw call is encoded.|About 8% of the encode (1 to 2.5 ms). One drawIndexed per BatchedMesh chunk on WebGPU (no multi-draw here); forest and grass use real indirect draws.||drawMs; WebGPUBackend.draw ~81451-81521.">
    <rect class="node" x="1190" y="284" width="180" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="1280" y="310" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">draw</text>
    <text x="1280" y="328" font-size="11" text-anchor="middle" fill="#4b5563">~8%</text>
  </g>

  <text x="40" y="392" font-size="11.5" fill="#6b7280">Slow frames have the same shape as ordinary ones, every stage slower with the same object count. That fits a CPU that is slower for that frame; it does not by itself say why.</text>

  <text x="40" y="450" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.8">PART 3 — THE FOUR PROCESSES BEING CHANGED, AND WHERE EACH STANDS</text>

  <!-- column headers -->
  <text x="40" y="482" font-size="11.5" font-weight="600" fill="#374151">Process</text>
  <text x="320" y="482" font-size="11.5" font-weight="600" fill="#374151">Weakness</text>
  <text x="690" y="482" font-size="11.5" font-weight="600" fill="#374151">Edit</text>
  <text x="1060" y="482" font-size="11.5" font-weight="600" fill="#374151">Status</text>

  <!-- row 1: per-object refresh -->
  <g data-tip="Every object runs nodes and bindings updates every frame.|About 62% of the encode is those two stages; the diff already suppresses GPU writes, so the saving on offer is the walk and the callbacks, not the uploads.||Part 2, needsRefresh and the two stages after it.">
    <rect class="node" x="40" y="496" width="260" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="170" y="522" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">1. per-object refresh</text>
    <text x="170" y="540" font-size="11" text-anchor="middle" fill="#4b5563">nodes + bindings, ~62% of encode</text>
  </g>
  <g data-tip="Three cannot tell that a static object's inputs did not change, because a node material could hide anything.|So it refreshes everything. The only userland levers are fewer objects or answering the question ourselves for objects whose dependencies we can enumerate completely.">
    <rect class="node" x="320" y="496" width="340" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="490" y="522" font-size="12.5" text-anchor="middle" fill="#111827">observer answers true for any node material</text>
    <text x="490" y="540" font-size="11" text-anchor="middle" fill="#4b5563">static fast path unreachable in this build</text>
  </g>
  <g data-tip="An opt-in class of declared-static objects (spawn building, structures, roads) whose full dependency contract is snapshotted; a skip would answer needsRefresh false when the snapshot matches.|Before any skip: a NON-skipping audit scores the snapshot against what the refresh actually changed (binding writes, attribute uploads, uniform values moved by callbacks) and logs every case where a skip would have been wrong.|noObservedChange means the candidate saw no change, never permission to skip.||render-refresh-audit.js, ?refreshaudit=1 (2098779); design docs/superpowers/plans/2026-09-08-refresh-extension-design.md. No skip path exists.">
    <rect class="node" x="680" y="496" width="360" height="70" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
    <text x="860" y="522" font-size="12.5" text-anchor="middle" fill="#111827">non-skipping audit of a dependency contract</text>
    <text x="860" y="540" font-size="11" text-anchor="middle" fill="#4b5563">?refreshaudit=1; skip = design only</text>
  </g>
  <g data-tip="Audit built and Node-tested; the skip itself is a design.|Next: a browser run with the audit on the moving route. Zero disagreements is evidence for those objects and frames, not proof, because updateAfter and side effects outside bindings, attributes and uniforms are not in the oracle.">
    <rect class="node" x="1060" y="496" width="310" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="1215" y="522" font-size="12.5" text-anchor="middle" fill="#111827">audit shipped; skip not built</text>
    <text x="1215" y="540" font-size="11" text-anchor="middle" fill="#4b5563">needs a browser capture first</text>
  </g>

  <!-- row 2: object count / forest -->
  <g data-tip="Every RenderObject pays the fixed work in Part 2, and the forest is the largest group.|144 forest meshes in a shipped session: 16 variants x (7 main + 2 shadow-only). About 106 visible after the LOD rung gate.||Census settled from base-game-default-state.json (8 species, 2 variants each) and capture rows forest:v0..v15.">
    <rect class="node" x="40" y="586" width="260" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="170" y="612" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">2. object count</text>
    <text x="170" y="630" font-size="11" text-anchor="middle" fill="#4b5563">forest = 144 of ~200 meshes</text>
  </g>
  <g data-tip="One mesh per variant per LOD role, each an indirect draw, because the WebGPU backend has no multi-draw and one draw is one contiguous index range.|Materials are already shared per role; the win on offer is mesh count, not material count.">
    <rect class="node" x="320" y="586" width="340" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="490" y="612" font-size="12.5" text-anchor="middle" fill="#111827">one draw per variant per role</text>
    <text x="490" y="630" font-size="11" text-anchor="middle" fill="#4b5563">no multi-draw on WebGPU</text>
  </g>
  <g data-tip="Merge every variant's far-branch rung (LOD2) into one arena and one indirect draw, with the live instances compacted on the GPU and the vertex shader pulling its vertex from storage.|Two mappings exist: uniform per-variant slots (about 2.7x the compact mapping's vertex invocations) and compact (a GPU prefix table, chunked flat vertex stream, branchless span lookup). Fragment stage binds no storage buffer; bark normal frame rebuilt from arena uv; admission read from the renderer's own device (4 vertex-stage storage buffers); a device validation error flips back to the shipped path.||forestDrawMode variants | pulled | pulled-compact in the tree look panel; forest-gpu.js, forest-cull.js twin; all programs build headless through WGSLNodeBuilder, which is graph generation, not device compilation (1648f13, 89fecfd, 6670357).">
    <rect class="node" x="680" y="586" width="360" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="860" y="612" font-size="12.5" text-anchor="middle" fill="#111827">merged pulled draw for the LOD2 branch rung</text>
    <text x="860" y="630" font-size="11" text-anchor="middle" fill="#4b5563">slots and compact mappings, default off</text>
  </g>
  <g data-tip="Coded and compiled headless; never rendered.|Not recommended from draw counts: the invocation ratio is arithmetic, not GPU timing, and parity is unseen.|Browser order: variants vs pulled-compact first (pixel diff, forced-failure check of the fallback), then a GPU timestamp comparison. The padded slot mode is a diagnostic control.">
    <rect class="node" x="1060" y="586" width="310" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="1215" y="612" font-size="12.5" text-anchor="middle" fill="#111827">prototype; nothing rendered</text>
    <text x="1215" y="630" font-size="11" text-anchor="middle" fill="#4b5563">tail guard + fallback lifecycle in review</text>
  </g>

  <!-- row 3: duplicate state -->
  <g data-tip="Identical materials each owned a bind group and uniform buffer, and per-frame values on a shared material were diffed and uploaded once per mesh.|The compiled pipeline is shared (keyed on shader source); the bindings are not.">
    <rect class="node" x="40" y="676" width="260" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="170" y="702" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">3. duplicate state</text>
    <text x="170" y="720" font-size="11" text-anchor="middle" fill="#4b5563">materials and per-frame uniforms</text>
  </g>
  <g data-tip="Craft builders made 3 to 6 materials per spawned drone or vehicle with identical literal colours; TSL uniform() defaults to the per-object group, so the grass material's clock and origin were written once for each of its three tier meshes.||Audit: 183 live modules, 39 material construction sites, zero material clones; one real duplication (flight-meshes.js).">
    <rect class="node" x="320" y="676" width="340" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    <text x="490" y="702" font-size="12.5" text-anchor="middle" fill="#111827">per-craft materials; per-object uniform group</text>
    <text x="490" y="720" font-size="11" text-anchor="middle" fill="#4b5563">the one duplication the audit found</text>

<section id="glossary">
  <h2>DEFINITIONS</h2>
  <p class="lead"><b>Two words this map turns on.</b> The <b>encode</b> is the CPU time Three spends turning the scene into GPU commands each frame; it is most of the frame here. A <b>RenderObject</b> is Three's record for one (object, material, pass) combination, and every one of them pays the per-object stages in Part 2.</p>
  <dl id="glossary-list"></dl>
</section>

<script>
(function () {
  const GLOSSARY = {
    "encode": "The CPU work of walking the scene and emitting GPU commands for every drawn object. In Base Game it is 12 to 42 ms of a frame; the GPU itself takes about 1 ms.",
    "RenderObject": "Three's per-(object, material, pass) record. Sharing a material never reduces their count; only fewer meshes does.",
    "needsRefresh": "The question Three asks per object before re-running node and binding updates. In this build any material with a node property answers yes, always.",
    "node material": "A Three material whose inputs are a TSL node graph. Every Base Game material is one.",
    "bind group": "The GPU-side set of buffers and textures a draw reads. Identical materials that are distinct objects each own one.",
    "uniform group": "A buffer of shader constants. Three diffs it against a CPU shadow and writes only what changed; the diff itself is the cost when nothing changed.",
    "render group": "Three's shared uniform scope updated once per render pass, as opposed to the default per-object scope.",
    "indirect draw": "A draw whose vertex and instance counts are read from a GPU buffer, so a compute pass can decide how much to draw without the CPU knowing.",
    "arena": "One large vertex or index buffer holding many variants at known offsets, so one draw can cover all of them.",
    "vertex pulling": "The vertex shader fetching its own vertex data from storage buffers by index, instead of the hardware feeding it attributes.",
    "prefix table": "Running sums of per-variant live counts, so a flat vertex index can be turned into (variant, instance, local vertex).",
    "compaction": "Shifting the live entries of a fragmented buffer together. For BatchedMesh, one ranged write per shifted geometry; nothing when only the tail was deleted.",
    "logical bytes": "The size of the update ranges our code marked dirty. The renderer writes them; the count is not a measurement of GPU queue traffic.",
    "residency": "Which terrain chunks are held. Target is what the streamer wants drawn; extra is what it keeps past that for hysteresis; missing is target not yet built.",
    "worker pool": "The shared set of terrain worker threads, one for all four streamers; capped at 2 by default.",
    "long task": "A main-thread task over 50 ms, as the browser reports it. Recorded per frame in captures.",
    "between frames": "Time from one animate() end to the next start. When it is large with no long task, the browser did not schedule the next frame.",
    "capture": "A saved performance record from the page: per-frame series, spike analysis, the last traced frame, the worst frames, settings and device limits.",
    "trace": "?trace=1: wraps Three's render internals to time each pass and each per-object stage, and to count refreshes, materials, writes and pipeline compiles.",
    "refresh audit": "?refreshaudit=1: for declared static objects, snapshots the dependency contract before a refresh and scores it against what the refresh actually changed. It never skips.",
    "no observed change": "The audit saw nothing the refresh changed for an object whose snapshot also did not change. Evidence, never permission to skip.",
    "pipeline cache miss": "The first time a (shader, state) combination is drawn, the GPU pipeline is compiled. Synchronous compiles show up as one long frame.",
    "WGSL": "The WebGPU shading language. Three generates it from TSL; generating it headless proves the graph builds, not that a device accepts it.",
    "device limits": "What the GPU device granted, such as storage buffers per vertex stage. The pulled forest needs 4 and falls back when fewer are granted.",
  };
  const TERMS = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
  const TERM_RE = new RegExp("\\b(" + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi");
  const LOOKUP = {}; TERMS.forEach(t => { LOOKUP[t.toLowerCase()] = t; });
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function mark(text, seen) {
    return esc(text).replace(TERM_RE, m => { const k = LOOKUP[m.toLowerCase()]; if (!k || seen.has(k)) return m; seen.add(k); return '<span style="color:#9ec5fe">' + m + '</span>'; });
  }
  const tip = document.getElementById("tip"), wrap = document.getElementById("wrap");
  let hideTimer = null;
  const hide = ms => { clearTimeout(hideTimer); hideTimer = setTimeout(() => { tip.style.display = "none"; }, ms); };
  document.querySelectorAll("g[data-tip]").forEach(g => {
    g.addEventListener("mousemove", e => {
      clearTimeout(hideTimer);
      const [main, dev] = g.getAttribute("data-tip").split("||");
      const parts = main.split("|"); const seen = new Set();
      let html = '<p class="lead">' + mark(parts[0].trim(), seen) + "</p>";
      const why = parts.slice(1).map(s => s.trim()).filter(Boolean);
      if (why.length) html += "<ul>" + why.map(s => "<li>" + mark(s, seen) + "</li>").join("") + "</ul>";
      if (dev) html += '<div class="dev"><p class="dev-label">Implementation</p><ul>' + dev.split("|").map(s => s.trim()).filter(Boolean).map(s => "<li>" + mark(s, seen) + "</li>").join("") + "</ul></div>";
      tip.innerHTML = html; tip.style.display = "block";
      const r = wrap.getBoundingClientRect();
      let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
      if (x + tip.offsetWidth > r.width) x = Math.max(0, e.clientX - r.left - tip.offsetWidth - 14);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    });
    g.addEventListener("mouseleave", () => hide(350));
  });
  tip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
  tip.addEventListener("mouseleave", () => hide(200));
  const list = document.getElementById("glossary-list");
  Object.keys(GLOSSARY).sort((a, b) => a.localeCompare(b)).forEach(t => {
    const d = document.createElement("div"); d.innerHTML = "<dt>" + esc(t) + "</dt><dd>" + esc(GLOSSARY[t]) + "</dd>"; list.appendChild(d);
  });
})();
</script>
