function reportBaseGameError(value) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += (value && value.stack ? value.stack : String(value)) + '\n';
}
window.addEventListener('error', event => reportBaseGameError(event.error || event.message));
window.addEventListener('unhandledrejection', event => reportBaseGameError(event.reason));

  for (const [key, read] of Object.entries(ARM_SLIDER_KEYS)) settings[key] = read(preset);

let activeMode = 'menu';
let networkSession = null;
let networkSnapshot = null;
let networkStatus = { state: 'offline' };
let networkUiReady = false;
let gameplayPaused = true;
let simulationReady = false;
function isOnline() {
  return (activeMode === 'create' || activeMode === 'join') && !!networkSession;
}
let receiveNetworkSnapshot = snapshot => { networkSnapshot = snapshot; };
let receiveNetworkStatus = status => { networkStatus = status; };

// Room terrain is chosen by the creator from their current Solo ground. Volumetric stays local.
function pickRoomTerrainConfig() {
  if (settings.worldMode !== 'terrain') return { kind: 'traversalLab' };
  // Before the game exists (start menu) the only possible terrain is the analytic default.
  const descriptor = simulationReady ? activeTerrainDescriptor : analyticDescriptor({ key: 'base-game-analytic', sourceVersion: '1' });
  const volumetric = simulationReady && settings.terrainVolumetric && !!terrain.source?.densityAt;
  return { kind: 'terrain', descriptor, volumetric };
}
let roomTerrainConfig = null;   // the room's current terrain config while online (set on join and on owner changes)
function connectOnlineSession({ mode, roomCode }) {
  return connectBaseGameSession({
    mode,
    roomCode,
    world: pickBaseGameSharedWorld(settings),
    terrain: mode === 'create' ? pickRoomTerrainConfig() : null,
    onSnapshot: (snapshot, session) => receiveNetworkSnapshot(snapshot, session),
    onStatus: status => receiveNetworkStatus(status),
    onTerrain: config => receiveRoomTerrain(config),
  });
}

// Terrain configuration lives outside `settings`: the full v5 project is state-file
// data, not a slider. The studio is a full-screen overlay hosting the v5 editor.
let studioWasPaused = true;
let terrainPanelRefresh = () => {};
const terrainStore = createTerrainProjectStore({
  onChange: () => { terrainPanelRefresh(); scheduleAutosaveSafe(); },
  // The Apply transaction's runtime half: build a candidate source, prove it can generate the
  // tile under the player, then swap the live source. Throws (and the store keeps the old
  // active project) if any step fails.
  applySource: async (project) => {
    if (!simulationReady) throw new Error('the game has not started yet');
    if (isOnline()) {
      // Online the owner chooses the world for everyone: the server builds it, then every client
      // (this one included) adopts the echoed config. Guests cannot apply.
      if (!networkSession?.owner) throw new Error('only the room owner can change the world');
      await networkSession.setTerrain({ kind: 'terrain', descriptor: v5Descriptor(project), volumetric: settings.terrainVolumetric });
      return;
    }
    await applyTerrainProjectAtRuntime(project);
  },
});
const terrainStudio = createBaseGameTerrainStudio({
  store: terrainStore,
  onOpen: () => {
    studioWasPaused = gameplayPaused;
    gameplayPaused = true;
    if (!simulationReady) return;   // opened from the start menu: no renderer/controls yet
    controls.enabled = false;
    clearPlayerInput();
    if (document.pointerLockElement === renderer.domElement) document.exitPointerLock?.();
  },
  onClose: () => {
    if (!simulationReady || activeMode === 'menu') return;
    if (!studioWasPaused) resumeGameplay();
    else pauseMenu.show(pauseSessionLabel());
  },
  onError: err => console.warn('[terrain studio]', err),
});
function scheduleAutosaveSafe() { if (simulationReady) scheduleAutosave(); }

  document.getElementById('boot-screen')?.remove();
  return showBaseGameStartMenu({ connect: connectOnlineSession, onTerrainStudio: () => terrainStudio.show() });
}

networkSession = initialSessionChoice.session;
// While online the ground is room-owned: the start menu's choice is replaced by the room's.
roomTerrainConfig = networkSession?.terrain ?? null;
if (networkSnapshot?.world) Object.assign(settings, sanitizeBaseGameWorldPatch(networkSnapshot.world));

const CAMERA_FAR_NEAR_FIELD = 600;
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, CAMERA_FAR_NEAR_FIELD);

  } else if (musicStarted && envAudio.getMusicProgress().playing) {
    envAudio.togglePlayback();
  }
}

for (const type of ['pointerdown', 'keydown']) addEventListener(type, () => envAudio.noteGesture(), { capture: true });

const worldCoordinates = createWorldCoordinateSpace();
const worldQuery = createWorldQueryService();
const traversalLab = createBaseGameTraversalLab({ scene, worldQuery });
// Phase 4 slice: the analytic source is the only runtime source until terrain-source-v5.js lands.
const TERRAIN_SOURCE_DESCRIPTOR = analyticDescriptor({ key: 'base-game-analytic', sourceVersion: '1' });
const terrain = createBaseGameTerrain({ scene, worldQuery, worldCoordinates, source: TERRAIN_SOURCE_DESCRIPTOR });

// Make the local world match a room's terrain config exactly (same descriptor, same hash),
// or throw so the handshake fails instead of predicting against substitute ground.
function adoptRoomTerrain(config) {
  if (!config) return;
  if (config.kind === 'terrain') {
    const check = sanitizeBaseGameTerrainConfig({ kind: 'terrain', descriptor: config.descriptor, volumetric: config.volumetric === true });
    if (check.error) throw new Error(`room terrain rejected locally: ${check.error}`);
    if (check.config.worldVersion !== config.worldVersion) throw new Error(`room terrain version mismatch: ${check.config.worldVersion} vs ${config.worldVersion}`);
    const same = activeTerrainDescriptor.key === check.config.descriptor.key && activeTerrainDescriptor.sourceVersion === check.config.descriptor.sourceVersion;
    if (!same) terrain.setSource(check.config.descriptor);
    activeTerrainDescriptor = check.config.descriptor;
    settings.worldMode = 'terrain';
    settings.terrainVolumetric = check.config.volumetric;
  } else {
    settings.worldMode = 'traversalLab';
  }

  updateWorld(0);

}

  roomTerrainConfig = config;
  if (!simulationReady) return;

  catch (err) { reportBaseGameError(err); returnToMainMenu().catch(reportBaseGameError); }

// the controls snap back to the room's config.
let roomTerrainRequestTimer = 0;

function renderNetworkStatus() {

  if (activeMode === 'menu') {

  const count = networkSnapshot?.players?.filter(player => player.connected).length ?? 0;
  const state = networkStatus.state || 'connecting';
  multiplayerStatus.textContent = `${networkSession?.roomCode || ''} · ${role} · ${state} · ${count} connected`;
}

// Authoritative player state: reconcile the owning client's prediction and buffer every other
// roster entry for interpolated remote capsules. Shared world values apply as before.
function applyPlayerSnapshot(snapshot, session) {
  if (!simulationReady || !session?.clientId) return;
  const local = snapshot.players?.find(player => player.id === session.clientId);
  if (local) {
    const before = playerController.getPosition();
    const result = prediction.reconcile(local);
    if (result.hard) {
      correctionOffset.fill(0);
      playerView.resetSmoothing();
      playerController.interpolatedPosition(1, playerRenderPosition);
    } else if (result.replayed > 0 || result.reason === 'replay') {
      const after = playerController.getPosition();
      for (let axis = 0; axis < 3; axis++) correctionOffset[axis] += before[axis] - after[axis];
    }
  }
  remotePlayers.ingestSnapshot(snapshot, session.clientId, performance.now());
}
let loadoutSentFor = null;   // session the loadout was last pushed to
receiveNetworkSnapshot = (snapshot, session = networkSession) => {
  networkSnapshot = snapshot;
  if (session) networkSession = session;
  // The server starts everyone on the default loadout; push ours once per session.
  if (session && loadoutSentFor !== session && snapshot.worldReady) { loadoutSentFor = session; session.setLoadout(currentLoadout()); }
  applyPlayerSnapshot(snapshot, session);
  Object.assign(settings, sanitizeBaseGameWorldPatch(snapshot.world));
  if (networkUiReady) {
    syncAllControls();
    syncNetworkControlPermissions();
    updateWorld(0);
    renderNetworkStatus();
  }
};

function captureAllState() {
  const savedSettings = {};
  for (const key of Object.keys(DEFAULT_SETTINGS)) savedSettings[key] = settings[key];
  return {
    format: STATE_FORMAT,
    version: STATE_VERSION,
    settings: savedSettings,
    camera: {

      target: controls.target.toArray(),
      fov: camera.fov,
    },
    world: { renderOrigin: worldCoordinates.getOrigin() },
    terrain: terrainStore.capture(),

      view: playerView.captureState(),
    },
    ui: {
      panelCollapsed: ctrlRoot.classList.contains('collapsed'),
      sections: readSectionStates(ctrlBody),
    },
  };
}

function assignLoadedSettings(loaded, { includeShared = true } = {}) {
  if (!loaded || typeof loaded !== 'object') return;
  for (const [key, fallback] of Object.entries(DEFAULT_SETTINGS)) {
    if (!includeShared && sharedSettingKeys.has(key)) continue;
    const value = loaded[key];
    if (typeof fallback === 'boolean') {
      if (typeof value === 'boolean') settings[key] = value;
    } else if (typeof fallback === 'number') {
      if (!Number.isFinite(value)) continue;
      const limits = NUMBER_LIMITS[key];
      settings[key] = limits ? Math.max(limits[0], Math.min(limits[1], value)) : value;
    } else if (typeof fallback === 'string') {
      const allowed = STRING_VALUES[key];
      if (typeof value === 'string' && (!allowed || allowed.includes(value))) settings[key] = value;
    }
  }
}
function finiteVec3(value) {
  return Array.isArray(value) && value.length === 3 && value.every(Number.isFinite);
}
function applyAllState(payload) {
  const data = payload?.data?.settings ? payload.data : payload;
  if (!data || typeof data !== 'object') throw new Error('State is not an object');
  if (data.format && data.format !== STATE_FORMAT) throw new Error(`Unsupported state format: ${data.format}`);
  assignLoadedSettings(data.settings, { includeShared: canEditSharedSettings() });
  if (finiteVec3(data.world?.renderOrigin)) worldCoordinates.setRenderOrigin(data.world.renderOrigin);
  if (data.terrain) { terrainStore.restore(data.terrain); syncTerrainSourceFromStore(); }
  // A saved transform is a Solo/debug artifact; online, the server's spawn state wins.
  if (data.player && !isOnline()) playerController.applyState(data.player);
  if (data.player?.view) playerView.applyState(data.player.view);
  if (finiteVec3(data.camera?.position)) camera.position.fromArray(data.camera.position);
  if (finiteVec3(data.camera?.target)) controls.target.fromArray(data.camera.target);
  if (Number.isFinite(data.camera?.fov)) {
    camera.fov = Math.max(20, Math.min(100, data.camera.fov));
    camera.updateProjectionMatrix();
  }
  if (typeof data.ui?.panelCollapsed === 'boolean') ctrlRoot.classList.toggle('collapsed', data.ui.panelCollapsed);
  applySectionStates(ctrlBody, data.ui?.sections);
  applyAudioSettings();
  applyMusicSetting().catch(reportBaseGameError);
  controls.update();
  syncAllControls();
  syncNetworkControlPermissions();
  updateWorld(0);
  if (activeMode !== 'solo' && networkSession?.owner) networkSession.setWorld(pickBaseGameSharedWorld(settings));
  return true;
}

async function finishPerformanceCapture(capture, finishedAt) {
  const settingsAtEnd = copyPerformanceSettings();
  const allChanges = changedPerformanceSettings(capture.settingsAtStart, settingsAtEnd);
  const clockWasRunning = capture.settingsAtStart.todPlaying && settingsAtEnd.todPlaying;
  const expectedDynamicChanges = allChanges.filter(change => change.key === 'todHour' && clockWasRunning);
  const changedSettingsDuringCapture = allChanges.filter(change => !expectedDynamicChanges.includes(change));
  const droppedFramesEnd = frameProfiler.snapshot().droppedFrames;

  try {
    const performanceResult = buildPerformanceMeasurement(capture.samples, {
      requestedWindowSeconds: capture.requestedWindowSeconds,
      startedAt: capture.startedAt,
      finishedAt,
      droppedFramesStart: capture.droppedFramesStart,
      droppedFramesEnd,
    });
    const entry = {
      format: 'pcw-base-game-performance-capture',
      version: 1,
      ...(capture.label ? { label: capture.label } : {}),
      capturedAt: new Date().toISOString(),
      configurationStable: changedSettingsDuringCapture.length === 0,
      changedSettingsDuringCapture,
      expectedDynamicChanges,
      settingsAtStart: capture.settingsAtStart,
      settingsAtEnd,
      togglesAtStart: performanceToggles(capture.settingsAtStart),
      performance: performanceResult,
      context: captureContext(),
    };
    const description = capture.label ? `“${capture.label}”` : 'performance capture';
    captureStatus.textContent = `Saving ${description} to disk…`;
    const saved = await savePerformanceCapture(entry);
    captureStatus.textContent = `Saved ${description} as entry ${saved.entryCount} in ${saved.path}.`;
  } catch (error) {
    captureStatus.textContent = `Performance capture failed: ${error.message}. Run this page through serve.py to save to disk.`;
  } finally {
    setPerformanceCaptureBusy(false);
  }
}

function recordPerformanceFrame(frameStart, frameMs) {
  latestPerformanceFrame = {
    frameMs,
    drawCalls: lastRenderInfo.drawCalls,
    triangles: lastRenderInfo.triangles,
  };
  const capture = activePerformanceCapture;
  if (!capture) return;

  // Trim the first draw-to-draw interval at the click boundary instead of attributing
  // pre-capture time to the requested measurement window.
  const sample = capture.samples.length === 0
    ? { ...latestPerformanceFrame, frameMs: Math.min(frameMs, Math.max(0.001, frameStart - capture.startedAt)) }
    : latestPerformanceFrame;
  capture.samples.push(sample);
  const now = performance.now();
  if (now - capture.lastProgressAt >= 500) {
    const remaining = Math.max(0, capture.endsAt - now) / 1000;
    const description = capture.label ? `“${capture.label}”` : 'performance';
    captureStatus.textContent = `Measuring ${description}… ${remaining.toFixed(1)} s remaining`;
    capture.lastProgressAt = now;
  }
  if (now < capture.endsAt) return;
  activePerformanceCapture = null;
  finishPerformanceCapture(capture, now);
}

async function animate() {
  if (frameBusy) { frameProfiler.markDropped(); return; }
  frameBusy = true;
  try {
    frameProfiler.beginFrame();
    const frameStart = performance.now();
    const frameMs = Math.max(0, frameStart - lastFrameStart);
    lastFrameStart = frameStart;
    const dt = Math.min(0.1, frameMs / 1000);

    const online = isOnline();
    const canControl = !gameplayPaused && settings.playerControlMode === 'player';
    const input = canControl ? {
      moveX: (playerKeys.has('KeyD') ? 1 : 0) - (playerKeys.has('KeyA') ? 1 : 0),
      moveZ: (playerKeys.has('KeyW') ? 1 : 0) - (playerKeys.has('KeyS') ? 1 : 0),
      yaw: playerView.yaw,
      pitch: playerView.pitch,
      sprint: playerKeys.has('ShiftLeft') || playerKeys.has('ShiftRight'),
      slot: weaponState.slot,
      aim: weaponState.aiming,
      fire: false,
    } : { moveX: 0, moveZ: 0, yaw: playerView.yaw, pitch: playerView.pitch, sprint: false, slot: weaponState.slot, aim: false, fire: false };
    if (!canControl) weaponState.reloadEdge = false;
    // The jump edge is cleared only when a simulation tick actually consumes it: a frame with zero
    // fixed steps (high refresh rates, pacing below 1x) must not swallow the key press.
    if (!canControl) jumpEdgeQueued = false;
    if (online) {
      // Lockstep ticks: every fixed step is numbered, sent to the server, and replayed exactly on
      // reconciliation. Paused or Orbit mode keeps ticking with neutral input so the server and
      // the local simulation never fall out of step.
      const stepped = prediction.advance(dt, () => {
        const jump = jumpEdgeQueued;
        jumpEdgeQueued = false;
        const reload = weaponState.reloadEdge;
        weaponState.reloadEdge = false;
        if (reload && playerBodies.localReload()) { weaponViewModel.reload(playerBodies.localMount?.reloadSequence); audioDirector.localReload(); }   // predicted: the server echoes the same action tick
        return { ...input, jump, reload };
      });
      playerInterpolationAlpha = stepped.alpha;
      playerController.interpolatedPosition(playerInterpolationAlpha, playerRenderPosition);
      const keep = Math.exp(-CORRECTION_DECAY_RATE * dt);
      for (let axis = 0; axis < 3; axis++) {
        correctionOffset[axis] *= keep;
        if (Math.abs(correctionOffset[axis]) < 1e-4) correctionOffset[axis] = 0;
        playerRenderPosition[axis] += correctionOffset[axis];
      }
    } else if (canControl) {
      playerController.setInput(input);
      if (jumpEdgeQueued) { playerController.queueJump(); jumpEdgeQueued = false; }
      if (weaponState.reloadEdge) { weaponState.reloadEdge = false; if (playerBodies.localReload()) { weaponViewModel.reload(playerBodies.localMount?.reloadSequence); audioDirector.localReload(); } }
      const stepped = playerController.advance(dt);
      // Solo kill plane; online the server enforces the same layout value.
      if (playerController.getPosition(playerPositionScratch)[1] < worldKillPlaneY(playerPositionScratch)) resetPlayer();
      playerInterpolationAlpha = stepped.alpha;
      playerController.interpolatedPosition(playerInterpolationAlpha, playerRenderPosition);
    } else {
      playerController.interpolatedPosition(1, playerRenderPosition);
    }
    if (canControl) {
      worldCoordinates.maybeRebase(playerController.getPosition(playerPositionScratch));
      playerView.syncCapsule(playerRenderPosition, {
        visible: settings.playerCapsuleVisible && settings.playerViewMode === 'thirdPerson',
        grounded: playerController.grounded,
      });
      const comfort = FP_COMFORT[settings.fpCameraComfort] ?? FP_COMFORT.off;
      const comfortOn = settings.playerViewMode === 'firstPerson' && fpState.hasEye && !weaponState.aiming;
      playerView.updateCamera(dt, playerRenderPosition, {
        mode: settings.playerViewMode,
        distance: settings.cameraDistance,
        followRate: settings.cameraFollowRate,
        obstructionPadding: settings.cameraObstructionPadding,
        eyeAnchor: comfortOn ? fpState.eye : null,
        comfortRateXZ: comfortOn ? comfort.xz : 0,
        comfortRateY: comfortOn ? comfort.y : 0,
      });
    } else {
      if (settings.playerControlMode === 'orbit') controls.update();
      playerView.syncCapsule(playerRenderPosition, {
        visible: settings.playerCapsuleVisible,
        grounded: playerController.grounded,
      });
    }
    // Bodies read the same render position the capsule uses; the controller is never touched.
    // Third-person rigs show only in third-person view, lower-body rigs only in first-person.
    const firstPerson = settings.playerViewMode === 'firstPerson';
    const bodyVisible = settings.playerBodyMode === 'lowerBody' ? firstPerson : true;
    // First person on the full rig: head and torso masked so they never clip the camera.
    const wantMask = firstPerson && settings.playerBodyMode === 'thirdPerson' && canControl;
    if (wantMask !== fpState.masked) { fpState.masked = wantMask; playerBodies.setLocalPartMask(wantMask ? FP_PART_MASK : FP_PART_MASK_NONE); }
    // View blend: preset value, pulled to 1 by aiming and toward 0 by sprinting, eased.
    const sprinting = canControl && input.sprint && (input.moveX !== 0 || input.moveZ !== 0);
    const blendTarget = !wantMask ? 0 : weaponState.aiming ? 1 : sprinting ? settings.fpViewBlend * 0.3 : settings.fpViewBlend;
    fpState.viewBlend += (blendTarget - fpState.viewBlend) * (1 - Math.exp(-6 * dt));
    fpState.aimAmount += ((weaponState.aiming ? 1 : 0) - fpState.aimAmount) * (1 - Math.exp(-10 * dt));
    // The authored viewmodel pose, lifted from camera space into the world for the mount blend.
    const vmSpeed = Math.hypot(playerController.getVelocity()[0], playerController.getVelocity()[2]);
    const vmPose = weaponViewModel.update(dt, { speed: vmSpeed, aim: fpState.aimAmount, running: sprinting, moveX: input.moveX, moveZ: input.moveZ, lookYaw: playerView.yaw });
    let viewFrame = null;
    if (wantMask && vmPose.visible && fpState.viewBlend > 1e-3) {
      camera.updateMatrixWorld(true);
      fpLocalMatrix.compose(fpViewPos.fromArray(vmPose.position), fpViewQuat.setFromEuler(fpViewEuler.set(vmPose.rotation[0], vmPose.rotation[1], vmPose.rotation[2], 'XYZ')), fpScale.set(1, 1, 1));
      fpWorldMatrix.multiplyMatrices(camera.matrixWorld, fpLocalMatrix).decompose(fpViewPos, fpViewQuat, fpScale);
      viewFrame = fpViewFrame;
    }
    {
      const v = playerController.getVelocity();
      audioDirector.updateLocal(dt, {
        speed: canControl ? Math.hypot(v[0], v[2]) : 0,
        grounded: playerController.grounded,
        sprint: input.sprint,
        rising: v[1] > 0.5,
      });
    }
    playerBodies.setLocalAim(canControl && weaponState.aiming, canControl && weaponState.aiming ? updateLocalAimPoint() : null);
    playerBodies.updateLocal(dt, {
      globalFoot: worldCoordinates.toGlobal(playerRenderPosition),
      velocity: playerController.getVelocity(),
      yaw: playerView.yaw,
      pitch: playerView.pitch,
      grounded: playerController.grounded,
      height: playerController.config.height,
      radius: playerController.config.radius,
      visible: bodyVisible,
      viewFrame,
      viewBlend: viewFrame ? fpState.viewBlend : 0,
    });
    // The rig's eyes sit ~0.34 m above the capsule's eye height (the rig is taller than its capsule),
    // so the comfort anchor keeps the capsule height and takes only the head's motion from the rig.
    fpState.hasEye = !!playerBodies.localEyePoint(fpState.eye);
    if (fpState.hasEye) fpState.eye[1] -= FP_RIG_EYE_OFFSET;
    if (online) {
      remotePlayers.update(performance.now(), { interpolationDelayMs: settings.interpolationDelayMs });
      playerBodies.beginRemoteFrame();
      if (settings.remoteBodiesEnabled) {
        for (const [id, record] of remotePlayers.players) {
          if (!record.sample) continue;
          worldCoordinates.toRenderLocal(record.sample.position, remoteAudioLocal);
          audioDirector.updateRemote(id, {
            position: { x: remoteAudioLocal[0], y: remoteAudioLocal[1], z: remoteAudioLocal[2] },
            grounded: record.sample.grounded,
            action: record.sample.action,
            actionTick: record.sample.actionTick,
            weapon: record.sample.weapon,
          });
          playerBodies.updateRemote(dt, id, {
            globalFoot: record.sample.position,
            velocity: record.sample.velocity,
            yaw: record.sample.yaw,
            pitch: record.sample.pitch,
            grounded: record.sample.grounded,
            weapon: record.sample.weapon,
            aiming: record.sample.aiming,
            action: record.sample.action,
            actionTick: record.sample.actionTick,
          });
        }
      }
      playerBodies.endRemoteFrame();
      for (const id of [...playerBodies.remoteIds]) if (!remotePlayers.players.has(id)) { playerBodies.releaseRemote(id); audioDirector.releaseRemote(id); }
    } else {
      playerBodies.flushWeapons();
    }
    sky.group.position.copy(camera.position);
    envAudio.update(frameStart);
    frameProfiler.time('terrain', () => terrain.update(playerController.getPosition(playerPositionScratch), dt));
    if (terrain.takeHandoffCompleted() && !isOnline()) reseatPlayerOnTerrain(1);
    if ((terrainRuntimeTick = (terrainRuntimeTick + 1) % 15) === 0) refreshTerrainRuntimeLine();
    frameProfiler.time('sky', () => updateWorld(dt));
    if (!terrainStudio.open) frameProfiler.time('postRender', () => renderer.render(scene, camera));
    lastRenderInfo = {
      drawCalls: renderer.info.render.drawCalls,
      triangles: renderer.info.render.triangles,
    };
    sky.flushDisposals();
    updateStats(frameMs);
    recordPerformanceFrame(frameStart, frameMs);
  } finally {
    frameBusy = false;
  }
}

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
});

addEventListener('beforeunload', () => {
  stopRebasePresentation();
  playerView.dispose();
  playerBodies.dispose();
  remotePlayers.dispose();
  envAudio.dispose();
  traversalLab.dispose();
  terrain.dispose();
}, { once: true });

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
