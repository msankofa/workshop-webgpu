<script>
function reportBaseGameError(value) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent += (value && value.stack ? value.stack : String(value)) + '\n';
}
window.addEventListener('error', event => reportBaseGameError(event.error || event.message));
window.addEventListener('unhandledrejection', event => reportBaseGameError(event.reason));
</script>

    rig.setSunIntensity(moonIntensity + keyLift);
    aimLight(rig.dirLight, moonDir);
    moonLight.intensity = 0;
  } else {
    rig.setSunIntensity(sunIntensity + keyLift);
    aimLight(rig.dirLight, sunDir);
    moonLight.intensity = moonIntensity;
  }
  aimLight(moonLight, moonDir);
  if (!settings.skyEnabled || !settings.domeEnabled) scene.background.set(0x0b1430);
  // After the dome has written scene.background for this frame, so a sky-tracking fog reads the
  // colour the player is actually looking at.
  applyAtmosphereSettings();
  // Clouds take the key light's own colour, so dusk reddens them and night leaves them a silhouette.
  // The same 0..1 flash the drops brighten on, so bolt, drops and cloud base fade together. Before
  // this the flash reached the clouds only as an accident of the ownership test above: the tint is
  // a colour and no intensity has ever entered it, so a strike could not brighten a cloud at all.
  clouds.update(dt, camera, {
    sunColor: rig.dirLight.color,
    nightness: sky.nightness,
    flash: rain.uniforms.uLightning.value * settings.cloudLightningLift,
  });
}

const controlRegistry = new Map();
let pendingSharedPatch = {};
let sharedPatchTimer = 0;

function canEditSharedSettings() {
  return activeMode === 'solo' || !!networkSession?.owner;
}
function registerControl(key, sync, element) {
  if (!(key in DEFAULT_SETTINGS)) throw new Error(`Control has no saved setting: ${key}`);
  if (controlRegistry.has(key)) throw new Error(`Duplicate control: ${key}`);
  controlRegistry.set(key, { sync, element, shared: sharedSettingKeys.has(key) });
}
const ROOM_OWNED_GROUND_KEYS = ['worldMode', 'terrainVolumetric', 'terrainSeaLevel'];
// The analytic source carries the slider's sea level; a v5 project's is authored in the project.
function applyLocalSeaLevel() {
  if (activeTerrainDescriptor.kind === 'analytic') {
    activeTerrainDescriptor = analyticDescriptor({ key: activeTerrainDescriptor.key, sourceVersion: activeTerrainDescriptor.sourceVersion, params: activeTerrainDescriptor.config.params, seaLevel: settings.terrainSeaLevel });
    terrain.setSeaLevel(settings.terrainSeaLevel);
  } else {
    settings.terrainSeaLevel = activeTerrainDescriptor.seaLevel;
    syncAllControls();
  }
}
function syncNetworkControlPermissions() {
  const editable = canEditSharedSettings();
  for (const entry of controlRegistry.values()) {
    if (entry.shared && entry.element) entry.element.disabled = !editable;
  }
  // The ground belongs to the room owner: guests follow whatever world the owner picks.
  for (const key of ROOM_OWNED_GROUND_KEYS) {
    const entry = controlRegistry.get(key);
    if (entry?.element) entry.element.disabled = isOnline() && !networkSession?.owner;
  }
  applyDraftButton.disabled = isOnline() && !networkSession?.owner;
}
function queueSharedWorldPatch(key) {
  if (!networkSession?.owner) return;
  pendingSharedPatch[key] = settings[key];
  if (sharedPatchTimer) return;
  sharedPatchTimer = setTimeout(() => {
    sharedPatchTimer = 0;
    const patch = pendingSharedPatch;
    pendingSharedPatch = {};
    networkSession?.setWorld(patch);
  }, 75);
}
function changed(key) {
  if (key === 'terrainSeaLevel' && !(isOnline() && !networkSession?.owner)) applyLocalSeaLevel();
  if (ROOM_OWNED_GROUND_KEYS.includes(key) && isOnline()) {
    // Owner: ask the server for the new world; it respawns everyone and echoes the config.
    if (networkSession?.owner) requestRoomTerrain();
    else if (networkSession?.terrain) receiveRoomTerrain(networkSession.terrain);   // guests cannot change it
  } else if (key === 'worldMode') {
    // A new ground means a new spawn in Solo.
    updateWorld(0);
    if (activeMode === 'solo') resetPlayer();
  } else if (key === 'playerControlMode') {
    clearPlayerInput();
    playerView.resetSmoothing();
    if (document.pointerLockElement === renderer.domElement) document.exitPointerLock?.();
  } else if (key === 'playerViewMode') {
    playerView.resetSmoothing();
  } else if (key === 'bodyGaitModel') {
    // As in v3: picking a model writes its recommended lead into the slider instead of applying it invisibly.
    settings.bodyStepLeadScale = GAIT_MODELS[settings.bodyGaitModel]?.stepLeadScale ?? settings.bodyStepLeadScale;
    syncAllControls();
  } else if (key === 'cameraOffsetTarget') {
    syncAllControls();   // the three offset sliders now show the other mode's numbers
  } else if (key === 'unlimitedAmmo') {
    applyUnlimitedAmmo();
  } else if (key?.startsWith('flashlight') || key?.startsWith('laser')) {
    applyFlashlight();
    applyLaser();
  } else if (key === 'weaponPrimary' || key === 'weaponSidearm' || key === 'weaponMelee' || key === 'weaponThrowable' || key === 'weaponGadget' || key === 'weaponGadget2') {
    applyWeaponSelection();
  } else if (key === 'fpPreset') {
    applyFpPreset(settings.fpPreset);
    syncAllControls();
  } else if (key === 'fpViewBlend' || key === 'fpCameraComfort') {
    settings.fpPreset = 'custom';
    syncAllControls();
  } else if (key === 'audioMusicEnabled') {
    applyMusicSetting().catch(reportBaseGameError);
  } else if (key?.startsWith('audio')) {
    applyAudioSettings();
  } else if (key === 'rainOccExtent') {
    controlRegistry.get('rainOccSize')?.sync();
  } else if (key === 'weatherSoundSpeed') {
    controlRegistry.get('lightningDistMax')?.sync();
  } else if (key === 'waveWindDeg' || key === 'weatherWindFollowsWaves') {
    // The wind readout quotes the heading it is actually using, which is the wave one when linked.
    controlRegistry.get('weatherWindDeg')?.sync();
  } else if (key === 'armPreset') {
    // The preset dropdown fills the sliders; sliders then override the preset individually.
    applyArmPresetToSettings(settings.armPreset);
    syncAllControls();
  }
  updateWorld(0);
  scheduleAutosave();
  if (key && sharedSettingKeys.has(key) && activeMode !== 'solo') {
    queueSharedWorldPatch(key);
  }
}
function addToggle(host, key, label) {
  const row = document.createElement('label');
  row.className = 'control-line control';
  const text = document.createElement('span'); text.textContent = label;
  const input = document.createElement('input'); input.type = 'checkbox';
  row.append(text, input); host.append(row);
  input.addEventListener('change', () => { settings[key] = input.checked; changed(key); });
  registerControl(key, () => { input.checked = settings[key]; }, input);
}
function addRange(host, key, label, min, max, step, format = value => String(value)) {
  const wrap = document.createElement('div'); wrap.className = 'control';
  const row = document.createElement('div'); row.className = 'control-line';
  const text = document.createElement('label'); text.textContent = label;
  const output = document.createElement('output');
  const input = document.createElement('input');
  input.type = 'range'; input.min = String(min); input.max = String(max); input.step = String(step);
  row.append(text, output); wrap.append(row, input); host.append(wrap);
  input.addEventListener('input', () => {
    settings[key] = Number(input.value); output.textContent = format(settings[key]); changed(key);
  });
  registerControl(key, () => { input.value = String(settings[key]); output.textContent = format(settings[key]); }, input);
  return wrap;
}
// Rebuild-class sliders: the readout follows the drag, but the setting only commits on RELEASE
// ('change'). Anything routed through here regenerates GPU resources, and a rebuild per drag
// frame races the WebGPU submit (the slider-rebuild crash class) — so never wire these to 'input'.
function addCommitRange(host, key, label, min, max, step, format = value => String(value)) {
  const wrap = document.createElement('div'); wrap.className = 'control';
  const row = document.createElement('div'); row.className = 'control-line';
  const text = document.createElement('label'); text.textContent = label;
  const output = document.createElement('output');
  const input = document.createElement('input');
  input.type = 'range'; input.min = String(min); input.max = String(max); input.step = String(step);
  row.append(text, output); wrap.append(row, input); host.append(wrap);
  input.addEventListener('input', () => { output.textContent = format(Number(input.value)); });
  input.addEventListener('change', () => {
    settings[key] = Number(input.value); output.textContent = format(settings[key]); changed(key);
  });
  registerControl(key, () => { input.value = String(settings[key]); output.textContent = format(settings[key]); }, input);
  return wrap;
}
// The three framing offsets exist twice, once per view mode. One slider edits whichever set
// `cameraOffsetTarget` names; both keys register against it so the settings save/load check (which
// wants every setting to have a control) still passes and both values persist.
const cameraOffsetKey = (base) => (settings.cameraOffsetTarget === 'firstPerson' ? `fp${base[0].toUpperCase()}${base.slice(1)}` : base);
function addCameraOffsetRange(base, label, min, max, step = 0.01) {
  const wrap = document.createElement('div'); wrap.className = 'control';
  const row = document.createElement('div'); row.className = 'control-line';
  const text = document.createElement('label');
  const output = document.createElement('output');
  const input = document.createElement('input');
  input.type = 'range'; input.min = String(min); input.max = String(max); input.step = String(step);
  row.append(text, output); wrap.append(row, input); playerSec.append(wrap);
  const format = value => `${value.toFixed(2)} m`;
  const sync = () => {
    const key = cameraOffsetKey(base);
    text.textContent = `${label} (${settings.cameraOffsetTarget === 'firstPerson' ? '1st' : '3rd'})`;
    input.value = String(settings[key]);
    output.textContent = format(settings[key]);
  };
  input.addEventListener('input', () => {
    const key = cameraOffsetKey(base);
    settings[key] = Number(input.value); output.textContent = format(settings[key]); changed(key);
  });
  registerControl(base, sync, input);
  registerControl(`fp${base[0].toUpperCase()}${base.slice(1)}`, sync, input);
  sync();
}

function addSelect(host, key, label, values, labels = null) {
  const row = document.createElement('label'); row.className = 'control-line control';

    const option = document.createElement('option'); option.value = value; option.textContent = labels?.[values.indexOf(value)] ?? value;
    select.append(option);

  row.append(text, select); host.append(row);
  select.addEventListener('change', () => { settings[key] = select.value; changed(key); });
  registerControl(key, () => { select.value = settings[key]; }, select);
}

// Weapon spread: bot-viewer-v3's labels and ranges, over shot-spread.js instead of botAimSettings.
const spreadSec = createSection(playerSec, 'Weapon spread', { collapsed: true });
function addSpreadRange(label, key, format, title) {
  const [min, max] = SHOT_SPREAD_LIMITS[key];
  const step = (max - min) / 200;
  const wrap = document.createElement('div'); wrap.className = 'control';
  const row = document.createElement('div'); row.className = 'control-line';
  const text = document.createElement('label'); text.textContent = label;
  const output = document.createElement('output');
  const input = document.createElement('input');
  input.type = 'range'; input.min = String(min); input.max = String(max); input.step = String(step);
  row.append(text, output); wrap.append(row, input); spreadSec.append(wrap);
  if (title) wrap.title = title;
  // Not registerControl: that registry is the settings save/load check and these live in a file.
  const sync = () => { input.value = String(shotSpread[key]); output.textContent = format(shotSpread[key]); };
  input.addEventListener('input', () => { shotSpread[key] = Number(input.value); output.textContent = format(shotSpread[key]); applyShotSpread(); });
  shotSpreadSyncs.push(sync);
  sync();
}

// Authoritative player state: reconcile the owning client's prediction and buffer every other
// roster entry for interpolated remote capsules. Shared world values apply as before.
function applyPlayerSnapshot(snapshot, session) {
  if (!simulationReady || !session?.clientId) return;
  const local = snapshot.players?.find(player => player.id === session.clientId);
  if (local) {
    combatState.health = local.health ?? 100;
    if (local.dead && !combatState.dead) combatState.killedBy = snapshot.deaths?.find(d => d.victim === session.clientId)?.killer ?? combatState.killedBy;
    combatState.dead = local.dead === true;
    const weaponId = localWeaponId();
    if (local.ammo && weaponId) Object.assign(localAmmo.ensureAmmo(LOCAL_AMMO_ID, weaponId), { mag: local.ammo.mag, reserve: local.ammo.reserve });
    const now = performance.now();
    for (const raw of snapshot.hits ?? []) {
      const hit = sanitizeBaseGameHitEvent(raw);
      if (!hit) continue;
      playerHitRigDebug.setLastHit(hit.point);
      if (hit.shooter === session.clientId) {
        combatState.hitFlashUntil = now + 180;
        const victim = snapshot.players?.find(p => p.id === hit.victim);
        reticle.hit({ fatal: victim ? victim.dead === true : false });
      }
      if (hit.victim === session.clientId) { combatState.damageUntil = now + 400; audioDirector.localDamage(); }
      else { const l = worldCoordinates.toRenderLocal(hit.point, remoteAudioLocal); audioDirector.hitAt({ x: l[0], y: l[1], z: l[2] }); }
      const victim = snapshot.players?.find(p => p.id === hit.victim);
      spawnHitBlood(hit.point, hit.normal, Math.max(0, (victim?.health ?? 0) / 100));
    }
    for (const death of snapshot.deaths ?? []) if (death.victim === session.clientId) combatState.killedBy = death.killer;
    const before = playerController.getPosition();
    const result = prediction.reconcile(local);
    if (result.hard) {
      correctionOffset.fill(0);
      playerView.resetSmoothing();
      playerController.interpolatedPosition(1, playerRenderPosition);
    } else if (result.replayed > 0 || result.reason === 'replay') {
      const after = playerController.getPosition();
      for (let axis = 0; axis < 3; axis++) correctionOffset[axis] += before[axis] - after[axis];
    }
  }
  remotePlayers.ingestSnapshot(snapshot, session.clientId, performance.now());
  for (const raw of snapshot.shots ?? []) {
    const shot = sanitizeBaseGameShotEvent(raw);
    if (!shot || shot.shooter === session.clientId) continue;   // own shots were predicted at fire time
    const mount = playerBodies.remoteMount(shot.shooter);
    if (shot.dir) spawnMuzzleFlash(mount, shot.dir, shot.weapon);
    spawnShotEffects({ origin: shot.origin, end: shot.end, dir: shot.dir, normal: shot.normal, kind: shot.kind, weaponId: shot.weapon, mount });
  }
  for (const raw of snapshot.explosions ?? []) {
    const blast = sanitizeBaseGameExplosionEvent(raw);
    if (blast) presentExplosion(blast.p, blast.radius, { contact: blast.contact, weaponId: blast.weapon });
  }
  ingestProjectiles(snapshot);
  droneView.ingest(snapshot.drones, snapshot.serverTime);
}

  if (networkUiReady) {

};

// --------------------- state capture / apply ---------------------
function captureAllState() {
  const savedSettings = {};
  for (const key of Object.keys(DEFAULT_SETTINGS)) savedSettings[key] = settings[key];
  return {
    format: STATE_FORMAT,
    version: STATE_VERSION,
    settings: savedSettings,
    camera: {
      position: camera.position.toArray(),
      target: controls.target.toArray(),
      fov: camera.fov,
    },
    world: { renderOrigin: worldCoordinates.getOrigin() },
    terrain: terrainStore.capture(),
    player: {
      ...playerController.captureState(),
      view: playerView.captureState(),
    },
    ui: {
      panelCollapsed: ctrlRoot.classList.contains('collapsed'),
      sections: readSectionStates(ctrlBody),
    },
  };
}

function assignLoadedSettings(loaded, { includeShared = true } = {}) {
  if (!loaded || typeof loaded !== 'object') return;
  for (const [key, fallback] of Object.entries(DEFAULT_SETTINGS)) {
    if (!includeShared && sharedSettingKeys.has(key)) continue;
    const value = loaded[key];
    if (typeof fallback === 'boolean') {
      if (typeof value === 'boolean') settings[key] = value;
    } else if (typeof fallback === 'number') {
      if (!Number.isFinite(value)) continue;
      const limits = NUMBER_LIMITS[key];
      settings[key] = limits ? Math.max(limits[0], Math.min(limits[1], value)) : value;
    } else if (typeof fallback === 'string') {
      const allowed = STRING_VALUES[key];
      if (typeof value === 'string' && (!allowed || allowed.includes(value))) settings[key] = value;
    }
  }
}
function finiteVec3(value) {
  return Array.isArray(value) && value.length === 3 && value.every(Number.isFinite);
}
function applyAllState(payload) {
  const data = payload?.data?.settings ? payload.data : payload;
  if (!data || typeof data !== 'object') throw new Error('State is not an object');
  if (data.format && data.format !== STATE_FORMAT) throw new Error(`Unsupported state format: ${data.format}`);
  assignLoadedSettings(data.settings, { includeShared: canEditSharedSettings() });
  if (finiteVec3(data.world?.renderOrigin)) worldCoordinates.setRenderOrigin(data.world.renderOrigin);
  if (data.terrain) { terrainStore.restore(data.terrain); syncTerrainSourceFromStore(); }
  // A saved transform is a Solo/debug artifact; online, the server's spawn state wins.
  if (data.player && !isOnline()) playerController.applyState(data.player);
  if (data.player?.view) playerView.applyState(data.player.view);

addEventListener('keydown', event => {
  if (activeMode === 'menu' || gameplayPaused || settings.playerControlMode !== 'player') return;
  if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
    event.preventDefault();
    playerKeys.add(event.code);
  }
  if (event.code === 'Space' && !event.repeat) jumpEdgeQueued = true;
  if (event.code === 'KeyV' && !event.repeat) {
    settings.playerViewMode = settings.playerViewMode === 'thirdPerson' ? 'firstPerson' : 'thirdPerson';
    playerView.resetSmoothing();
    syncAllControls();
    changed('playerViewMode');
  }
  if (event.code === 'KeyT' && !event.repeat) { resetPlayer(); scheduleAutosave(); }
  if (event.code === 'KeyR' && !event.repeat) weaponState.reloadEdge = true;
  if (event.code === 'KeyG' && !event.repeat) weaponState.throwEdge = true;
  if (event.code === 'KeyF' && !event.repeat) droneCtl.toggleEdge = true;
  if (event.code === 'KeyB' && !event.repeat) droneCtl.sendEdge = true;
  if (event.code === 'KeyN' && !event.repeat) droneCtl.recallEdge = true;
  if (event.code === 'KeyL' && !event.repeat) {
    // One key, two switches: a tap is the flashlight, a double tap is the laser. The first tap of a
    // pair has already flipped the light by the time the second arrives, so a double tap flips it
    // back — the light blinks for a fraction of a second rather than the tap waiting on a timer to
    // find out what it was. A third tap starts a fresh pair instead of reading as a triple.
    const now = performance.now();

    settings.flashlightOn = !settings.flashlightOn;
    if (kind === 'double') settings.laserOn = !settings.laserOn;
    // The key writes the SETTINGS, so the panel toggles and the key are one switch, not two.
    syncAllControls();
    changed(kind === 'double' ? 'laserOn' : 'flashlightOn');   // applies both
    scheduleAutosaveSafe();
  }
  // Posture toggles, not holds: you do not hold a key to stay lying down. Pressing the key you are
  // already in stands you back up, and either key takes you straight there from the other.
  if (event.code === 'KeyC' && !event.repeat) playerStance = playerStance === 'kneel' ? 'stand' : 'kneel';

  const slotKeys = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6'];
  const slotIndex = slotKeys.indexOf(event.code);

async function savePerformanceCapture(entry) {

    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entry),
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
  return result;
}

async function finishPerformanceCapture(capture, finishedAt) {
  const settingsAtEnd = copyPerformanceSettings();
  const allChanges = changedPerformanceSettings(capture.settingsAtStart, settingsAtEnd);
  const clockWasRunning = capture.settingsAtStart.todPlaying && settingsAtEnd.todPlaying;
  const expectedDynamicChanges = allChanges.filter(change => change.key === 'todHour' && clockWasRunning);
  const changedSettingsDuringCapture = allChanges.filter(change => !expectedDynamicChanges.includes(change));
  const droppedFramesEnd = frameProfiler.snapshot().droppedFrames;

  try {
    const performanceResult = buildPerformanceMeasurement(capture.samples, {
      requestedWindowSeconds: capture.requestedWindowSeconds,
      startedAt: capture.startedAt,
      finishedAt,
      droppedFramesStart: capture.droppedFramesStart,
      droppedFramesEnd,
    });
    const entry = {
      format: 'pcw-base-game-performance-capture',
      version: 1,
      ...(capture.label ? { label: capture.label } : {}),
      capturedAt: new Date().toISOString(),
      configurationStable: changedSettingsDuringCapture.length === 0,
      changedSettingsDuringCapture,
      expectedDynamicChanges,
      settingsAtStart: capture.settingsAtStart,
      settingsAtEnd,
      togglesAtStart: performanceToggles(capture.settingsAtStart),
      performance: performanceResult,
      context: captureContext(),
    };
    const description = capture.label ? `“${capture.label}”` : 'performance capture';
    captureStatus.textContent = `Saving ${description} to disk…`;
    const saved = await savePerformanceCapture(entry);
    captureStatus.textContent = `Saved ${description} as entry ${saved.entryCount} in ${saved.path}.`;
  } catch (error) {
    captureStatus.textContent = `Performance capture failed: ${error.message}. Run this page through serve.py to save to disk.`;
  } finally {
    setPerformanceCaptureBusy(false);
  }
}

function recordPerformanceFrame(frameStart, frameMs) {
  latestPerformanceFrame = {
    frameMs,
    drawCalls: lastRenderInfo.drawCalls,
    triangles: lastRenderInfo.triangles,
  };
  const capture = activePerformanceCapture;
  if (!capture) return;
  // Only allocated while a capture is running, so the idle frame stays allocation-free.
  latestPerformanceFrame.passes = frameProfiler.snapshot(BASE_GAME_PASS_PREFIXES);
  // Not a measurement: frame-profiler defines it as a sum that degenerates to passPostMs here.
  delete latestPerformanceFrame.passes.passGpuAwaitMs;

  // Trim the first draw-to-draw interval at the click boundary instead of attributing
  // pre-capture time to the requested measurement window.
  const sample = capture.samples.length === 0
    ? { ...latestPerformanceFrame, frameMs: Math.min(frameMs, Math.max(0.001, frameStart - capture.startedAt)) }
    : latestPerformanceFrame;
  capture.samples.push(sample);
  const now = performance.now();
  if (now - capture.lastProgressAt >= 500) {
    const remaining = Math.max(0, capture.endsAt - now) / 1000;
    const description = capture.label ? `“${capture.label}”` : 'performance';
    captureStatus.textContent = `Measuring ${description}… ${remaining.toFixed(1)} s remaining`;
    capture.lastProgressAt = now;
  }
  if (now < capture.endsAt) return;
  activePerformanceCapture = null;
  finishPerformanceCapture(capture, now);
}

recordPerformanceButton.addEventListener('click', () => {

  if (activePerformanceCapture) return;
  const requestedWindowSeconds = Number(captureWindowInput.value);
  const startedAt = performance.now();
  const capture = {
    label,
    requestedWindowSeconds,
    startedAt,
    endsAt: startedAt + requestedWindowSeconds * 1000,
    settingsAtStart: copyPerformanceSettings(),
    droppedFramesStart: frameProfiler.snapshot().droppedFrames,
    samples: [],
    lastProgressAt: 0,
  };
  setPerformanceCaptureBusy(true);

  if (requestedWindowSeconds === 0) {
    if (!latestPerformanceFrame) {
      captureStatus.textContent = 'No rendered frame is available yet.';
      setPerformanceCaptureBusy(false);
      return;
    }
    capture.samples.push(latestPerformanceFrame);
    finishPerformanceCapture(capture, startedAt);
    return;
  }
  activePerformanceCapture = capture;
  const description = label ? `“${label}”` : 'performance';
  captureStatus.textContent = `Measuring ${description}… ${requestedWindowSeconds.toFixed(1)} s remaining`;

    : activeMode === 'menu' ? 'menu'
      : `${networkSession?.roomCode || 'online'} ${networkSession?.owner ? 'owner' : 'player'} ${networkStatus.state || ''}`;
  statsEl.textContent = `${shownFps.toFixed(0)} fps · worst ${shownWorst.toFixed(1)} ms · `
    + `${lastRenderInfo.drawCalls} draws · ${formatTriangles(lastRenderInfo.triangles)} tris · ${dropped} dropped · ${sessionText}`;
  if (settings.todPlaying) controlRegistry.get('todHour')?.sync();
  renderNetworkDebug();
  const playerPosition = playerController.getPosition();
  playerStatus.textContent = `WASD / Shift / Space / Ctrl / ${settings.playerViewMode} / `
    + `${playerController.swimming ? 'swimming' : playerController.grounded ? 'grounded' : 'airborne'} / `
    + `xyz ${playerPosition.map(value => value.toFixed(2)).join(', ')}`;
}

async function animate() {
  if (frameBusy) { frameProfiler.markDropped(); return; }
  frameBusy = true;
  try {
    frameProfiler.beginFrame();
    const frameStart = performance.now();
    const frameMs = Math.max(0, frameStart - lastFrameStart);
    lastFrameStart = frameStart;
    const dt = Math.min(0.1, frameMs / 1000);
    // Region marks: these blocks declare bindings the rest of the frame reads, so they cannot be
    // wrapped in closures the way the pass slots below are.
    const tSim = performance.now();

    const online = isOnline();
    const canControl = !gameplayPaused && settings.playerControlMode === 'player';
    const droneInput = canControl ? buildDroneInput() : null;
    const atStick = droneCtl.active;   // the movement keys are the drone's; the body stands (the server's rule too)
    const input = canControl ? {
      moveX: atStick ? 0 : (playerKeys.has('KeyD') ? 1 : 0) - (playerKeys.has('KeyA') ? 1 : 0),
      moveZ: atStick ? 0 : (playerKeys.has('KeyW') ? 1 : 0) - (playerKeys.has('KeyS') ? 1 : 0),
      yaw: playerView.yaw,
      pitch: playerView.pitch,
      sprint: !atStick && (playerKeys.has('ShiftLeft') || playerKeys.has('ShiftRight')),
      crouch: playerKeys.has('ControlLeft'),   // swim down; posture is its own channel below
      stance: stanceIndex(playerStance),
      slot: weaponState.slot,
      aim: !atStick && weaponState.aiming,   // the right button is not a zoom while flying
      fire: weaponState.firing,
    } : { moveX: 0, moveZ: 0, yaw: playerView.yaw, pitch: playerView.pitch, sprint: false, crouch: false, stance: stanceIndex(playerStance), slot: weaponState.slot, aim: false, fire: false };
    if (!canControl) { weaponState.reloadEdge = false; weaponState.throwEdge = false; }
    // The jump edge is cleared only when a simulation tick actually consumes it: a frame with zero
    // fixed steps (high refresh rates, pacing below 1x) must not swallow the key press.
    if (!canControl) jumpEdgeQueued = false;
    if (online) {
      // Lockstep ticks: every fixed step is numbered, sent to the server, and replayed exactly on
      // reconciliation. Paused or Orbit mode keeps ticking with neutral input so the server and
      // the local simulation never fall out of step.
      const stepped = prediction.advance(dt, () => {
        const jump = jumpEdgeQueued;
        jumpEdgeQueued = false;
        const reload = weaponState.reloadEdge;
        weaponState.reloadEdge = false;
        const thrown = weaponState.throwEdge;
        weaponState.throwEdge = false;
        stepLocalTrigger(prediction.tick + 1, input.fire, reload, input.aim);   // predicted: the server echoes the same action tick
        stepLocalThrow(prediction.tick + 1, thrown);
        return { ...input, jump: atStick ? false : jump, reload, throw: thrown, drone: droneInput };
      });
      playerInterpolationAlpha = stepped.alpha;
      playerController.interpolatedPosition(playerInterpolationAlpha, playerRenderPosition);
      const keep = Math.exp(-CORRECTION_DECAY_RATE * dt);
      for (let axis = 0; axis < 3; axis++) {
        correctionOffset[axis] *= keep;
        if (Math.abs(correctionOffset[axis]) < 1e-4) correctionOffset[axis] = 0;
        playerRenderPosition[axis] += correctionOffset[axis];
      }
    } else if (canControl) {
      playerController.setInput(input);
      if (jumpEdgeQueued) { if (!atStick) playerController.queueJump(); jumpEdgeQueued = false; }
      stepSoloDrones(dt, canControl, droneInput);
      const soloReload = weaponState.reloadEdge;
      weaponState.reloadEdge = false;
      const soloThrow = weaponState.throwEdge;
      weaponState.throwEdge = false;
      const stepped = playerController.advance(dt);
      for (let i = 0; i < stepped.steps; i++) {
        stepLocalTrigger(++soloTriggerTick, input.fire, soloReload && i === 0, input.aim);
        stepLocalThrow(soloTriggerTick, soloThrow && i === 0);
      }
      // Solo kill plane; online the server enforces the same layout value.
      if (playerController.getPosition(playerPositionScratch)[1] < worldKillPlaneY(playerPositionScratch)) resetPlayer();
      playerInterpolationAlpha = stepped.alpha;
      playerController.interpolatedPosition(playerInterpolationAlpha, playerRenderPosition);
    } else {
      playerController.interpolatedPosition(1, playerRenderPosition);
    }
    frameProfiler.mark('playerSim', performance.now() - tSim);
    const tView = performance.now();
    if (canControl) {
      worldCoordinates.maybeRebase(playerController.getPosition(playerPositionScratch));
      playerView.syncCapsule(playerRenderPosition, {
        visible: settings.playerCapsuleVisible && settings.playerViewMode === 'thirdPerson',
        grounded: playerController.grounded,
      });
      const comfort = FP_COMFORT[settings.fpCameraComfort] ?? FP_COMFORT.off;
      const firstPerson = settings.playerViewMode === 'firstPerson';
      const firstPersonEye = firstPerson && fpState.hasEye;
      const comfortOn = firstPersonEye && !weaponState.aiming;
      playerView.updateCamera(dt, playerRenderPosition, {
        mode: settings.playerViewMode,
        distance: settings.cameraDistance,
        followRate: settings.cameraFollowRate,
        obstructionPadding: settings.cameraObstructionPadding,
        // Each mode's own framing, never the other's.
        sideOffset: firstPerson ? settings.fpCameraSideOffset : settings.cameraSideOffset,
        heightOffset: firstPerson ? settings.fpCameraHeightOffset : settings.cameraHeightOffset,
        // The eyes sit ahead of the head centre; the body's own value, not a guess.
        forwardOffset: (firstPerson ? settings.fpCameraForwardOffset : settings.cameraForwardOffset)
          + (firstPersonEye ? playerBodies.localEyeForward() : 0),
        // Eye height is the body's live eye height (rig eyes ~1.96 m on a 1.8 m capsule, not 1.62).
        eyeAnchorY: firstPersonEye ? fpState.eye[1] : null,
        comfortRateY: comfortOn ? comfort.y : 0,
      });
      applyAimOptics();   // FOV/zoom/eye push before the gun frame reads the camera
      if (droneCtl.active) { camera.fov = settings.cameraFov; camera.updateProjectionMatrix(); droneView.placeCamera(camera, droneCtl.id, dt); }   // at the stick, the camera rides the drone; no zoom
    } else {
      if (settings.playerControlMode === 'orbit') controls.update();
      playerView.syncCapsule(playerRenderPosition, {
        visible: settings.playerCapsuleVisible,
        grounded: playerController.grounded,
      });
    }
    // Bodies read the same render position the capsule uses; the controller is never touched.
    frameProfiler.mark('playerView', performance.now() - tView);
    const tBodies = performance.now();
    // Third-person rigs show only in third-person view, lower-body rigs only in first-person.
    const firstPerson = settings.playerViewMode === 'firstPerson';
    const bodyVisible = settings.playerBodyMode === 'lowerBody' ? firstPerson : true;
    // First person on the full rig: head and torso masked so they never clip the camera.
    const wantMask = firstPerson && settings.playerBodyMode === 'thirdPerson' && canControl;
    if (wantMask !== fpState.masked) { fpState.masked = wantMask; playerBodies.setLocalPartMask(wantMask ? FP_PART_MASK : FP_PART_MASK_NONE); }
    // View blend: preset value, pulled to 1 by aiming and toward 0 by sprinting, eased.
    const sprinting = canControl && input.sprint && (input.moveX !== 0 || input.moveZ !== 0);
    const blendTarget = !wantMask ? 0 : weaponState.aiming ? 1 : sprinting ? settings.fpViewBlend * 0.3 : settings.fpViewBlend;
    fpState.viewBlend += (blendTarget - fpState.viewBlend) * (1 - Math.exp(-6 * dt));
    fpState.aimAmount += ((weaponState.aiming ? 1 : 0) - fpState.aimAmount) * (1 - Math.exp(-10 * dt));
    // The authored viewmodel pose, lifted from camera space into the world for the mount blend.
    const vmSpeed = Math.hypot(playerController.getVelocity()[0], playerController.getVelocity()[2]);
    const vmPose = weaponViewModel.update(dt, { speed: vmSpeed, aim: fpState.aimAmount, running: sprinting, moveX: input.moveX, moveZ: input.moveZ, lookYaw: playerView.yaw });
    let viewFrame = null;
    if (wantMask && vmPose.visible && fpState.viewBlend > 1e-3) {
      camera.updateMatrixWorld(true);
      fpLocalMatrix.compose(fpViewPos.fromArray(vmPose.position), fpViewQuat.setFromEuler(fpViewEuler.set(vmPose.rotation[0], vmPose.rotation[1], vmPose.rotation[2], 'XYZ')), fpScale.set(1, 1, 1));
      fpWorldMatrix.multiplyMatrices(camera.matrixWorld, fpLocalMatrix).decompose(fpViewPos, fpViewQuat, fpScale);
      viewFrame = fpViewFrame;
    }
    {
      // A footstep is the body's actual foot plant (bob-phase fallback if no body is running),
      // placed at that foot and panned to its side. Fall speed is last frame's: touching down zeroed it.
      const v = playerController.getVelocity(audioVelocityScratch);
      audioStepRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
      audioStepFeet.x = playerRenderPosition[0]; audioStepFeet.y = playerRenderPosition[1]; audioStepFeet.z = playerRenderPosition[2];
      audioDirector.updateLocal(dt, {
        speed: canControl ? Math.hypot(v[0], v[2]) : 0,
        grounded: playerController.grounded,
        verticalSpeed: v[1],
        feet: audioBodyStepped ? playerBodies.localBody?.gait?.feet ?? null : null,   // hidden body: feet freeze, use the bob fallback
        bobPhase: weaponViewModel.bobPhase,
        position: audioStepFeet,
        right: audioStepRight,
      });
    }
    playerBodies.setLocalAim(canControl && weaponState.aiming, canControl && weaponState.aiming ? updateLocalAimPoint() : null);
    updateReticle(canControl);
    audioBodyStepped = playerBodies.updateLocal(dt, {
      globalFoot: worldCoordinates.toGlobal(playerRenderPosition),
      velocity: playerController.getVelocity(),
      yaw: playerView.yaw,
      pitch: playerView.pitch,
      grounded: playerController.grounded,
      // Standing height: the RIG does the crouching, from the weights below. Feeding it the
      // shrunken capsule height instead would squash the whole body like a scale slider.
      height: playerController.config.height,
      radius: playerController.config.radius,
      stance: playerController.stance,
      stanceWeights: playerController.stanceWeights,
      visible: bodyVisible,
      viewFrame,
      viewBlend: viewFrame ? fpState.viewBlend : 0,
      overhead: combatState.dead ? null : heldGadgetKind(),   // both hands up with the gadget
    });
    fpState.hasEye = !!playerBodies.localEyePoint(fpState.eye);
    stepPlayerBodyPose(localCombatPose, {
      position: playerController.getPosition(), velocity: playerController.getVelocity(),
      yaw: playerView.yaw, pitch: playerView.pitch, grounded: playerController.grounded,
      swimming: playerController.swimming, aiming: weaponState.aiming, tick: playerController.tick,
      fixedHz: playerController.config.fixedHz, alive: !combatState.dead,
    });
    playerHitRigDebug.update(localCombatPose, {
      visible: settings.playerHurtRigVisible,
      zoneColors: settings.playerHurtZoneColors,
      joints: settings.playerHurtJoints,
      lastHit: settings.playerLastHitVisible,
    });
    if (online) {
      remotePlayers.update(performance.now(), { interpolationDelayMs: settings.interpolationDelayMs });
      playerBodies.beginRemoteFrame();
      if (settings.remoteBodiesEnabled) {
        for (const [id, record] of remotePlayers.players) {
          if (!record.sample) continue;
          worldCoordinates.toRenderLocal(record.sample.position, remoteAudioLocal);
          remoteAudioPos.x = remoteAudioLocal[0]; remoteAudioPos.y = remoteAudioLocal[1]; remoteAudioPos.z = remoteAudioLocal[2];
          audioDirector.updateRemote(id, {
            dt,
            position: remoteAudioPos,
            grounded: record.sample.grounded,
            action: record.sample.action,
            actionTick: record.sample.actionTick,
            weapon: record.sample.weapon,
          });
          playerBodies.updateRemote(dt, id, {
            globalFoot: record.sample.position,
            velocity: record.sample.velocity,
            yaw: record.sample.yaw,
            pitch: record.sample.pitch,
            grounded: record.sample.grounded,
            weapon: isBaseGameGadget(record.sample.weapon) ? null : record.sample.weapon,
            aiming: record.sample.aiming,
            action: record.sample.action,
            actionTick: record.sample.actionTick,
            bodyModel: record.sample.bodyModel,
            stance: record.sample.stance,
            overhead: isBaseGameGadget(record.sample.weapon) ? record.sample.weapon : null,
          });
          // A gadget in a remote's hands is drawn overhead by the drone view, not the weapon mount.
          const remoteHands = playerBodies.heldAnchor(id, remoteHeadLocal);
          if (!remoteHands) { worldCoordinates.toRenderLocal(record.sample.position, remoteHeadLocal); remoteHeadLocal[1] += 2.3; }
          droneView.showHeld(id, isBaseGameGadget(record.sample.weapon) ? record.sample.weapon : null, remoteHeadLocal, remoteHands ? remoteHands.yaw : record.sample.yaw, !remoteHands);
        }
      }
      playerBodies.endRemoteFrame();
      for (const id of [...playerBodies.remoteIds]) if (!remotePlayers.players.has(id)) { playerBodies.releaseRemote(id); audioDirector.releaseRemote(id); droneView.hideHeld(id); }
    } else {
      playerBodies.flushWeapons();
    }
    droneView.update(performance.now(), dt, { interpolationDelayMs: online ? settings.interpolationDelayMs : 0 });
    // The gadget in the local hands: between the solved hands when the rig is drawn, over the head otherwise.
    const localHands = playerBodies.heldAnchor('local', localHeadLocal);
    if (!localHands) { localHeadLocal[0] = playerRenderPosition[0]; localHeadLocal[1] = playerRenderPosition[1] + 2.3; localHeadLocal[2] = playerRenderPosition[2]; }
    droneView.showHeld('local', combatState.dead ? null : heldGadgetKind(), localHeadLocal, localHands ? localHands.yaw : playerView.yaw, !localHands);
    frameProfiler.mark('bodies', performance.now() - tBodies);
    sky.group.position.copy(camera.position);
    frameProfiler.time('audio', () => envAudio.update(frameStart));
    frameProfiler.time('terrain', () => terrain.update(playerController.getPosition(playerPositionScratch), dt));
    // terrain.update's own slot hides three very different costs; split them out.
    const terrainCost = terrain.frameCost;
    frameProfiler.mark('terrainFold', terrainCost.foldMs);
    frameProfiler.mark('terrainField', terrainCost.fieldMs);
    frameProfiler.mark('terrainInstall', terrainCost.installMs);
    frameProfiler.mark('terrainColorize', terrainCost.colorizeMs);
    frameProfiler.mark('terrainBatch', terrainCost.batchMs);
    frameProfiler.mark('terrainCollider', terrainCost.colliderMs);
    if (terrain.takeHandoffCompleted() && !isOnline()) reseatPlayerOnTerrain(1);
    frameProfiler.time('water', () => {
      water.update(dt, camera.position, playerController.waterTime + playerInterpolationAlpha * playerFixedDt);
      if (water.underwater !== underwaterAudio) { underwaterAudio = water.underwater; envAudio.setUnderwater?.(underwaterAudio); }
    });
    if ((terrainRuntimeTick = (terrainRuntimeTick + 1) % 15) === 0) { refreshTerrainRuntimeLine(); refreshGrassRuntimeLine(); }
    frameProfiler.time('fx', () => { updateProjectiles(performance.now(), dt); updateShotEffects(performance.now()); debrisSim.step(dt); debrisRenderer.sync(); flashLights.update(dt); const gunLight = weaponLightSource(canControl); weaponLight.update(dt, gunLight); updateWeaponLaser(dt, gunLight); });
    // Elapsed seconds, not dt: this drives the wind phase, and a delta holds it still.
    await frameProfiler.timeAsync('grassGpu', () => flora.update(frameStart / 1000));
    frameProfiler.time('sky', () => updateWorld(dt));
    // After the sky slot: the drop tint reads scene.background, which updateWorld has just written.
    frameProfiler.time('weather', () => {
      rain.update(dt, camera, {
        underwater: settings.rainUnderwaterOff && water.underwater,
        skyColor: scene.background,
      });
      // The lockstep clock the swell already rides: the one clock the client and the server agree
      // on, so two peers strike at the same instant without a message.
      lightning.update(dt, playerController.waterTime, camera.position, {
        onThunder: distance => { if (settings.weatherThunder) audioDirector.thunderAt(distance, settings.weatherThunderVolume); },
      });
      const bedLevel = settings.weatherRainBed && !gameplayPaused ? rain.system.getDensity() : 0;
      audioDirector.setRainBed(bedLevel, settings.weatherRainBedVolume);
    });
    // Its own slot: the bake is a whole extra scene render, and folded into `weather` it would read
    // as rain randomly costing several milliseconds.
    frameProfiler.time('rainBake', updateRainOccluders);
    if (!terrainStudio.open) {
      // postRender is CPU encode (measured: gpuRenderMs ~1 ms against passPostMs 3-12), and the
      // planar mirror re-renders the whole scene inside it every reflectRate frames. Split the
      // encode by whether the mirror ran, so its marginal cost is a measurement, not a subtraction
      // of two numbers from different captures.
      const reflectPassesBefore = water.reflectStats.passes;
      const encodeStart = performance.now();
      if (settings.dofEnabled) {
        syncDofParams();
        if (settings.dofAutoFocus) depthOfField.updateFocus(dt, measureCentreDistance());
        postPipeline.render();
      } else {
        renderer.render(scene, camera);
      }
      const encodeMs = performance.now() - encodeStart;
      frameProfiler.mark('postRender', encodeMs);
      const mirrored = water.reflectStats.passes > reflectPassesBefore;
      frameProfiler.mark('reflect', mirrored ? water.reflectStats.lastMs : 0);
      frameProfiler.mark(mirrored ? 'postMirror' : 'postPlain', encodeMs);
    }
    if (GPU_TIMESTAMPS) resolveFrameTimestamps();
    // Everything in the frame that no slot above covers. snapshot() allocates, so this residual is
    // only computed while a capture is running.
    if (activePerformanceCapture) frameProfiler.mark('frameOther', Math.max(0, performance.now() - frameStart - profiledMs()));
    lastRenderInfo = {
      drawCalls: renderer.info.render.drawCalls,
      triangles: renderer.info.render.triangles,
    };
    sky.flushDisposals();
    updateStats(frameMs);
    recordPerformanceFrame(frameStart, frameMs);
  } finally {
    frameBusy = false;
  }
}

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
});

addEventListener('beforeunload', () => {
  stopRebasePresentation();
  playerView.dispose();
  playerBodies.dispose();
  playerHitRigDebug.dispose();
  remotePlayers.dispose();
  envAudio.dispose();
  traversalLab.dispose();
  terrain.dispose();
}, { once: true });

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
